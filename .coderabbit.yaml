# CodeRabbit AI 코드 리뷰 설정 — https://docs.coderabbit.ai/reference/configuration
# 공개 저장소라 무료 플랜으로 전체 리뷰가 됩니다. GitHub App 설치는 조직 owner가 app.coderabbit.ai 에서 합니다.
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR
tone_instructions: "한국어로 간결하게. 실제 버그·보안·계약 위반을 우선하고, 취향 문제는 짧게 제안만 한다."

reviews:
  profile: chill
  request_changes_workflow: false    # 승인·변경요청은 사람(CODEOWNERS)이 한다
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  # 리뷰에서 뺄 파일 (생성물·잠금 파일·래퍼·빌드 산출물)
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradlew"
    - "!gradlew.bat"
    - "!gradle/wrapper/**"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/*.min.js"
    - "!**/dist/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.gif"
    - "!**/*.svg"

  # 경로별 리뷰 지침 (README 3·5장 규칙)
  path_instructions:
    - path: "libs/**"
      instructions: >
        공통 코드는 두 개 이상의 서비스가 같은 방식으로 해야 하는 것만 둔다(오류 형식·헤더·traceId·로그·시간).
        도메인 엔티티, 다른 서비스 DTO, Valkey 키, 비즈니스 로직이 들어오면 지적한다.
        변경은 추가만 허용한다. 기존 public 시그니처 변경·삭제는 하위 호환을 깨므로 반드시 지적한다.
        gateway는 WebFlux라 common-web을 쓸 수 없다. gateway에서 common-web 의존이 보이면 지적한다.
    - path: "contracts/**"
      instructions: >
        OpenAPI·이벤트 스키마다. 기존 필드의 타입·이름·필수 여부 변경, 응답 구조 변경은 하위 호환을 깨므로 반드시 짚는다.
        필드 추가만 있는지, 새 엔드포인트·이벤트인지 구분해 요약한다.
    - path: "services/*/src/main/resources/db/migration/**"
      instructions: >
        Flyway 파일명은 V{yyyyMMddHHmm}__{설명}.sql 형식이어야 한다. 이미 머지된 마이그레이션 파일 수정은 금지다.
        블루/그린 배포라 확장→전환→정리 순서를 지킨다. 컬럼 삭제·이름 변경·NOT NULL 추가가 컬럼 추가와 같은 PR에 있으면 지적한다.
        새 컬럼은 NULL 허용이거나 기본값이 있어야 한다. INSERT 로 시드 데이터를 넣는 SQL은 커밋 금지다.
    - path: "services/**/*.java"
      instructions: >
        Spring Boot 3 · Java 21. DB는 UTC, API 응답 시각은 +09:00, 영업일은 서울 기준(Times 유틸)이다.
        외부 입력을 그대로 믿는 코드, N+1 쿼리, 트랜잭션 경계 누락, 예외를 삼키는 catch 를 지적한다.
        다른 서비스의 DB·엔티티를 직접 참조하면 지적한다(서비스 간 통신은 API·이벤트로).
    - path: "services/gateway/**"
      instructions: >
        Spring Cloud Gateway(WebFlux)다. 블로킹 호출(block(), JDBC, RestTemplate)이 있으면 지적한다.
        외부에서 들어온 X-User-Id 같은 내부 헤더는 제거하고 JWT 검증 후 다시 세팅해야 한다.
    - path: "services/ai/**"
      instructions: >
        Python 서비스다. 타입 힌트, 예외 처리, 외부 API 키 하드코딩 여부를 본다.
    - path: "frontend/**"
      instructions: >
        React · Vite · TypeScript. 폴더 구조는 FSD(Feature-Sliced Design)를 따른다.
        레이어는 app → pages → widgets → features → entities → shared 순이며, import 는 반드시 아래 레이어만 바라본다.
        같은 레이어의 다른 슬라이스를 import 하거나 위 레이어를 import 하면 지적한다.
        슬라이스 바깥에서는 슬라이스의 index.ts(public API)만 import 해야 하며, 내부 파일을 직접 import 하면 지적한다.
        비즈니스 로직이 shared 에 들어가거나 API 호출이 entities·features 밖에 흩어지면 지적한다.
        any 남용, 미처리 Promise, 키 없는 리스트 렌더링, API 응답 타입 불일치를 본다.
        토큰·시크릿이 번들에 들어가는지 확인한다.
    - path: "infra/terraform/**"
      instructions: >
        시크릿·계정 ID·ARN 하드코딩, 0.0.0.0/0 인바운드, 퍼블릭 S3, 암호화 미설정을 지적한다.
        destroy 를 유발하는 리소스 교체(force new)가 있으면 요약에 명시한다.
    - path: "lambdas/**"
      instructions: >
        AWS Lambda 핸들러다. 환경변수 누락, 재시도 시 멱등성, 타임아웃 처리를 본다.
    - path: ".github/**"
      instructions: >
        워크플로 권한(permissions)은 최소로, 서드파티 액션은 버전 고정인지 확인한다. 시크릿이 로그에 출력되지 않는지 본다.

  # 정적 분석 도구 — gitleaks 는 별도 워크플로가 있어 중복 알림을 막기 위해 끈다
  tools:
    gitleaks:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "README.md"
      - "docs/conventions.md"
      - "contracts/README.md"
