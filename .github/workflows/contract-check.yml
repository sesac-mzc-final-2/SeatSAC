# 2.2.7 계약 CI — contracts/ 를 바꾸는 PR에서 실행
#   1) OpenAPI lint (Redocly)
#   2) JSON Schema 자체 검증 + 예시 메시지 검증 (check-jsonschema)
#   3) base 브랜치 대비 하위 호환 검사: OpenAPI(oasdiff breaking) · 이벤트·공용 스키마(check_schema_compat.py)
# 깨지는 변경은 실패. 설계 단계(구현 전)에 일부러 바꾸는 경우만 PR 라벨 'contract-break-ok' + CODEOWNERS 승인으로 경고 처리.
# 구현과 계약 일치(springdoc 생성본 vs contracts) 검사는 서비스 구현 후 pr-check 에 추가한다 (2단계).
name: contract-check
# 필수 검사로 걸기 때문에 paths 필터를 두지 않는다 (필터로 안 돌면 PR이 "Expected"에서 막힘).
# 대신 changes job이 contracts 변경 여부를 보고, 변경이 없으면 lint·compat를 건너뛴다(건너뛴 job = 성공 처리).
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: contract-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REDOCLY_VERSION: "1.34.5"
  OASDIFF_VERSION: "1.11.7"
  CHECK_JSONSCHEMA_VERSION: "0.38.2"
  BREAK_OK: ${{ contains(github.event.pull_request.labels.*.name, 'contract-break-ok') }}

jobs:
  changes:
    name: 변경 감지
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.diff.outputs.contracts }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
               | grep -qE '^(contracts/|\.github/workflows/contract-check\.yml$)'; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint (OpenAPI · JSON Schema · 예시)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: OpenAPI lint
        run: |
          npx -y @redocly/cli@${REDOCLY_VERSION} lint --config contracts/redocly.yaml \
            --format=github-actions \
            contracts/openapi/*.yaml contracts/openapi/internal/*.yaml

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "check-jsonschema==${CHECK_JSONSCHEMA_VERSION}"
      - name: JSON Schema 자체 검증
        run: check-jsonschema --check-metaschema contracts/events/*.json contracts/schemas/*.json
      - name: 예시 메시지 검증 (examples/{스키마 이름}/*.json)
        run: |
          set -e
          for dir in contracts/events/examples/* contracts/schemas/examples/*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            schema=""
            for cand in contracts/events/"$name".json contracts/schemas/"$name".json; do
              [ -f "$cand" ] && schema="$cand"
            done
            if [ -z "$schema" ]; then echo "::error::examples/$name 에 맞는 스키마 파일이 없습니다"; exit 1; fi
            echo "→ $schema"
            check-jsonschema --schemafile "$schema" "$dir"/*.json
          done

  compat:
    name: 하위 호환 (base 대비)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                       # PR head
      - uses: actions/checkout@v4                       # base 브랜치
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: oasdiff 설치
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/bin" oasdiff
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/oasdiff" --version

      - name: OpenAPI 하위 호환 (oasdiff breaking)
        run: |
          status=0
          echo "## OpenAPI 변경" >> "$GITHUB_STEP_SUMMARY"
          for f in contracts/openapi/*.yaml contracts/openapi/internal/*.yaml; do
            if [ ! -f "base/$f" ]; then
              echo "- 새 명세: \`$f\`" >> "$GITHUB_STEP_SUMMARY"; continue
            fi
            echo "### \`$f\`" >> "$GITHUB_STEP_SUMMARY"
            oasdiff changelog "base/$f" "$f" --format markdown >> "$GITHUB_STEP_SUMMARY" || true
            oasdiff breaking "base/$f" "$f" --format githubactions --fail-on ERR || status=1
          done
          for f in $(cd base && ls contracts/openapi/*.yaml contracts/openapi/internal/*.yaml 2>/dev/null || true); do
            if [ ! -f "$f" ]; then echo "::error file=$f::명세 파일 삭제"; status=1; fi
          done
          if [ "$status" -ne 0 ] && [ "$BREAK_OK" = "true" ]; then
            echo "::warning::깨지는 변경이 있지만 'contract-break-ok' 라벨로 통과 처리합니다 (CODEOWNERS 승인 필수)"
            status=0
          fi
          exit "$status"

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 이벤트·공용 스키마 하위 호환
        run: |
          extra=""
          [ "$BREAK_OK" = "true" ] && extra="--warn-only"
          python3 contracts/tools/check_schema_compat.py base/contracts contracts $extra
