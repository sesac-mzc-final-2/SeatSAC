# PR에 terraform plan 결과를 코멘트로 남긴다. apply는 하지 않는다 (03b).
# 사전 조건: GitHub OIDC 역할 cinema-gha-tf-plan (infra/terraform/global, ReadOnly + state 읽기·잠금 파일) → secrets.AWS_TERRAFORM_PLAN_ROLE_ARN
name: infra-plan
on:
  pull_request:
    paths: ["infra/terraform/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      # EKS API 공개 허용 대역 — 공인 IP라 커밋하지 않고 Secret에서 (JSON 배열, 예: ["203.0.113.10/32"])
      TF_VAR_eks_public_access_cidrs: ${{ secrets.EKS_PUBLIC_ACCESS_CIDRS }}
    defaults:
      run:
        working-directory: infra/terraform/envs/staging
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2
      - run: terraform fmt -check -recursive ..   # envs/staging + envs/staging-k8s
      # staging-k8s는 plan 하지 않는다(클러스터 접근·state 권한 없음, apply는 관리자 로컬). 문법만 확인
      - run: terraform -chdir=../staging-k8s init -backend=false -input=false && terraform -chdir=../staging-k8s validate
      - run: terraform init -backend-config=backend.hcl -input=false
      - run: terraform validate
      - id: plan
        run: terraform plan -var-file=staging.tfvars -no-color -input=false 2>&1 | tail -n 200 > plan.txt
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '```\n' + fs.readFileSync('infra/terraform/envs/staging/plan.txt', 'utf8') + '\n```';
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
