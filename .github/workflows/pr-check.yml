name: pr-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon      # Testcontainers 는 ubuntu 러너의 Docker 사용
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.21.2"   # 버전 고정 (올릴 때 여기만)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # PR 커밋 범위를 보려면 전체 이력 필요
      - name: Install gitleaks (체크섬 확인)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tgz\$" | sha256sum -c -
          tar -xzf "$tgz" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan PR commits
        run: |
          gitleaks git --redact --verbose --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
  # 계약 lint·하위 호환은 contract-check.yml (2.2.7)
  # TODO: 구현-계약 일치(springdoc 생성본 vs contracts/openapi, oasdiff) — 서비스 구현 후, Trivy(build-push)
