name: pr-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon      # Testcontainers 는 ubuntu 러너의 Docker 사용
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  # 계약 lint·하위 호환은 contract-check.yml (2.2.7)
  # TODO: 구현-계약 일치(springdoc 생성본 vs contracts/openapi, oasdiff) — 서비스 구현 후, Trivy(build-push)
