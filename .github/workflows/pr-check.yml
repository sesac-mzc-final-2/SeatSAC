name: pr-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon      # Testcontainers 는 ubuntu 러너의 Docker 사용
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
  # TODO: OpenAPI diff (springdoc 생성본 vs contracts/openapi), Trivy (build-push 에서), ai pytest
