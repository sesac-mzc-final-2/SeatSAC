name: pr-check
on:
  pull_request:
permissions:
  contents: read
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon      # Testcontainers 는 ubuntu 러너의 Docker 사용
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: "8.21.2"   # 버전 고정 (올릴 때 여기만)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # PR 커밋 범위를 보려면 전체 이력 필요
      - name: Install gitleaks (체크섬 확인)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tgz"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tgz\$" | sha256sum -c -
          tar -xzf "$tgz" -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan PR commits
        run: |
          gitleaks git --redact --verbose --exit-code 1 \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  # ---- 3.1.4 이미지 검사: 바뀐 서비스만 docker build + Trivy (push 안 함, AWS 권한 없음) --------
  # main 머지 뒤 build-push가 같은 Dockerfile·같은 스크립트로 진짜 이미지를 만든다 → 여기서 먼저 깨지는지 본다
  # 필수 검사 이름은 집계 job "image" 하나 (서비스별 matrix 이름은 PR마다 달라서 ruleset에 걸 수 없다)
  image-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 이미지 검사 대상 고르기
        id: pick
        env:
          MODE: pr
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/changed-services.sh

  image-build:
    needs: image-changes
    if: needs.image-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.image-changes.outputs.services) }}
    env:
      SVC: ${{ matrix.service }}
      IMG: pr-check/${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: true } # PR은 캐시를 읽기만 (main 캐시를 PR이 덮어쓰지 않게)
      - name: bootJar
        run: ./gradlew ":services:$SVC:bootJar" --no-daemon -x test # 테스트는 java job
      - name: 이미지 빌드 (x86, push 안 함)
        run: docker build --platform linux/amd64 -t "$IMG" "services/$SVC"
      - name: 비루트 확인 (런타임 계약 1장 runAsNonRoot)
        run: |
          user=$(docker image inspect -f '{{.Config.User}}' "$IMG")
          [[ "$user" =~ ^[0-9]+$ && "$user" != 0 ]] || { echo "::error::Dockerfile USER가 숫자 UID(0 아님)가 아니다: '$user' (docs/service-runtime-contract.md 4장)"; exit 1; }
          echo "USER $user"
      - name: Trivy
        run: bash .github/scripts/trivy-scan.sh "$IMG" "cinema/$SVC (PR)"

  image:
    # ruleset 필수 검사는 이 job. 대상이 없으면(건너뜀) 성공, 하나라도 실패·취소면 실패
    needs: [image-changes, image-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 결과
        env:
          CHANGES: ${{ needs.image-changes.result }}
          BUILD: ${{ needs.image-build.result }}
          SERVICES: ${{ needs.image-changes.outputs.services }}
        run: |
          echo "대상 $SERVICES · image-changes=$CHANGES · image-build=$BUILD"
          [ "$CHANGES" = success ] || { echo "::error::대상 고르기 실패"; exit 1; }
          case "$BUILD" in
            success|skipped) echo "이미지 검사 통과" ;;
            *) echo "::error::이미지 빌드·Trivy 실패 — image-build 로그 확인 (런북 13장)"; exit 1 ;;
          esac

  # ---- 3.3.5 frontend 검사: frontend/** 가 바뀐 PR만 (frontend-deploy 와 같은 node 24 · npm ci · npm run build) ----
  # node 는 24 (jsdom 30·vitest 가 22.22+ 를 요구, 로컬 개발도 24). 올릴 때 frontend-deploy 와 같이 올린다
  # 필수 검사 이름은 "frontend". frontend 변경이 없으면 건너뜀 = 성공 (contract-check 의 변경 감지와 같은 방식).
  # 이 워크플로 자체가 바뀐 PR도 돌리되, frontend 프로젝트(package-lock.json)가 아직 없으면 건너뛴다.
  frontend-changes:
    name: frontend 변경 감지
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # --no-renames: frontend/ 밖으로 옮긴 파일도 이전 경로(삭제)로 잡힌다
          files=$(git diff --no-renames --name-only "$BASE" HEAD)
          if grep -qE '^frontend/' <<<"$files"; then
            echo "frontend/ 변경 → 검사"; echo "changed=true" >> "$GITHUB_OUTPUT"
          elif grep -qxF '.github/workflows/pr-check.yml' <<<"$files" && [ -f frontend/package-lock.json ]; then
            echo "워크플로 변경 → 검사"; echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend 변경 없음 → 건너뜀"; echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    # ruleset 필수 검사는 이 job. 변경 감지가 실패하면(skipped = 통과로 새지 않게) 여기서 실패시킨다
    needs: frontend-changes
    if: always() && (needs.frontend-changes.result != 'success' || needs.frontend-changes.outputs.changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 변경 감지 결과 확인
        if: needs.frontend-changes.result != 'success'
        working-directory: .
        run: |
          echo "::error::frontend 변경 감지 실패 (result=${{ needs.frontend-changes.result }}) — frontend-changes 로그 확인"
          exit 1
      - uses: actions/checkout@v4
      - name: package-lock.json 확인
        run: test -f package-lock.json || { echo "::error::frontend/package-lock.json 이 없다 (npm ci 에 필요. 커밋한다)"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: check (tsc -b · eslint · steiger FSD · vitest)
        run: npm run check
      - name: build (vite)
        env:
          VITE_API_BASE_URL: /api
        run: |
          npm run build
          test -f dist/index.html || { echo "::error::dist/index.html 이 없다 (vite build outDir 확인)"; exit 1; }

  # 계약 lint·하위 호환은 contract-check.yml (2.2.7)
  # TODO: 구현-계약 일치(springdoc 생성본 vs contracts/openapi, oasdiff) — 서비스 구현 후
