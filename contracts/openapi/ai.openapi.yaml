openapi: 3.1.0
info:
  title: seatsac ai API
  version: "1.4"
  description: |
    API 명세서 v1.4 15장 (AI-01·AI-04 · 김서현, ADR-82~87). 로그인한 사용자가 회차·잔여석·편성·내 예매를
    자연어로 묻는 챗봇. 처리는 비용이 낮은 경로부터 — 정확 일치 캐시 → 의미 캐시 → (Claude 1회 호출로) 프리셋
    또는 NL2SQL. 검색 대상은 ai 파드 메모리의 SQLite 스냅샷(공개 API로 채운 데이터)뿐이고 기존 MSA DB는 건드리지 않는다.
    외부 호출은 `/api` 접두사, Gateway가 StripPrefix=1 (`/api/ai/chat` → ai `/ai/chat`).
    gateway 플래그 `APP_AI_ENABLED=false`(기본)면 라우트 자체가 없어 **404 NOT_FOUND**(유효한 토큰으로 인증됐을 때. 토큰이 없거나 만료·서명 불일치면 gateway 인증이 라우팅보다 먼저라 401) — 화면은 챗봇 창을 열 때 부른
    `GET /ai/presets`가 404면 「준비 중」 안내 뒤 챗봇 버튼을 숨긴다(로그인·메인 진입 때 자동 호출 없음 — 런북 6-G-5). 켜져 있을 때 `/api/ai/**` 라우트만 응답 타임아웃 28초(ai 요청 전체 기한 25초).
    조회 중심이며 `/ai/chat`은 `Idempotency-Key`를 받지 않는다(좌석 잡기는 ai가 확인 요청 때 만든 키를 쓴다). 오류 코드 4개(`AI_*`)는 `services/ai` 안에서 정의하고 형식은
    `contracts/schemas/error.v1.json` 그대로.
servers:
  - url: /api
security: []   # 기본 인증 없음. 두 operation 모두 security: [ { bearerAuth: [] } ] (USER)
tags:
  - { name: chat, description: "챗봇 질문 (AI-01)" }
  - { name: presets, description: "추천 질문 목록 (AI-04)" }

paths:

  /ai/chat:
    post:
      tags: [chat]
      operationId: sendChatMessage
      summary: AI-01 자연어 질문 → 답 문장 + 결과 표
      x-feature-id: AI-01
      description: |
        처리 순서(15-2): ① 길이 검사·동시 1건(`ai:inflight:{userId}`)·분/일 한도 → 409/429
        ② 개인 질문("내 예매"·"예매 내역" 등)이면 `GET {PUBLIC_API_BASE_URL}/users/me/bookings`를 요청의 `Authorization`
        그대로 호출해 템플릿 문장으로 답(`path: MY_BOOKINGS`, 캐시·Claude 전송 없음)
        ③ 정규화·슬롯 추출(`{time}`·`{date}`·`{theater}`·`{movie}`·`{n}`) → 템플릿 질문
        ④ 정확 일치 캐시 적중 → 저장된 SQL 템플릿에 이번 슬롯 값으로 SQLite 실행(`CACHE_EXACT`, 토큰 0)
        ⑤ 의미 캐시(코사인 ≥ 0.92 **그리고** 슬롯 종류 같음) 적중 → 같이 실행(`CACHE_SEMANTIC`, 토큰 0)
        ⑥ Claude 1회 호출(도구 `run_preset`·`run_sql`·`ask_user`·`out_of_scope`) → `PRESET`·`NL2SQL`·`CLARIFY`·`OUT_OF_SCOPE`.
           `run_sql`은 16장 검증 → 실패하면 사유를 붙여 1회 재요청 → 또 실패면 `REJECTED`.
           **의미 검사**: 질문에서 뽑은 날짜·극장·영화가 SQL(프리셋 포함) 조건에 없거나 다르면 실행하지 않고 재요청 →
           호출을 다 쓰도록 어긋나면 `CLARIFY`(조건 확인 버튼). OR·범위처럼 읽지 못한 조건은 통과.
           **잔여석**: 잔여석을 읽는 SQL은 실행 직전에 그 SQL의 날짜 × 극장 회차만 공개 API에서 새로 받는다(질문 시점 값).
           잔여석을 묻는데 날짜가 없으면 `CLARIFY`(날짜 버튼). booking이 늦어 확인 못 한 잔여석은 null + 답 문장 안내
        ⑦ SQLite 읽기 전용 실행(5초·최대 500행) ⑧ 성공한 PRESET·NL2SQL만 캐시 저장(1시간, 결과 행은 저장하지 않음).
        **`REJECTED`·`OUT_OF_SCOPE`도 200**(결제 거절 200과 같은 원칙). 사용자당 동시 1건 · 분당 10회 · 하루 100회.
        `sessionId`는 서버가 UUID로 발급한다. 생략·만료(30분)·다른 사용자의 것·위조면 **오류 없이 새 세션**으로 시작한다
        (키 `ai:session:{userId}:{sessionId}`로 사용자별 격리). Claude 호출은 질문 1건당 최대 3회, 전체 기한 25초.

        **채팅으로 좌석 잡기 (ai 플래그 `APP_AI_SEAT_HOLD_ENABLED`, 기본 `true` — `false`로 끌 수 있다. 꺼져 있으면 위 설명 그대로이고
        `HOLD_*` 경로가 나오지 않으며 `seatHold`는 늘 null)**: "오늘 20시 ○○ 건대입구 J7 J8 잡아줘"
        ⑥에서 Claude가 도구 `hold_seats`(영화·극장·날짜·시각·좌석 이름)를 고르면 ai가
        - 좌석 이름은 Claude가 준 것 중 **이번 `message` 원문에 적힌 것만** 쓴다(좌석을 골라 주지 않는다, 최대 4석)
        - (영화 또는 극장) + (날짜 또는 시각)이 없으면 회차를 좁히지 않고 되묻는다. 스냅샷에서 예매할 수 있는(시작 5분 전까지) 회차가
          하나면 진행, 2~7개면 `HOLD_GUIDE` + `choices` 회차 버튼(확인 버튼과 같은 2분 기한 — `seatHold.confirmExpiresAt`),
          8개 이상이면 조건을 더 묻는다
        - 공개 API `GET /screenings/{id}/seats` → `GET /auditoriums/{id}/layout?version=`(좌석 현황이 말한 배치 버전)로
          좌석 이름 → `seatId`·빈 좌석인지 확인한 뒤 **확인 요청**(`HOLD_CONFIRM`)을 돌려준다. 이때는 선점하지 않는다.
        확인 요청마다 일회용 확인 ID를 만들어 `choices` 두 버튼의 `message`에 싣는다(`좌석 잡기 #c7f2a1`·`취소 #c7f2a1`, 버튼 글자는
        「J7·J8 잡기」·「취소」). 잡을 내용은 ai Valkey `ai:pending:{userId}:{sessionId}`(2분, `seatHold.confirmExpiresAt`)에 둔다.
        화면이 확인 버튼의 `message`를 **직전 응답의 `sessionId`**로 보내면 ai는 Claude 없이 그 대기 행동을 꺼내(한 번 쓰면 사라진다)
        **확인 ID가 같을 때만** `POST {PUBLIC_API_BASE_URL}/seats/hold`를 요청의 `Authorization` 그대로 + 저장해 둔 `Idempotency-Key`로
        부르고 결과를 `HOLD_RESULT`로 답한다(시간 초과·연결 오류면 같은 키로 1회만 재시도). 대기 행동이 없거나(만료·취소·다른 세션·
        다른 사용자·그 사이 다른 질문) 확인 ID가 다르면(지난 확인 요청의 버튼) 선점하지 않는다. ID 없이 타이핑한 「좌석 잡기」는 확인이 아니다
        (대기 행동이 있으면 버튼을 누르라는 안내, 없으면 평소 질문으로 처리 — ID 없이 타이핑한 「취소」도 대기 행동이 있을 때만 취소로 받는다).
        선점에 **성공하면** 그 결과(확인 ID·`bookingId`·좌석 이름·금액·만료 시각 — 토큰 없음)를 `ai:held:{userId}:{sessionId}`에 선점이
        남은 동안(5분 이내)만 둔다. 응답이 화면에 닿지 못해(예: gateway 시간 초과) **같은 확인 ID가 같은 `sessionId`로 다시 오면**
        booking을 다시 부르지 않고 같은 `HOLD_RESULT`를 돌려준다(다른 사용자·다른 세션·다른 확인 ID·기한 뒤에는 `NOT_CONFIRMED`).
        좌석 잡기 흐름 동안 응답의 `sessionId`는 바뀌지 않는다. 결제는 채팅에서 하지 않는다 — 화면이 `seatHold.bookingId`로 결제 화면 링크를,
        `seatHold.screeningId`로 좌석 화면 링크를 만든다. 좌석 현황·예매 결과는 Claude에 보내지 않고 캐시·세션 문맥에도 남기지 않는다.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
            examples:
              first:
                summary: 첫 질문 (sessionId 없음)
                value: { message: "오늘 20시 이후에 시작하는 영화 알려줘" }
              followUp:
                summary: 후속 질문 (직전 응답의 sessionId)
                value: { message: "그중 건대입구만", sessionId: "0b9f1c3e-6d0a-4b7e-9a51-1f2e3d4c5b6a" }
      responses:
        "200":
          description: |
            답. `path`로 처리 경로를 구분하고 화면은 `answer` 문장 + `columns`/`rows` 표 + "`asOf` 기준"을 보여준다.
            `screeningIds`가 있으면 표의 그 행에 좌석 선택 화면(화면 라우트 `/screenings/{screeningId}` — API 경로가 아님)으로 가는 링크를 붙인다.
            `llm.calls`가 0이면 Claude API를 부르지 않은 것(캐시·내 예매) — 데모 화면에 그대로 표시.
            `REJECTED`(SQL 검증 거부)·`OUT_OF_SCOPE`(답할 수 없는 질문)·`CLARIFY`(되묻기)도 200이며 `columns`·`rows`는 null.
            `CLARIFY`는 `choices` 버튼을 보여 주고, 누르면 그 `message`를 같은 `sessionId`로 보낸다(버튼 없이 안내 문장만 올 수도 있다 — 빈 배열).
            `sql`은 `REJECTED`일 때 거부된 SQL(화면은 보여주지 않아도 됨), `OUT_OF_SCOPE`는 null.
            `HOLD_CONFIRM`·`HOLD_RESULT`·`HOLD_GUIDE`(좌석 잡기 플래그가 켜졌을 때만)도 200이며 `columns`·`rows`는 null,
            `seatHold`에 회차·좌석·예매 ID·금액이 온다. 선점 실패(좌석이 이미 잡힘·진행 중인 선점 있음·예매 마감·booking 응답 없음)도
            200 + `seatHold.reason`이다(화면이 좌석 화면·진행 중인 예매로 가는 링크를 보여 주려고). 확인 단계에서 토큰이 없거나 만료면 401
            (토큰이 없으면 대기 행동을 꺼내기 전에 401 — 다시 로그인한 뒤 같은 버튼을 누를 수 있다).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
              examples:
                cacheSemantic: { $ref: "./examples/ai/chat-cache-semantic.json" }
                preset: { $ref: "./examples/ai/chat-preset.json" }
                nl2sql: { $ref: "./examples/ai/chat-nl2sql.json" }
                myBookings: { $ref: "./examples/ai/chat-my-bookings.json" }
                rejected: { $ref: "./examples/ai/chat-rejected.json" }
                clarify: { $ref: "./examples/ai/chat-clarify.json" }
                holdConfirm: { $ref: "./examples/ai/chat-hold-confirm.json" }
                holdResult: { $ref: "./examples/ai/chat-hold-result.json" }
                holdGuide: { $ref: "./examples/ai/chat-hold-guide.json" }
                holdGuideScreenings: { $ref: "./examples/ai/chat-hold-guide-screenings.json" }
        "400":
          description: |
            VALIDATION_FAILED — `message` 없음·빈 문자열(공백만)·300자 초과(`details[{ field: "message", reason: LENGTH }]`),
            `sessionId` 형식 오류(`details[{ field: "sessionId", reason: FORMAT }]`), JSON 아님
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFoundFlagOff" }
        "409":
          description: AI_QUERY_IN_PROGRESS — 같은 사용자의 질문이 처리 중(동시 1건, `ai:inflight:{userId}` 40초). 화면은 진행 중 답을 기다리게 하고 재시도 버튼을 막는다. `details` 빈 배열
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: AI_QUERY_IN_PROGRESS
                message: "이전 질문을 아직 처리하고 있습니다."
                traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
                details: []
        "429":
          description: |
            AI_QUOTA_EXCEEDED — 사용자당 분당 10회·하루 100회 초과(ai 앱 안 비용 보호, gateway 요청 수 제한 ADR-62와 다름).
            `details[{ field: "quota", value: "10/min" 또는 "100/day", reason: PER_MINUTE 또는 PER_DAY }]`.
            응답 헤더 `Retry-After`(초). 화면은 그 시간 뒤 다시 시도하라고 안내한다
          headers:
            Retry-After:
              description: 다시 시도할 수 있을 때까지의 초(분 한도는 다음 분까지, 일 한도는 KST 자정까지)
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: AI_QUOTA_EXCEEDED
                message: "분당 질문 한도를 넘었습니다."
                traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
                details: [ { field: quota, value: "10/min", reason: PER_MINUTE } ]
        "503":
          description: |
            AI_LLM_UNAVAILABLE — Claude API 문제 또는 한도를 기록할 수 없음. 아무것도 바뀌지 않음, 화면은 잠시 뒤 재시도.
              `details[{ field: "provider", value: "anthropic", reason }]`, reason = TIMEOUT(전체 기한 25초 또는 호출 1회 15초 초과) ·
              OVERLOADED · RATE_LIMITED · SPEND_LIMIT(월 지출 한도) · CIRCUIT_OPEN ·
              `details[{ field: "quotaStore", value: "ai-valkey", reason: QUOTA_STORE_UNAVAILABLE }]`(ai Valkey에 한도를
              기록하지 못함 — 한도 확인 없이 Claude를 부르지 않는다)
            AI_SNAPSHOT_NOT_READY — 기동 직후 SQLite 스냅샷 첫 적재 전(readiness가 막으므로 드묾). `details` 빈 배열
            SERVICE_UNAVAILABLE — "내 예매" 공개 API(`/users/me/bookings`) 실패(`details[{ field: "upstream", value: "user" }]`),
              또는 gateway — ai 파드 없음(`ng-ai` 0대, `details[{ field: "service", value: "ai", reason: "UPSTREAM_UNAVAILABLE" }]`)·
              라우트 응답 28초 초과(같은 형식, reason `UPSTREAM_TIMEOUT`). 화면은 챗봇을 비활성 안내로 보여준다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: AI_LLM_UNAVAILABLE
                message: "AI 응답 시간이 초과되었습니다."
                traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
                details: [ { field: provider, value: anthropic, reason: TIMEOUT } ]

  /ai/presets:
    get:
      tags: [presets]
      operationId: listPresets
      summary: AI-04 추천 질문 목록 (화면 버튼)
      x-feature-id: AI-04
      description: |
        `services/ai/src/seatsac_ai/resources/presets.yaml`의 프리셋 13개를 화면 버튼용으로 돌려준다(17-4).
        버튼을 누르면 화면은 빈칸(시각·개수는 입력창에서 고치기, 극장·영화·날짜·등급은 고르는 버튼)을 사용자가 정하게 한 뒤
        질문 문장을 `POST /ai/chat`의 `message`로 보낸다. 빈칸이 없는 질문과 화면이 모르는 프리셋은 `example`을 그대로 보낸다
        (별도 프리셋 실행 API 없음).
        정적 목록이라 ai 자체는 503을 내지 않는다. 화면은 **챗봇 창을 열 때** 이 API를 부른다 — 로그인·메인 진입 때
        자동 호출은 하지 않는다(좌석 데모·부하 테스트 중 `ng-ai` 0대라도 ai 트래픽 0, 런북 6-G-5). 404(플래그 off)면
        「준비 중」 안내 뒤 챗봇 버튼을 숨기고, 503(ai 파드 없음)이면 비활성 안내를 보여준다.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: 추천 질문 목록. 페이징 없음(`{ items }`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetList" }
              example:
                items:
                  - { presetId: today_after_time, title: "오늘 ○시 이후 회차", example: "오늘 20시 이후에 시작하는 영화 알려줘" }
                  - { presetId: theater_schedule, title: "극장 편성표", example: "내일 건대입구 편성표 보여줘" }
                  - { presetId: movie_theaters, title: "영화별 상영 극장·시간", example: "영화 제목 어디서 몇 시에 해?" }
                  - { presetId: most_remaining_today, title: "잔여석 많은 오늘 회차", example: "오늘 자리 많이 남은 회차 5개" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFoundFlagOff" }
        "503":
          description: SERVICE_UNAVAILABLE (gateway) — ai 파드 없음(`ng-ai` 0대·기동 중, `details[].reason` `UPSTREAM_UNAVAILABLE`) 또는 라우트 응답 28초 초과(`UPSTREAM_TIMEOUT`). 화면은 챗봇 비활성 안내
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT   # Cognito Access Token (ID 토큰 아님). gateway가 검증하고 X-User-Id(= sub)·X-User-Role을 넣는다

  responses:
    Unauthorized:
      description: UNAUTHORIZED (Gateway) — 토큰 없음(reason TOKEN_REQUIRED)·만료·서명 불일치
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFoundFlagOff:
      description: NOT_FOUND (Gateway) — 플래그 `APP_AI_ENABLED=false`라 `/api/ai/**` 라우트가 없음. 유효한 토큰으로 인증됐을 때만 이 404가 보이고, 토큰이 없거나 만료·서명 불일치면 gateway 인증이 라우팅보다 먼저라 401(`Unauthorized`). 화면은 챗봇을 숨긴다. ai 자체는 404를 내지 않는다
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    ErrorResponse:
      $ref: "../schemas/error.v1.json"

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 300
          description: 사용자 질문 원문. 공백만이면 400. 서버 로그에는 원문을 남기지 않는다(해시만)
        sessionId:
          type: string
          format: uuid
          description: 직전 응답의 `sessionId`(후속 질문 문맥). 없거나 이 사용자의 것이 아니면 새 세션

    ChatPath:
      type: string
      enum: [CACHE_EXACT, CACHE_SEMANTIC, PRESET, NL2SQL, MY_BOOKINGS, REJECTED, OUT_OF_SCOPE, CLARIFY, HOLD_CONFIRM, HOLD_RESULT, HOLD_GUIDE]
      description: |
        CACHE_EXACT 정확 일치 캐시(토큰 0) · CACHE_SEMANTIC 의미 캐시(토큰 0) · PRESET Claude가 프리셋 선택 ·
        NL2SQL Claude가 SQL 생성 · MY_BOOKINGS 내 예매(공개 API, 토큰 0) · REJECTED SQL 검증 거부(`rejection` 참고) ·
        OUT_OF_SCOPE 답할 수 없는 질문(안내 문장만) · CLARIFY 되묻기(잔여석 질문에 날짜가 없음, 또는 질문 조건을 SQL에 반영하지 못함 — `choices`)
        좌석 잡기(플래그 `APP_AI_SEAT_HOLD_ENABLED`가 켜졌을 때만 — 기본 켜짐): HOLD_CONFIRM 확인 요청(아직 선점하지 않음 — `choices` 확인·취소) ·
        HOLD_RESULT 선점을 시도한 결과(성공이면 `seatHold.bookingId`, 실패면 `seatHold.reason`. 확인 단계라 토큰 0) ·
        HOLD_GUIDE 선점하지 않고 안내(회차 고르기 `choices`·없는 좌석·이미 잡힌 좌석·좌석 미지정·취소·확인 시간 만료 — `seatHold.reason`)

    Column:
      type: object
      required: [name, type]
      properties:
        name: { type: string, description: "결과 열 이름(SQL 별칭). 화면 표 머리글" }
        type:
          type: string
          enum: [text, integer, real]
          description: SQLite 값 종류. 시각·날짜는 KST 문자열(`text`)

    LlmUsage:
      type: object
      description: 이 질문에서 Claude API를 부른 횟수와 토큰. 캐시 적중·내 예매는 모두 0
      required: [calls, inputTokens, outputTokens, cacheReadTokens]
      properties:
        calls: { type: integer, minimum: 0, maximum: 3, description: "도구 선택 1 + 검증 실패 재요청 1 + SQL 오류 재요청 1" }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        cacheReadTokens: { type: integer, minimum: 0, description: "프롬프트 캐싱으로 읽은 토큰(절감 그래프와 따로 표시)" }
        cacheWriteTokens: { type: integer, minimum: 0, description: "프롬프트 캐시에 쓴 토큰(첫 호출 때만)" }

    Rejection:
      type: object
      description: "`path: REJECTED`일 때만. SQL 검증(16장)·실행 실패 사유"
      required: [reason, message]
      properties:
        reason:
          type: string
          pattern: "^[A-Z_]+$"
          description: |
            NOT_SELECT(SELECT·WITH…SELECT가 아님) · MULTI_STATEMENT(`;`로 이어진 두 문장) · FORBIDDEN_OBJECT(movie·theater·screening
            밖의 대상, `object`에 이름) · FORBIDDEN_FUNCTION(ATTACH·PRAGMA·load_extension·재귀 CTE 등) · PARSE_ERROR ·
            SQL_ERROR(실행 오류, 1회 재요청 뒤에도 실패) · TIMEOUT(SQLite 5초 초과)
        message: { type: string, description: "사용자에게 보여줄 안내(개발용 상세는 로그)" }
        object: { type: [string, "null"], description: "FORBIDDEN_OBJECT일 때 거부된 테이블·함수 이름" }

    ChatResponse:
      type: object
      description: 모든 필드가 항상 있다. 경로에 해당 없는 값은 null(`columns`·`rows`·`screeningIds`·`sql`·`presetId`·`rejection`·`choices`·`seatHold`)
      required: [sessionId, answer, path, columns, rows, screeningIds, rowCount, truncated, sql, presetId, asOf, llm, latencyMs, rejection, choices, seatHold]
      properties:
        sessionId: { type: string, format: uuid, description: "서버가 발급. 후속 질문에 그대로 보낸다(30분)" }
        answer: { type: string, description: "답 문장(결과 행을 템플릿에 채워 만듦, Claude에 결과를 다시 보내지 않음). 끝에 \"○시 ○분 기준\"" }
        path: { $ref: "#/components/schemas/ChatPath" }
        columns:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Column" }
          description: 결과 표 머리글. REJECTED·OUT_OF_SCOPE는 null
        rows:
          type: [array, "null"]
          maxItems: 500
          items:
            type: array
            items: { type: [string, integer, number, "null"], description: "`Column.type` text → string, integer → integer, real → number. SQLite에 boolean은 없다(0·1 integer)" }
          description: "`columns` 순서의 값 배열. 최대 500행(`truncated`). MY_BOOKINGS는 본인 예매만. REJECTED·OUT_OF_SCOPE·CLARIFY는 null. 잔여석(remaining_seats)이 null이면 확인 불가(booking이 늦게 답함)"
        screeningIds:
          type: [array, "null"]
          maxItems: 500
          items: { type: [integer, "null"], format: int64, description: "그 행의 회차 ID(catalog `screeningId`와 같은 값). 회차를 알 수 없는 행은 null" }
          description: |
            `rows`와 같은 길이·같은 순서의 회차 ID. 화면은 이 값으로 그 행의 좌석 선택 화면 링크를 만든다
            (ai는 화면 경로를 만들지 않는다). **행 하나가 회차 하나일 때만** 채운다 — `screening`을 집계·DISTINCT·UNION 없이
            조회했고 그 회차의 `starts_at`이 결과 열에 그대로 있을 때. 그 밖(영화별 회차 수 같은 집계, 영화·극장 목록, 0건,
            MY_BOOKINGS·REJECTED·OUT_OF_SCOPE·CLARIFY)은 null. 경로(PRESET·NL2SQL·CACHE_*)와 상관없이 같은 규칙이다.
            ID는 서버가 실행할 때만 덧붙여 얻는다 — `columns`·`rows`·`sql`에는 나오지 않는다.
            스냅샷 기준(`asOf`)이라 그 뒤 매진·예매 마감(상영 시작 5분 전)은 좌석 화면·booking이 판단한다
        rowCount: { type: integer, minimum: 0, description: "`rows` 길이(null이면 0)" }
        truncated: { type: boolean, description: "500행에서 잘렸으면 true(LIMIT 없는 SQL은 LIMIT 500을 붙여 실행)" }
        sql:
          type: [string, "null"]
          description: 실행한 SQLite SQL(공개 데이터라 노출해도 됨). REJECTED면 거부된 SQL. PRESET·MY_BOOKINGS·OUT_OF_SCOPE는 null
        presetId: { type: [string, "null"], description: "PRESET·캐시 적중(프리셋 유래)일 때 프리셋 ID, 그 밖은 null" }
        asOf:
          type: string
          format: date-time
          description: 스냅샷 기준 시각(오늘 회차 1분·나머지 10분 갱신). 잔여석 답은 질문 시점에 새로 받은 시각. MY_BOOKINGS는 공개 API 호출 시각. +09:00
        llm: { $ref: "#/components/schemas/LlmUsage" }
        latencyMs: { type: integer, minimum: 0, description: "ai 안 처리 시간(ms)" }
        rejection:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/Rejection" }
        choices:
          type: [array, "null"]
          maxItems: 7
          items: { $ref: "#/components/schemas/Choice" }
          description: "CLARIFY일 때 버튼 목록(날짜 고르기 최대 7개, 조건을 다시 말해 달라는 안내는 빈 배열). 좌석 잡기 플래그가 켜졌으면 HOLD_CONFIRM(확인·취소 2개 — message에 확인 ID)·HOLD_GUIDE(회차 고르기 2~7개, 버튼이 없으면 null)·HOLD_RESULT `reason: HOLD_NOT_SENT`(같은 확인·취소 버튼을 다시, 확인 시간이 남았을 때)에도 온다. 그 밖은 null"
        seatHold:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/SeatHold" }
          description: "항상 있다. HOLD_* 경로(ai 플래그 `APP_AI_SEAT_HOLD_ENABLED`가 켜졌을 때만 나온다 — 기본 켜짐)에서만 객체, 그 밖은 null"

    SeatHold:
      type: object
      description: |
        채팅으로 좌석 잡기의 요약. ai는 URL을 만들지 않는다 — 화면이 `bookingId`로 결제 화면(`/bookings/{bookingId}/pay`),
        `screeningId`로 좌석 선택 화면(`/screenings/{screeningId}`) 링크를 만든다. 모든 필드가 항상 있고 해당 없으면 null(`seatLabels`는 빈 배열).
      required: [screeningId, bookingId, seatLabels, amount, expiresAt, confirmExpiresAt, reason]
      properties:
        screeningId: { type: [integer, "null"], format: int64, description: "회차 ID(좌석 화면 링크용). 회차를 하나로 정하지 못했으면 null" }
        bookingId: { type: [integer, "null"], format: int64, description: "HOLD_RESULT 성공이면 새 PENDING 예매 ID(결제 화면 링크용). `reason: ACTIVE_HOLD_EXISTS`면 진행 중인 예매 ID(booking이 알려 주지 않으면 null — 화면은 null이면 결제 화면 링크를 만들지 않는다). 그 밖은 null" }
        seatLabels: { type: array, maxItems: 4, items: { type: string }, description: "좌석 이름(예: J7). 사용자가 이번 message에 적은 것(대문자), 성공이면 booking이 확정한 것" }
        amount: { type: [integer, "null"], description: "HOLD_RESULT 성공일 때만 booking이 확정한 금액(원). 확인 요청에는 금액을 적지 않는다(요금 규칙은 booking의 것) — null" }
        expiresAt: { type: [string, "null"], format: date-time, description: "선점 만료 시각(+09:00, 결제 기한). HOLD_RESULT 성공·ACTIVE_HOLD_EXISTS(booking이 알려 줄 때)일 때만. 화면은 지나면 결제 화면 링크를 숨긴다" }
        confirmExpiresAt: { type: [string, "null"], format: date-time, description: "`choices` 버튼을 누를 수 있는 기한(+09:00, 버튼을 낸 뒤 2분 — 대기 행동 `ai:pending`의 만료 시각). HOLD_CONFIRM·회차 고르기 HOLD_GUIDE(`reason: SCREENING_AMBIGUOUS` + `choices`)·HOLD_RESULT `HOLD_NOT_SENT`(버튼이 다시 올 때)에만. 화면은 이 값이 있으면 지난 뒤 버튼을 막는다" }
        reason:
          type: [string, "null"]
          pattern: "^[A-Z_]+$"
          description: |
            선점하지 않았거나 못한 까닭. HOLD_CONFIRM·HOLD_RESULT 성공은 null.
            HOLD_GUIDE: SCREENING_NOT_FOUND(회차·영화·극장을 못 찾음) · SCREENING_AMBIGUOUS(회차가 여럿이거나 조건이 모자람 — `choices`로 고르거나 조건을 더 말한다) ·
            SCREENING_STARTED(시작했거나 예매 마감 — 시작 5분 전) · SEATS_REQUIRED(좌석 이름 없음 — 좌석 화면으로) · TOO_MANY_SEATS(5석 이상) ·
            SEAT_NOT_FOUND(그 상영관에 없는 좌석·이름이 겹치는 좌석) · SEAT_UNAVAILABLE(이미 잡힌 좌석) · CANCELED(취소) ·
            NOT_CONFIRMED(확인할 대기 행동이 없음 — 2분 만료·지난 확인 요청의 버튼·버튼 없이 타이핑) ·
            UPSTREAM_UNAVAILABLE(좌석 현황·배치도를 확인하지 못함).
            HOLD_RESULT 실패: SEAT_UNAVAILABLE · ACTIVE_HOLD_EXISTS · SCREENING_STARTED(booking 오류 코드 그대로) ·
            HOLD_NOT_SENT(선점 요청을 보내지 못함 — 좌석은 잡히지 않았다. 확인 시간이 남았으면 같은 버튼이 다시 온다) ·
            UPSTREAM_UNAVAILABLE(보냈으나 결과 모름 — 같은 키로 1회 재시도 뒤에도 응답 없음. 선점됐을 수도 있으니 화면에서 확인) · HOLD_FAILED(그 밖의 거절)

    Choice:
      type: object
      required: [label, message]
      properties:
        label: { type: string, description: "버튼 글자 (예: 내일 11/19(목))" }
        message: { type: string, maxLength: 300, description: "누르면 `POST /ai/chat`의 `message`로 그대로 보내는 완성된 질문" }

    Preset:
      type: object
      required: [presetId, title, example]
      properties:
        presetId: { type: string, minLength: 1, description: "presets.yaml 키. 응답 `presetId`와 같은 값" }
        title: { type: string, description: "버튼 글자" }
        example: { type: string, maxLength: 300, description: "버튼을 누르면 `POST /ai/chat`의 `message`로 보내는 문장" }

    PresetList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Preset" } }
