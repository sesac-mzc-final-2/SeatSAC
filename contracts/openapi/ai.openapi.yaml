openapi: 3.1.0
info:
  title: seatsac ai API
  version: "1.4"
  description: |
    API 명세서 v1.4 15장 (AI-01·AI-04 · 김서현, ADR-82~87). 로그인한 사용자가 회차·잔여석·편성·내 예매를
    자연어로 묻는 챗봇. 처리는 비용이 낮은 경로부터 — 정확 일치 캐시 → 의미 캐시 → (Claude 1회 호출로) 프리셋
    또는 NL2SQL. 검색 대상은 ai 파드 메모리의 SQLite 스냅샷(공개 API로 채운 데이터)뿐이고 기존 MSA DB는 건드리지 않는다.
    외부 호출은 `/api` 접두사, Gateway가 StripPrefix=1 (`/api/ai/chat` → ai `/ai/chat`).
    gateway 플래그 `APP_AI_ENABLED=false`(기본)면 라우트 자체가 없어 **404 NOT_FOUND** — 화면은 첫 `GET /ai/presets`
    404로 챗봇 버튼을 숨긴다. 켜져 있을 때 `/api/ai/**` 라우트만 응답 타임아웃 28초(ai 요청 전체 기한 25초).
    조회 전용이라 `Idempotency-Key`는 받지 않는다. 오류 코드 4개(`AI_*`)는 `services/ai` 안에서 정의하고 형식은
    `contracts/schemas/error.v1.json` 그대로.
servers:
  - url: /api
security: []   # 기본 인증 없음. 두 operation 모두 security: [ { bearerAuth: [] } ] (USER)
tags:
  - { name: chat, description: "챗봇 질문 (AI-01)" }
  - { name: presets, description: "추천 질문 목록 (AI-04)" }

paths:

  /ai/chat:
    post:
      tags: [chat]
      operationId: sendChatMessage
      summary: AI-01 자연어 질문 → 답 문장 + 결과 표
      x-feature-id: AI-01
      description: |
        처리 순서(15-2): ① 길이 검사·동시 1건(`ai:inflight:{userId}`)·분/일 한도 → 409/429
        ② 개인 질문("내 예매"·"예매 내역" 등)이면 `GET {PUBLIC_API_BASE_URL}/users/me/bookings`를 요청의 `Authorization`
        그대로 호출해 템플릿 문장으로 답(`path: MY_BOOKINGS`, 캐시·Claude 전송 없음)
        ③ 정규화·슬롯 추출(`{time}`·`{date}`·`{theater}`·`{movie}`·`{n}`) → 템플릿 질문
        ④ 정확 일치 캐시 적중 → 저장된 SQL 템플릿에 이번 슬롯 값으로 SQLite 실행(`CACHE_EXACT`, 토큰 0)
        ⑤ 의미 캐시(코사인 ≥ 0.92 **그리고** 슬롯 종류 같음) 적중 → 같이 실행(`CACHE_SEMANTIC`, 토큰 0)
        ⑥ Claude 1회 호출(도구 `run_preset`·`run_sql`·`out_of_scope`) → `PRESET`·`NL2SQL`·`OUT_OF_SCOPE`.
           `run_sql`은 16장 검증 → 실패하면 사유를 붙여 1회 재요청 → 또 실패면 `REJECTED`
        ⑦ SQLite 읽기 전용 실행(5초·최대 500행) ⑧ 성공한 PRESET·NL2SQL만 캐시 저장(1시간, 결과 행은 저장하지 않음).
        **`REJECTED`·`OUT_OF_SCOPE`도 200**(결제 거절 200과 같은 원칙). 사용자당 동시 1건 · 분당 10회 · 하루 100회.
        `sessionId`는 서버가 UUID로 발급한다. 생략·만료(30분)·다른 사용자의 것·위조면 **오류 없이 새 세션**으로 시작한다
        (키 `ai:session:{userId}:{sessionId}`로 사용자별 격리). Claude 호출은 질문 1건당 최대 3회, 전체 기한 25초.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
            examples:
              first:
                summary: 첫 질문 (sessionId 없음)
                value: { message: "오늘 20시 이후에 시작하는 영화 알려줘" }
              followUp:
                summary: 후속 질문 (직전 응답의 sessionId)
                value: { message: "그중 건대입구만", sessionId: "0b9f1c3e-6d0a-4b7e-9a51-1f2e3d4c5b6a" }
      responses:
        "200":
          description: |
            답. `path`로 처리 경로를 구분하고 화면은 `answer` 문장 + `columns`/`rows` 표 + "`asOf` 기준"을 보여준다.
            `llm.calls`가 0이면 Claude API를 부르지 않은 것(캐시·내 예매) — 데모 화면에 그대로 표시.
            `REJECTED`(SQL 검증 거부)·`OUT_OF_SCOPE`(답할 수 없는 질문)도 200이며 `columns`·`rows`·`sql`은 null.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
              examples:
                cacheSemantic: { $ref: "./examples/ai/chat-cache-semantic.json" }
                preset: { $ref: "./examples/ai/chat-preset.json" }
                nl2sql: { $ref: "./examples/ai/chat-nl2sql.json" }
                myBookings: { $ref: "./examples/ai/chat-my-bookings.json" }
                rejected: { $ref: "./examples/ai/chat-rejected.json" }
        "400":
          description: |
            VALIDATION_FAILED — `message` 없음·빈 문자열(공백만)·300자 초과(`details[{ field: "message", reason: LENGTH }]`),
            `sessionId` 형식 오류(`details[{ field: "sessionId", reason: FORMAT }]`), JSON 아님
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFoundFlagOff" }
        "409":
          description: AI_QUERY_IN_PROGRESS — 같은 사용자의 질문이 처리 중(동시 1건, `ai:inflight:{userId}` 40초). 화면은 진행 중 답을 기다리게 하고 재시도 버튼을 막는다. `details` 빈 배열
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: AI_QUERY_IN_PROGRESS
                message: "이전 질문을 아직 처리하고 있습니다."
                traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
                details: []
        "429":
          description: |
            AI_QUOTA_EXCEEDED — 사용자당 분당 10회·하루 100회 초과(ai 앱 안 비용 보호, gateway 요청 수 제한 ADR-62와 다름).
            `details[{ field: "quota", value: "10/min" 또는 "100/day", reason: PER_MINUTE 또는 PER_DAY }]`.
            응답 헤더 `Retry-After`(초). 화면은 그 시간 뒤 다시 시도하라고 안내한다
          headers:
            Retry-After:
              description: 다시 시도할 수 있을 때까지의 초(분 한도는 다음 분까지, 일 한도는 KST 자정까지)
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: AI_QUOTA_EXCEEDED
                message: "분당 질문 한도를 넘었습니다."
                traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
                details: [ { field: quota, value: "10/min", reason: PER_MINUTE } ]
        "503":
          description: |
            AI_LLM_UNAVAILABLE — Claude API 문제 또는 한도를 기록할 수 없음. 아무것도 바뀌지 않음, 화면은 잠시 뒤 재시도.
              `details[{ field: "provider", value: "anthropic", reason }]`, reason = TIMEOUT(전체 기한 25초 또는 호출 1회 15초 초과) ·
              OVERLOADED · RATE_LIMITED · SPEND_LIMIT(월 지출 한도) · CIRCUIT_OPEN ·
              `details[{ field: "quotaStore", value: "ai-valkey", reason: QUOTA_STORE_UNAVAILABLE }]`(ai Valkey에 한도를
              기록하지 못함 — 한도 확인 없이 Claude를 부르지 않는다)
            AI_SNAPSHOT_NOT_READY — 기동 직후 SQLite 스냅샷 첫 적재 전(readiness가 막으므로 드묾). `details` 빈 배열
            SERVICE_UNAVAILABLE — "내 예매" 공개 API(`/users/me/bookings`) 실패(`details[{ field: "upstream", value: "user" }]`),
              또는 gateway — ai 파드 없음(`ng-ai` 0대). 화면은 챗봇을 비활성 안내로 보여준다
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: AI_LLM_UNAVAILABLE
                message: "AI 응답 시간이 초과되었습니다."
                traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
                details: [ { field: provider, value: anthropic, reason: TIMEOUT } ]

  /ai/presets:
    get:
      tags: [presets]
      operationId: listPresets
      summary: AI-04 추천 질문 목록 (화면 버튼)
      x-feature-id: AI-04
      description: |
        `services/ai/src/seatsac_ai/resources/presets.yaml`의 프리셋 12개를 화면 버튼용으로 돌려준다(17-4).
        버튼을 누르면 화면은 `example` 문장을 그대로 `POST /ai/chat`의 `message`로 보낸다(별도 프리셋 실행 API 없음).
        정적 목록이라 ai 자체는 503을 내지 않는다. 화면은 로그인 뒤 이 API를 먼저 불러 404(플래그 off)면 챗봇 버튼을 숨기고,
        503(ai 파드 없음)이면 비활성 안내를 보여준다.
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: 추천 질문 목록. 페이징 없음(`{ items }`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresetList" }
              example:
                items:
                  - { presetId: today_after_time, title: "오늘 ○시 이후 회차", example: "오늘 20시 이후에 시작하는 영화 알려줘" }
                  - { presetId: theater_schedule, title: "극장 편성표", example: "내일 건대입구 편성표 보여줘" }
                  - { presetId: movie_theaters, title: "영화별 상영 극장·시간", example: "영화 제목 어디서 몇 시에 해?" }
                  - { presetId: most_remaining_today, title: "잔여석 많은 오늘 회차", example: "오늘 자리 많이 남은 회차 5개" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFoundFlagOff" }
        "503":
          description: SERVICE_UNAVAILABLE (gateway) — ai 파드 없음(`ng-ai` 0대·기동 중). 화면은 챗봇 비활성 안내
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT   # Cognito Access Token (ID 토큰 아님). gateway가 검증하고 X-User-Id(= sub)·X-User-Role을 넣는다

  responses:
    Unauthorized:
      description: UNAUTHORIZED (Gateway) — 토큰 없음(reason TOKEN_REQUIRED)·만료·서명 불일치
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFoundFlagOff:
      description: NOT_FOUND (Gateway) — 플래그 `APP_AI_ENABLED=false`라 `/api/ai/**` 라우트가 없음(`/api/internal/**` 처리와 같음). 화면은 챗봇 버튼을 숨긴다. ai 자체는 404를 내지 않는다
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    ErrorResponse:
      $ref: "../schemas/error.v1.json"

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 300
          description: 사용자 질문 원문. 공백만이면 400. 서버 로그에는 원문을 남기지 않는다(해시만)
        sessionId:
          type: string
          format: uuid
          description: 직전 응답의 `sessionId`(후속 질문 문맥). 없거나 이 사용자의 것이 아니면 새 세션

    ChatPath:
      type: string
      enum: [CACHE_EXACT, CACHE_SEMANTIC, PRESET, NL2SQL, MY_BOOKINGS, REJECTED, OUT_OF_SCOPE]
      description: |
        CACHE_EXACT 정확 일치 캐시(토큰 0) · CACHE_SEMANTIC 의미 캐시(토큰 0) · PRESET Claude가 프리셋 선택 ·
        NL2SQL Claude가 SQL 생성 · MY_BOOKINGS 내 예매(공개 API, 토큰 0) · REJECTED SQL 검증 거부(`rejection` 참고) ·
        OUT_OF_SCOPE 답할 수 없는 질문(안내 문장만)

    Column:
      type: object
      required: [name, type]
      properties:
        name: { type: string, description: "결과 열 이름(SQL 별칭). 화면 표 머리글" }
        type:
          type: string
          enum: [text, integer, real]
          description: SQLite 값 종류. 시각·날짜는 KST 문자열(`text`)

    LlmUsage:
      type: object
      description: 이 질문에서 Claude API를 부른 횟수와 토큰. 캐시 적중·내 예매는 모두 0
      required: [calls, inputTokens, outputTokens, cacheReadTokens]
      properties:
        calls: { type: integer, minimum: 0, maximum: 3, description: "도구 선택 1 + 검증 실패 재요청 1 + SQL 오류 재요청 1" }
        inputTokens: { type: integer, minimum: 0 }
        outputTokens: { type: integer, minimum: 0 }
        cacheReadTokens: { type: integer, minimum: 0, description: "프롬프트 캐싱으로 읽은 토큰(절감 그래프와 따로 표시)" }
        cacheWriteTokens: { type: integer, minimum: 0, description: "프롬프트 캐시에 쓴 토큰(첫 호출 때만)" }

    Rejection:
      type: object
      description: "`path: REJECTED`일 때만. SQL 검증(16장)·실행 실패 사유"
      required: [reason, message]
      properties:
        reason:
          type: string
          pattern: "^[A-Z_]+$"
          description: |
            NOT_SELECT(SELECT·WITH…SELECT가 아님) · MULTI_STATEMENT(`;`로 이어진 두 문장) · FORBIDDEN_OBJECT(movie·theater·screening
            밖의 대상, `object`에 이름) · FORBIDDEN_FUNCTION(ATTACH·PRAGMA·load_extension·재귀 CTE 등) · PARSE_ERROR ·
            SQL_ERROR(실행 오류, 1회 재요청 뒤에도 실패) · TIMEOUT(SQLite 5초 초과)
        message: { type: string, description: "사용자에게 보여줄 안내(개발용 상세는 로그)" }
        object: { type: [string, "null"], description: "FORBIDDEN_OBJECT일 때 거부된 테이블·함수 이름" }

    ChatResponse:
      type: object
      description: 모든 필드가 항상 있다. 경로에 해당 없는 값은 null(`columns`·`rows`·`sql`·`presetId`·`rejection`)
      required: [sessionId, answer, path, columns, rows, rowCount, truncated, sql, presetId, asOf, llm, latencyMs, rejection]
      properties:
        sessionId: { type: string, format: uuid, description: "서버가 발급. 후속 질문에 그대로 보낸다(30분)" }
        answer: { type: string, description: "답 문장(결과 행을 템플릿에 채워 만듦, Claude에 결과를 다시 보내지 않음). 끝에 \"○시 ○분 기준\"" }
        path: { $ref: "#/components/schemas/ChatPath" }
        columns:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/Column" }
          description: 결과 표 머리글. REJECTED·OUT_OF_SCOPE는 null
        rows:
          type: [array, "null"]
          maxItems: 500
          items:
            type: array
            items: { type: [string, integer, number, "null"], description: "`Column.type` text → string, integer → integer, real → number. SQLite에 boolean은 없다(0·1 integer)" }
          description: "`columns` 순서의 값 배열. 최대 500행(`truncated`). MY_BOOKINGS는 본인 예매만. REJECTED·OUT_OF_SCOPE는 null"
        rowCount: { type: integer, minimum: 0, description: "`rows` 길이(null이면 0)" }
        truncated: { type: boolean, description: "500행에서 잘렸으면 true(LIMIT 없는 SQL은 LIMIT 500을 붙여 실행)" }
        sql:
          type: [string, "null"]
          description: 실행한 SQLite SQL(공개 데이터라 노출해도 됨). REJECTED면 거부된 SQL. PRESET·MY_BOOKINGS·OUT_OF_SCOPE는 null
        presetId: { type: [string, "null"], description: "PRESET·캐시 적중(프리셋 유래)일 때 프리셋 ID, 그 밖은 null" }
        asOf:
          type: string
          format: date-time
          description: 스냅샷 기준 시각(오늘 회차 1분·나머지 10분 갱신). MY_BOOKINGS는 공개 API 호출 시각. +09:00
        llm: { $ref: "#/components/schemas/LlmUsage" }
        latencyMs: { type: integer, minimum: 0, description: "ai 안 처리 시간(ms)" }
        rejection:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/Rejection" }

    Preset:
      type: object
      required: [presetId, title, example]
      properties:
        presetId: { type: string, minLength: 1, description: "presets.yaml 키. 응답 `presetId`와 같은 값" }
        title: { type: string, description: "버튼 글자" }
        example: { type: string, maxLength: 300, description: "버튼을 누르면 `POST /ai/chat`의 `message`로 보내는 문장" }

    PresetList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Preset" } }
