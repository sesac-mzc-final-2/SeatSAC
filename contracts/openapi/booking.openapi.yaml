openapi: 3.1.0
info:
  title: seatsac booking API
  version: "1.1"
  description: |
    API 명세서 v1.1 4장 (BKG-01~12 · 남궁일). 외부 호출은 `/api` 접두사, Gateway가 StripPrefix=1.
    Gateway 라우트 1순위: `/screenings/{id}/seats`, `/screenings/{id}/seats/stream`은 catalog보다 먼저 booking으로.
    멱등 키(1-5): `POST /seats/hold`, `POST /bookings/{id}/pay` 필수. Valkey `idem:{userId}:{키}` 24시간.
    금액은 선점 때 확정(좌석 수 × 15,000원). 결제 거절도 HTTP 200 + status로 구분(10장 #5).
servers:
  - url: /api
security: []   # 기본 인증 없음. 인증이 필요한 operation에 security: [ { bearerAuth: [] } ]
tags:
  - { name: seats, description: "좌석 현황·SSE·선점 (BKG-01·05·02)" }
  - { name: bookings, description: "예매" }

paths:

  /screenings/{screeningId}/seats:
    get:
      tags: [seats]
      operationId: getSeatSnapshot
      summary: BKG-01 좌석 현황 스냅샷 + seq
      x-feature-id: BKG-01
      description: |
        배치 버전의 좌석 전부를 돌려준다(10장 #7). seq는 seat-seq:{회차ID}를 조회 시작 전에 먼저 읽은 값.
        holdId·누가 잡았는지는 돌려주지 않는다.
      parameters:
        - $ref: "#/components/parameters/ScreeningId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatSnapshot" }
              example:
                screeningId: 5123
                layoutVersion: 1
                seq: 418
                generatedAt: "2026-11-16T14:03:00+09:00"
                seats:
                  - { seatId: 4060001, status: AVAILABLE }
                  - { seatId: 4060121, status: HELD }
                  - { seatId: 4060122, status: RESERVED }
        "404": { $ref: "#/components/responses/NotFound" }

  /screenings/{screeningId}/seats/stream:
    get:
      tags: [seats]
      operationId: streamSeatEvents
      summary: BKG-05 실시간 좌석 이벤트 (SSE)
      x-feature-id: BKG-05
      description: |
        `text/event-stream`. 처음에 `retry: 2000`, 이벤트는 `event: seat` / `id: {seq}` / `data: {seat-event.v1}`,
        15초마다 주석 줄 `: ping`. 화면 순서: SSE 연결(버퍼) → BKG-01 → 스냅샷 seq보다 큰 것 적용 →
        이후 `seq == lastSeq + 1`일 때만 적용, 빈틈이면 200ms 뒤 BKG-01 재조회. 재연결 때마다 반복(지터 0~1초).
        data 형식은 contracts/events/seat-event.v1.json. 유실 허용(스냅샷으로 복구).
      parameters:
        - $ref: "#/components/parameters/ScreeningId"
        - { name: Last-Event-ID, in: header, required: false, description: 참고용. 복구는 BKG-01 스냅샷으로, schema: { type: string } }
      responses:
        "200":
          description: SSE 스트림 (Gateway·CloudFront 응답 타임아웃 없음, heartbeat 15초)
          content:
            text/event-stream:
              schema:
                type: string
                description: "event: seat\\nid: {seq}\\ndata: {SeatEvent JSON}\\n\\n"
              example: |
                retry: 2000

                event: seat
                id: 419
                data: {"seq":419,"type":"HELD","screeningId":5123,"seatIds":[4060121,4060122],"occurredAt":"2026-11-16T14:03:05.120+09:00","traceId":"4bf92f3577b34da6a3ce929d0e0e4736"}

                : ping
        "404": { $ref: "#/components/responses/NotFound" }

  /seats/hold:
    post:
      tags: [seats]
      operationId: holdSeats
      summary: BKG-02 좌석 선점 (최대 4석) + PENDING 예매 발급
      x-feature-id: BKG-02
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screeningId, seatIds]
              properties:
                screeningId: { type: integer }
                seatIds: { type: array, minItems: 1, maxItems: 4, items: { type: integer } }
            example: { screeningId: 5123, seatIds: [4060121, 4060122] }
      responses:
        "201":
          description: PENDING 예매. 선점 TTL 300초
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldResult" }
              example:
                bookingId: 9876
                screeningId: 5123
                status: PENDING
                seatIds: [4060121, 4060122]
                seatLabels: ["J7", "J8"]
                seatCount: 2
                amount: 30000
                expiresAt: "2026-11-16T14:08:05+09:00"
                createdAt: "2026-11-16T14:03:05+09:00"
        "400":
          description: |
            VALIDATION_FAILED(좌석 0개·5개 이상·중복·배치에 없음·비활성, Idempotency-Key 없음) ·
            SCREENING_STARTED(상영 시작 후)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            SEAT_UNAVAILABLE — details[{ field: "seatIds", value: 좌석 ID, reason: HELD·RESERVED }] ·
            ACTIVE_HOLD_EXISTS — details[{ field: "bookingId", value }, { field: "expiresAt", value }] ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: SEAT_UNAVAILABLE
                message: "이미 선점되었거나 확정된 좌석이 있습니다."
                traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
                details: [ { field: seatIds, value: 4060121, reason: HELD } ]
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/{bookingId}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: 예매 단건 (본인만). 새로고침·결제 결과 재확인
      description: |
        PENDING이고 결제 요청이 있으면 응답 전에 Payment를 조회해 BKG-10 4단계와 같은 로직으로 반영한다.
        Payment가 PROCESSING이면 PENDING 그대로. seatIds는 점유 중(PENDING·CONFIRMED)일 때만, 끝난 예매는 [].
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{bookingId}/hold:
    delete:
      tags: [bookings]
      operationId: releaseHold
      summary: BKG-03 선점 해제 → CANCELED
      x-feature-id: BKG-03
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      responses:
        "200":
          description: CANCELED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "BOOKING_STATE_CONFLICT — details[{ field: \"status\", value, reason: BOOKING_NOT_PENDING·PAYMENT_IN_PROGRESS }]"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/pay:
    post:
      tags: [bookings]
      operationId: payBooking
      summary: BKG-10 결제 요청 (예매당 1회) → BKG-06 확정 또는 PAYMENT_FAILED
      x-feature-id: BKG-10
      description: |
        모의 카드(ADR-13): 끝 4자리 0000 → CARD_DECLINED, 1111 → INSUFFICIENT_BALANCE, 9999 → 5초 지연 후 승인
        (Booking 타임아웃 → 503 PAYMENT_RESULT_UNKNOWN → GET /bookings/{id} 재조회 시연), 그 밖은 승인.
        카드 번호는 저장·로그하지 않는다(Payment는 card_last4만).
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayRequest" }
            example: { method: CARD, card: { number: "4242424242424242", expiry: "12/28", holder: KIM } }
      responses:
        "200":
          description: 승인(CONFIRMED) 또는 거절(PAYMENT_FAILED). 둘 다 200, status로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayResult" }
              examples:
                approved:
                  value:
                    bookingId: 9876
                    status: CONFIRMED
                    confirmedAt: "2026-11-16T14:04:10+09:00"
                    seatLabels: [J7, J8]
                    payment: { paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13", status: APPROVED, cardLast4: "4242", approvedAt: "2026-11-16T14:04:10+09:00" }
                declined:
                  value:
                    bookingId: 9876
                    status: PAYMENT_FAILED
                    payment: { paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13", status: FAILED, failureCode: CARD_DECLINED }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            PAYMENT_ALREADY_REQUESTED(결과는 GET /bookings/{id}) ·
            BOOKING_STATE_CONFLICT(PENDING 아님, 또는 승인 후 만료 → details[{ field: "status", value: "EXPIRED", reason: "HOLD_EXPIRED" }, { field: "refunded", value: true }]) ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: |
            PAYMENT_RESULT_UNKNOWN — details[{ field: "paymentId", value }]. 예매는 PENDING 유지, 화면은 GET /bookings/{id}를 2초 간격 최대 5회 ·
            SERVICE_UNAVAILABLE — Payment 서킷 열림
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/cancel:
    post:
      tags: [bookings]
      operationId: cancelBooking
      summary: BKG-07 예매 취소 + 환불(PAY-03). CONFIRMED·상영 시작 전만
      x-feature-id: BKG-07
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      responses:
        "200":
          description: CANCELED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelResult" }
        "400":
          description: SCREENING_STARTED
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: BOOKING_STATE_CONFLICT — CONFIRMED 아님
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT   # Cognito Access Token (ID 토큰 아님)

  parameters:
    ScreeningId: { name: screeningId, in: path, required: true, schema: { type: integer, format: int64 } }
    BookingId: { name: bookingId, in: path, required: true, schema: { type: integer, format: int64 } }
    IdempotencyKeyRequired:
      { name: Idempotency-Key, in: header, required: true, description: "요청마다 새 UUID, 재시도만 같은 값", schema: { type: string, format: uuid } }
    IdempotencyKeyOptional:
      { name: Idempotency-Key, in: header, required: false, description: "상태 전이 자체가 멱등이라 선택", schema: { type: string, format: uuid } }

  responses:
    ValidationFailed:
      description: "VALIDATION_FAILED — details[]에 { field, value?, reason }"
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Unauthorized:
      description: UNAUTHORIZED (Gateway) — 토큰 없음·만료·서명 불일치
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotOwner:
      description: FORBIDDEN — 본인 예매가 아님
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE — 하위 서비스(Catalog·Payment) 응답 없음·서킷 열림. 아무것도 바뀌지 않음
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    ErrorResponse:
      $ref: "../schemas/error.v1.json"

    SeatStatus: { type: string, enum: [AVAILABLE, HELD, RESERVED] }
    BookingStatus: { type: string, enum: [PENDING, CONFIRMED, PAYMENT_FAILED, EXPIRED, CANCELED] }
    PaymentStatus: { type: string, enum: [PROCESSING, APPROVED, FAILED, CANCELED] }
    FailureCode: { type: [string, "null"], enum: [CARD_DECLINED, INSUFFICIENT_BALANCE, null] }

    SeatSnapshot:
      type: object
      required: [screeningId, layoutVersion, seq, generatedAt, seats]
      properties:
        screeningId: { type: integer, format: int64 }
        layoutVersion: { type: integer, minimum: 1 }
        seq: { type: integer, format: int64, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        seats:
          type: array
          items:
            type: object
            required: [seatId, status]
            properties:
              seatId: { type: integer, format: int64 }
              status: { $ref: "#/components/schemas/SeatStatus" }

    HoldResult:
      type: object
      required: [bookingId, screeningId, status, seatIds, seatLabels, seatCount, amount, expiresAt, createdAt]
      properties:
        bookingId: { type: integer, format: int64 }
        screeningId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/BookingStatus" }
        seatIds: { type: array, items: { type: integer, format: int64 } }
        seatLabels: { type: array, items: { type: string } }
        seatCount: { type: integer, minimum: 1, maximum: 4 }
        amount: { type: integer, description: "seatCount × 15000 (원)" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    BookingPayment:
      type: object
      required: [paymentId, status]
      properties:
        paymentId: { type: string, format: uuid, description: "Booking 발급 UUID (10장 #4)" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        cardLast4: { type: [string, "null"] }
        failureCode: { $ref: "#/components/schemas/FailureCode" }
        approvedAt: { type: [string, "null"], format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }

    Booking:
      type: object
      required: [bookingId, screeningId, status, seatIds, seatLabels, seatCount, amount, expiresAt, createdAt, confirmedAt, canceledAt, payment]
      properties:
        bookingId: { type: integer, format: int64 }
        screeningId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/BookingStatus" }
        seatIds: { type: array, items: { type: integer, format: int64 }, description: "PENDING·CONFIRMED일 때만, 끝난 예매는 []" }
        seatLabels: { type: array, items: { type: string } }
        seatCount: { type: integer }
        amount: { type: integer }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }
        payment:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BookingPayment"

    PayRequest:
      type: object
      required: [method, card]
      properties:
        method: { type: string, enum: [CARD] }
        card:
          type: object
          required: [number, expiry, holder]
          properties:
            number: { type: string, pattern: "^[0-9]{12,19}$", description: "모의 카드. 저장·로그 금지" }
            expiry: { type: string, pattern: "^(0[1-9]|1[0-2])/[0-9]{2}$", examples: ["12/28"] }
            holder: { type: string, minLength: 1, maxLength: 50 }

    PayResult:
      type: object
      required: [bookingId, status, payment]
      properties:
        bookingId: { type: integer, format: int64 }
        status: { type: string, enum: [CONFIRMED, PAYMENT_FAILED] }
        confirmedAt: { type: string, format: date-time, description: "CONFIRMED일 때만" }
        seatLabels:
          type: array
          description: 결제 완료 화면이 좌석을 다시 조회하지 않도록 함께 돌려준다 (API 명세서 BKG-10 200 예시)
          items: { type: string }
          example: [J7, J8]
        payment: { $ref: "#/components/schemas/BookingPayment" }

    CancelResult:
      type: object
      required: [bookingId, status, canceledAt]
      properties:
        bookingId: { type: integer, format: int64 }
        status: { type: string, enum: [CANCELED] }
        canceledAt: { type: string, format: date-time }
        payment:
          description: "BKG-07(결제 취소)만. BKG-03 해제에는 없음"
          type: object
          required: [paymentId, status]
          properties:
            paymentId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/PaymentStatus" }
