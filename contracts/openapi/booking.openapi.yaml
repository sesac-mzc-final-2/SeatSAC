openapi: 3.1.0
info:
  title: seatsac booking API
  version: "1.1"
  description: |
    API 명세서 v1.1 4장 (BKG-01~12 · 남궁일). 외부 호출은 `/api` 접두사, Gateway가 StripPrefix=1.
    Gateway 라우트 1순위: `/screenings/{id}/seats`, `/screenings/{id}/seats/stream`은 catalog보다 먼저 booking으로.
    멱등 키(1-5): `POST /seats/hold`, `POST /bookings/{id}/pay` 필수. Valkey `idem:{userId}:{키}` 24시간.
    금액은 선점 때 확정(좌석 수 × 15,000원). 결제 거절도 HTTP 200 + status로 구분(10장 #5).
    결제 수단(ADR-112): `TOSSPAY`는 포트원 V2 결제창 — `POST /bookings/{id}/payments`(준비) → 화면 requestPayment →
    `POST /bookings/{id}/pay {method: TOSSPAY, paymentId}`(완료 확인)의 두 단계. `CARD`는 모의 결제(MOCK)로 테스트·분석 전용 —
    헤더 `X-Payment-Mock-Key`(booking Secret `APP_PAYMENT_MOCK_KEY`)가 맞거나 `X-User-Role=ADMIN`일 때만 받고, 그 밖은 400(reason MOCK_NOT_ALLOWED).
servers:
  - url: /api
security: []   # 기본 인증 없음. 인증이 필요한 operation에 security: [ { bearerAuth: [] } ]
tags:
  - { name: seats, description: "좌석 현황·SSE·선점 (BKG-01·05·02)" }
  - { name: bookings, description: "예매" }

paths:

  /screenings/{screeningId}/seats:
    get:
      tags: [seats]
      operationId: getSeatSnapshot
      summary: BKG-01 좌석 현황 스냅샷 + seq
      x-feature-id: BKG-01
      description: |
        배치 버전의 좌석 전부를 돌려준다(10장 #7). seq는 seat-seq:{회차ID}를 조회 시작 전에 먼저 읽은 값.
        holdId·누가 잡았는지는 돌려주지 않는다.
      parameters:
        - $ref: "#/components/parameters/ScreeningId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatSnapshot" }
              example:
                screeningId: 5123
                layoutVersion: 1
                seq: 418
                generatedAt: "2026-11-16T14:03:00+09:00"
                seats:
                  - { seatId: 4060001, status: AVAILABLE }
                  - { seatId: 4060121, status: HELD }
                  - { seatId: 4060122, status: RESERVED }
        "404": { $ref: "#/components/responses/NotFound" }

  /screenings/{screeningId}/seats/stream:
    get:
      tags: [seats]
      operationId: streamSeatEvents
      summary: BKG-05 실시간 좌석 이벤트 (SSE)
      x-feature-id: BKG-05
      description: |
        `text/event-stream`. 처음에 `retry: 2000`, 이벤트는 `event: seat` / `id: {seq}` / `data: {seat-event.v1}`,
        15초마다 주석 줄 `: ping`. 화면 순서: SSE 연결(버퍼) → BKG-01 → 스냅샷 seq보다 큰 것 적용 →
        이후 `seq == lastSeq + 1`일 때만 적용, 빈틈이면 200ms 뒤 BKG-01 재조회. 재연결 때마다 반복(지터 0~1초).
        data 형식은 contracts/events/seat-event.v1.json. 유실 허용(스냅샷으로 복구).
      parameters:
        - $ref: "#/components/parameters/ScreeningId"
        - { name: Last-Event-ID, in: header, required: false, description: 참고용. 복구는 BKG-01 스냅샷으로, schema: { type: string } }
      responses:
        "200":
          description: SSE 스트림 (Gateway·CloudFront 응답 타임아웃 없음, heartbeat 15초)
          content:
            text/event-stream:
              schema:
                type: string
                description: "event: seat\\nid: {seq}\\ndata: {SeatEvent JSON}\\n\\n"
              example: |
                retry: 2000

                event: seat
                id: 419
                data: {"seq":419,"type":"HELD","screeningId":5123,"seatIds":[4060121,4060122],"occurredAt":"2026-11-16T14:03:05.120+09:00","traceId":"4bf92f3577b34da6a3ce929d0e0e4736"}

                : ping
        "404": { $ref: "#/components/responses/NotFound" }

  /seats/hold:
    post:
      tags: [seats]
      operationId: holdSeats
      summary: BKG-02 좌석 선점 (최대 4석) + PENDING 예매 발급
      x-feature-id: BKG-02
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screeningId, seatIds]
              properties:
                screeningId: { type: integer }
                seatIds: { type: array, minItems: 1, maxItems: 4, items: { type: integer } }
            example: { screeningId: 5123, seatIds: [4060121, 4060122] }
      responses:
        "201":
          description: PENDING 예매. 선점 TTL 300초
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldResult" }
              example:
                bookingId: 9876
                screeningId: 5123
                status: PENDING
                seatIds: [4060121, 4060122]
                seatLabels: ["J7", "J8"]
                seatCount: 2
                amount: 30000
                expiresAt: "2026-11-16T14:08:05+09:00"
                createdAt: "2026-11-16T14:03:05+09:00"
        "400":
          description: |
            VALIDATION_FAILED(좌석 0개·5개 이상·중복·배치에 없음·비활성, Idempotency-Key 없음) ·
            SCREENING_STARTED(예매 마감 — 상영 시작 5분 전부터. details[{ field: "screeningId", value, reason: "BOOKING_CLOSED" }])
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            SEAT_UNAVAILABLE — details[{ field: "seatIds", value: 좌석 ID, reason: HELD·RESERVED }] ·
            ACTIVE_HOLD_EXISTS — details[{ field: "bookingId", value }, { field: "expiresAt", value }] ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: SEAT_UNAVAILABLE
                message: "이미 선점되었거나 확정된 좌석이 있습니다."
                traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
                details: [ { field: seatIds, value: 4060121, reason: HELD } ]
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/{bookingId}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: 예매 단건 (본인만). 새로고침·결제 결과 재확인
      description: |
        PENDING이고 결제 요청이 있으면 응답 전에 Payment를 조회해 BKG-10 4단계와 같은 로직으로 반영한다.
        Payment가 PROCESSING이면 PENDING 그대로. seatIds는 점유 중(PENDING·CONFIRMED)일 때만, 끝난 예매는 [].
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{bookingId}/hold:
    delete:
      tags: [bookings]
      operationId: releaseHold
      summary: BKG-03 선점 해제 → CANCELED
      x-feature-id: BKG-03
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      responses:
        "200":
          description: CANCELED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "BOOKING_STATE_CONFLICT — details[{ field: \"status\", value, reason: BOOKING_NOT_PENDING·PAYMENT_IN_PROGRESS }]"
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/payments:
    post:
      tags: [bookings]
      operationId: preparePayment
      summary: BKG-10 결제 준비 (TOSSPAY) — paymentId 발급 + 포트원 결제창에 넘길 값
      x-feature-id: BKG-10
      description: |
        포트원 결제창을 열기 전에 부른다(ADR-112). 검증(본인·PENDING·선점 유효·결제 1회·예매 마감 전)을 통과하면
        paymentId(UUID)를 발급해 예매에 붙이고(예매당 1회, ADR-24) Payment에 PROCESSING 행을 만든 뒤,
        화면이 `requestPayment`에 그대로 넣을 값(storeId·channelKey·paymentId·orderName·totalAmount·currency·payMethod)을 돌려준다.
        결제창이 끝나면 화면은 `POST /bookings/{id}/pay {method: TOSSPAY, paymentId}`로 결과 확인을 요청한다 —
        결제창의 성공·실패·취소 응답은 신호일 뿐이고 결과는 서버가 포트원 단건 조회로 정한다.
        돈은 이 API에서 움직이지 않는다. 결제창을 열지 않고 떠나면 Payment는 7분 뒤 포트원 조회로 닫고, 예매는 만료+2분 뒤 만료 스캔이 반영한다.
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentPrepareRequest" }
            example: { method: TOSSPAY }
      responses:
        "200":
          description: 준비됨 — 같은 Idempotency-Key 재요청은 같은 응답
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPrepareResult" }
              example:
                bookingId: 9876
                paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13"
                amount: 30000
                orderName: "SeatSAC 영화 예매 2석"
                expiresAt: "2026-11-16T14:08:00+09:00"
                checkout: { provider: PORTONE, storeId: "store-00000000-0000-0000-0000-000000000000", channelKey: "channel-key-00000000-0000-0000-0000-000000000000", payMethod: EASY_PAY, currency: KRW }
        "400":
          description: |
            VALIDATION_FAILED(method가 TOSSPAY가 아님, Idempotency-Key 없음) ·
            SCREENING_STARTED(예매 마감 — 상영 시작 5분 전부터, details[{ field: "screeningId", value, reason: "BOOKING_CLOSED" }])
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            PAYMENT_ALREADY_REQUESTED(이미 준비·요청된 결제 — 결과는 GET /bookings/{id}) ·
            BOOKING_STATE_CONFLICT(PENDING 아님 · 선점 만료 details[{ field: "status", value, reason: "HOLD_EXPIRED" }]) ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: SERVICE_UNAVAILABLE — Payment 응답 없음·서킷 열림·포트원 비활성(`APP_PORTONE_ENABLED=false`), 또는 Catalog 응답 없음(예매 마감 확인 전). 예매는 바뀌지 않는다
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/pay:
    post:
      tags: [bookings]
      operationId: payBooking
      summary: BKG-10 결제 (예매당 1회) → BKG-06 확정 또는 PAYMENT_FAILED
      x-feature-id: BKG-10
      description: |
        `method`로 갈린다(ADR-112).
        - `TOSSPAY`: 준비(`POST /bookings/{id}/payments`)로 받은 paymentId를 보내면 Payment가 포트원 단건 조회로
          status·금액을 검증해 APPROVED·FAILED를 정한다. 결제창이 아직 끝나지 않았으면(READY·PENDING) 503 PAYMENT_RESULT_UNKNOWN → 재조회.
          paymentId가 예매에 붙은 것과 다르면 409 PAYMENT_ALREADY_REQUESTED.
        - `CARD`: 모의 결제(ADR-13) — 테스트·분석 전용. `X-Payment-Mock-Key` 또는 ADMIN만. 끝 4자리 0000 → CARD_DECLINED,
          1111 → INSUFFICIENT_BALANCE, 9999 → 5초 지연 후 승인(503 PAYMENT_RESULT_UNKNOWN → GET /bookings/{id} 재조회), 그 밖은 승인.
          카드 번호는 저장·로그하지 않는다(Payment는 card_last4만).
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/MockPaymentKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayRequest" }
            examples:
              tosspay:
                value: { method: TOSSPAY, paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13" }
              mockCard:
                value: { method: CARD, card: { number: "4242424242424242", expiry: "12/28", holder: KIM } }
      responses:
        "200":
          description: 승인(CONFIRMED) 또는 거절(PAYMENT_FAILED). 둘 다 200, status로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayResult" }
              examples:
                approved:
                  value:
                    bookingId: 9876
                    status: CONFIRMED
                    confirmedAt: "2026-11-16T14:04:10+09:00"
                    seatLabels: [J7, J8]
                    payment: { paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13", method: TOSSPAY, status: APPROVED, cardLast4: null, approvedAt: "2026-11-16T14:04:10+09:00" }
                declined:
                  value:
                    bookingId: 9876
                    status: PAYMENT_FAILED
                    payment: { paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13", method: TOSSPAY, status: FAILED, failureCode: USER_CANCELED }
        "400":
          description: |
            VALIDATION_FAILED(결제 수단·카드 형식, Idempotency-Key 없음, CARD인데 card 없음, TOSSPAY인데 paymentId 없음,
            CARD 호출자 제한 — details[{ field: "method", value: "CARD", reason: "MOCK_NOT_ALLOWED" }]) ·
            SCREENING_STARTED(예매 마감 — 상영 시작 5분 전부터. 결제를 부르지 않는다, 선점은 TTL로 풀린다. TOSSPAY 완료 확인은 마감 뒤에도 받는다 — 이미 결제됐으면 ADR-100 환불 경로.
            details[{ field: "screeningId", value, reason: "BOOKING_CLOSED" }])
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            PAYMENT_ALREADY_REQUESTED(결과는 GET /bookings/{id}. TOSSPAY는 보낸 paymentId가 예매에 붙은 것과 다를 때도) ·
            BOOKING_STATE_CONFLICT(PENDING 아님, 또는 승인 후 만료 → details[{ field: "status", value: "EXPIRED", reason: "HOLD_EXPIRED" }, { field: "refunded", value: true }]) ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: |
            PAYMENT_RESULT_UNKNOWN — details[{ field: "paymentId", value }]. 예매는 PENDING 유지, 화면은 GET /bookings/{id}를 2초 간격 최대 5회
            (TOSSPAY: 포트원 상태가 아직 READY·PENDING, 또는 포트원·Payment 응답 없음) ·
            SERVICE_UNAVAILABLE — Payment 서킷 열림, 또는 Catalog 응답 없음(예매 마감 확인 전 — 결제를 부르지 않는다)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/cancel:
    post:
      tags: [bookings]
      operationId: cancelBooking
      summary: BKG-07 예매 취소 + 환불(PAY-03). CONFIRMED·상영 시작 전만
      x-feature-id: BKG-07
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      responses:
        "200":
          description: CANCELED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelResult" }
        "400":
          description: SCREENING_STARTED
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: BOOKING_STATE_CONFLICT — CONFIRMED 아님
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT   # Cognito Access Token (ID 토큰 아님)

  parameters:
    ScreeningId: { name: screeningId, in: path, required: true, schema: { type: integer, format: int64 } }
    BookingId: { name: bookingId, in: path, required: true, schema: { type: integer, format: int64 } }
    IdempotencyKeyRequired:
      { name: Idempotency-Key, in: header, required: true, description: "요청마다 새 UUID, 재시도만 같은 값", schema: { type: string, format: uuid } }
    IdempotencyKeyOptional:
      { name: Idempotency-Key, in: header, required: false, description: "상태 전이 자체가 멱등이라 선택", schema: { type: string, format: uuid } }
    MockPaymentKey:
      name: X-Payment-Mock-Key
      in: header
      required: false
      description: "모의 결제(method CARD) 허용 키 — k6·블루/그린 분석 Job 전용(booking Secret `APP_PAYMENT_MOCK_KEY`와 같을 때만). 사람은 ADMIN 역할로 대신한다. 값은 로그·PR·문서에 쓰지 않는다"
      schema: { type: string, minLength: 16 }

  responses:
    Unauthorized:
      description: UNAUTHORIZED (Gateway) — 토큰 없음·만료·서명 불일치
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotOwner:
      description: FORBIDDEN — 본인 예매가 아님
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE — 하위 서비스(Catalog·Payment) 응답 없음·서킷 열림. 아무것도 바뀌지 않음
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    ErrorResponse:
      $ref: "../schemas/error.v1.json"

    SeatStatus: { type: string, enum: [AVAILABLE, HELD, RESERVED] }
    BookingStatus: { type: string, enum: [PENDING, CONFIRMED, PAYMENT_FAILED, EXPIRED, CANCELED] }
    PaymentStatus: { type: string, enum: [PROCESSING, APPROVED, FAILED, CANCELED] }
    PaymentMethod: { type: string, enum: [CARD, TOSSPAY], description: "CARD = 모의 결제(테스트·분석 전용) · TOSSPAY = 포트원 토스페이(ADR-112)" }
    FailureCode:
      type: [string, "null"]
      x-extensible-enum: [CARD_DECLINED, INSUFFICIENT_BALANCE, PG_DECLINED, USER_CANCELED, AMOUNT_MISMATCH, null]
      description: "CARD_DECLINED·INSUFFICIENT_BALANCE = 모의(ADR-13) · PG_DECLINED = 포트원 FAILED · USER_CANCELED = 결제창에서 사용자 취소 · AMOUNT_MISMATCH = 포트원 결제 금액이 예매 금액과 달라 서버가 취소(위변조 의심)"


    SeatSnapshot:
      type: object
      required: [screeningId, layoutVersion, seq, generatedAt, seats]
      properties:
        screeningId: { type: integer, format: int64 }
        layoutVersion: { type: integer, minimum: 1 }
        seq: { type: integer, format: int64, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        seats:
          type: array
          items:
            type: object
            required: [seatId, status]
            properties:
              seatId: { type: integer, format: int64 }
              status: { $ref: "#/components/schemas/SeatStatus" }

    HoldResult:
      type: object
      required: [bookingId, screeningId, status, seatIds, seatLabels, seatCount, amount, expiresAt, createdAt]
      properties:
        bookingId: { type: integer, format: int64 }
        screeningId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/BookingStatus" }
        seatIds: { type: array, items: { type: integer, format: int64 } }
        seatLabels: { type: array, items: { type: string } }
        seatCount: { type: integer, minimum: 1, maximum: 4 }
        amount: { type: integer, description: "seatCount × 15000 (원)" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    BookingPayment:
      type: object
      required: [paymentId, status]
      properties:
        paymentId: { type: string, format: uuid, description: "Booking 발급 UUID (10장 #4)" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        cardLast4: { type: [string, "null"], description: "CARD(모의)만. TOSSPAY는 null" }
        failureCode: { $ref: "#/components/schemas/FailureCode" }
        approvedAt: { type: [string, "null"], format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }

    Booking:
      type: object
      required: [bookingId, screeningId, status, seatIds, seatLabels, seatCount, amount, expiresAt, createdAt, confirmedAt, canceledAt, payment]
      properties:
        bookingId: { type: integer, format: int64 }
        screeningId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/BookingStatus" }
        seatIds: { type: array, items: { type: integer, format: int64 }, description: "PENDING·CONFIRMED일 때만, 끝난 예매는 []" }
        seatLabels: { type: array, items: { type: string } }
        seatCount: { type: integer }
        amount: { type: integer }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }
        payment:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BookingPayment"

    PayRequest:
      type: object
      required: [method]
      description: "`method`에 따라 필수 필드가 다르다 — TOSSPAY: paymentId · CARD: card. 빠지면 400 VALIDATION_FAILED"
      properties:
        method: { $ref: "#/components/schemas/PaymentMethod" }
        paymentId: { type: string, format: uuid, description: "TOSSPAY 필수 — POST /bookings/{id}/payments가 발급한 값" }
        card:
          type: object
          description: "CARD(모의) 필수. TOSSPAY에서는 보내지 않는다"
          required: [number, expiry, holder]
          properties:
            number: { type: string, pattern: "^[0-9]{12,19}$", description: "모의 카드. 저장·로그 금지" }
            expiry: { type: string, pattern: "^(0[1-9]|1[0-2])/[0-9]{2}$", examples: ["12/28"] }
            holder: { type: string, minLength: 1, maxLength: 50 }

    PaymentPrepareRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [TOSSPAY], description: "준비가 필요한 수단만. CARD(모의)는 준비 없이 /pay 한 번" }

    PaymentPrepareResult:
      type: object
      required: [bookingId, paymentId, amount, orderName, expiresAt, checkout]
      properties:
        bookingId: { type: integer, format: int64 }
        paymentId: { type: string, format: uuid, description: "Booking 발급. 포트원 paymentId(가맹점 채번, 매번 고유)로 그대로 쓴다" }
        amount: { type: integer, description: "requestPayment.totalAmount — 서버가 완료 확인 때 포트원 응답 amount.total과 대조한다" }
        orderName: { type: string, maxLength: 100 }
        expiresAt: { type: string, format: date-time, description: "선점 만료. 이 안에 결제창을 끝내지 않으면 승인돼도 환불(ADR-100)" }
        checkout:
          type: object
          description: "포트원 브라우저 SDK requestPayment에 그대로 넘기는 공개 값(비밀 아님)"
          required: [provider, storeId, channelKey, payMethod, currency]
          properties:
            provider: { type: string, enum: [PORTONE] }
            storeId: { type: string }
            channelKey: { type: string, description: "토스페이 채널 키" }
            payMethod: { type: string, enum: [EASY_PAY] }
            currency: { type: string, enum: [KRW] }

    PayResult:
      type: object
      required: [bookingId, status, payment]
      properties:
        bookingId: { type: integer, format: int64 }
        status: { type: string, enum: [CONFIRMED, PAYMENT_FAILED] }
        confirmedAt: { type: string, format: date-time, description: "CONFIRMED일 때만" }
        seatLabels:
          type: array
          description: 결제 완료 화면이 좌석을 다시 조회하지 않도록 함께 돌려준다 (API 명세서 BKG-10 200 예시)
          items: { type: string }
          example: [J7, J8]
        payment: { $ref: "#/components/schemas/BookingPayment" }

    CancelResult:
      type: object
      required: [bookingId, status, canceledAt]
      properties:
        bookingId: { type: integer, format: int64 }
        status: { type: string, enum: [CANCELED] }
        canceledAt: { type: string, format: date-time }
        payment:
          description: "BKG-07(결제 취소)만. BKG-03 해제에는 없음"
          type: object
          required: [paymentId, status]
          properties:
            paymentId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/PaymentStatus" }
