openapi: 3.1.0
info:
  title: seatsac booking API
  version: "1.1"
  description: |
    API 명세서 v1.1 4장 (BKG-01~12 · 남궁일). 외부 호출은 `/api` 접두사, Gateway가 StripPrefix=1.
    Gateway 라우트 1순위: `/screenings/{id}/seats`, `/screenings/{id}/seats/stream`은 catalog보다 먼저 booking으로.
    멱등 키(1-5): `POST /seats/hold`, `POST /bookings/{id}/payments`, `POST /bookings/{id}/pay` 필수. Valkey `idem:{userId}:{키}` 24시간.
    금액은 선점 때 확정(좌석 수 × 15,000원). 결제 거절도 HTTP 200 + status로 구분(10장 #5).
    결제 수단(ADR-112): `TOSSPAY`는 포트원 V2 결제창 — `POST /bookings/{id}/payments`(준비) → 화면 requestPayment →
    `POST /bookings/{id}/pay {method: TOSSPAY, paymentId}`(완료 확인)의 두 단계. `CARD`는 모의 결제(MOCK)로 테스트·분석 전용 —
    헤더 `X-Payment-Mock-Key`(booking Secret `APP_PAYMENT_MOCK_KEY`)가 맞을 때만 받고(k6·분석 Job), 그 밖은 400(reason MOCK_NOT_ALLOWED). 화면에는 모의 결제가 없다.
    체크아웃 saga(MSA 고도화 6.2, ADR-116, API 명세서 v1.5 21장): 비동기 결제 `POST /bookings/{id}/checkout`(202) → `GET …/checkout` polling →
    포트원 결제창 → `POST …/checkout/confirm`(202) → polling. 플래그 `APP_CHECKOUT_SAGA_ENABLED=false`(기본)면 세 경로가 404.
    화면은 비동기만 쓰고, 동기 `/payments`·`/pay`는 그대로 두되 k6 비교 측정·테스트 전용이다. 한 예매에는 한 경로만(섞으면 409 PAYMENT_PATH_CONFLICT).
servers:
  - url: /api
security: []   # 기본 인증 없음. 인증이 필요한 operation에 security: [ { bearerAuth: [] } ]
tags:
  - { name: seats, description: "좌석 현황·SSE·선점 (BKG-01·05·02)" }
  - { name: bookings, description: "예매" }
  - { name: checkout, description: "체크아웃 saga — 비동기 결제 (MSA 고도화 6.2, ADR-116)" }

paths:

  /screenings/{screeningId}/seats:
    get:
      tags: [seats]
      operationId: getSeatSnapshot
      summary: BKG-01 좌석 현황 스냅샷 + seq
      x-feature-id: BKG-01
      description: |
        배치 버전의 좌석 전부를 돌려준다(10장 #7). seq는 seat-seq:{회차ID}를 조회 시작 전에 먼저 읽은 값.
        holdId·누가 잡았는지는 돌려주지 않는다.
      parameters:
        - $ref: "#/components/parameters/ScreeningId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeatSnapshot" }
              example:
                screeningId: 5123
                layoutVersion: 1
                seq: 418
                generatedAt: "2026-11-16T14:03:00+09:00"
                seats:
                  - { seatId: 4060001, status: AVAILABLE }
                  - { seatId: 4060121, status: HELD }
                  - { seatId: 4060122, status: RESERVED }
        "404": { $ref: "#/components/responses/NotFound" }

  /screenings/{screeningId}/seats/stream:
    get:
      tags: [seats]
      operationId: streamSeatEvents
      summary: BKG-05 실시간 좌석 이벤트 (SSE)
      x-feature-id: BKG-05
      description: |
        `text/event-stream`. 처음에 `retry: 2000`, 이벤트는 `event: seat` / `id: {seq}` / `data: {seat-event.v1}`,
        15초마다 주석 줄 `: ping`. 화면 순서: SSE 연결(버퍼) → BKG-01 → 스냅샷 seq보다 큰 것 적용 →
        이후 `seq == lastSeq + 1`일 때만 적용, 빈틈이면 200ms 뒤 BKG-01 재조회. 재연결 때마다 반복(지터 0~1초).
        data 형식은 contracts/events/seat-event.v1.json. 유실 허용(스냅샷으로 복구).
      parameters:
        - $ref: "#/components/parameters/ScreeningId"
        - { name: Last-Event-ID, in: header, required: false, description: 참고용. 복구는 BKG-01 스냅샷으로, schema: { type: string } }
      responses:
        "200":
          description: SSE 스트림 (Gateway·CloudFront 응답 타임아웃 없음, heartbeat 15초)
          content:
            text/event-stream:
              schema:
                type: string
                description: "event: seat\\nid: {seq}\\ndata: {SeatEvent JSON}\\n\\n"
              example: |
                retry: 2000

                event: seat
                id: 419
                data: {"seq":419,"type":"HELD","screeningId":5123,"seatIds":[4060121,4060122],"occurredAt":"2026-11-16T14:03:05.120+09:00","traceId":"4bf92f3577b34da6a3ce929d0e0e4736"}

                : ping
        "404": { $ref: "#/components/responses/NotFound" }

  /seats/hold:
    post:
      tags: [seats]
      operationId: holdSeats
      summary: BKG-02 좌석 선점 (최대 4석) + PENDING 예매 발급
      x-feature-id: BKG-02
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [screeningId, seatIds]
              properties:
                screeningId: { type: integer }
                seatIds: { type: array, minItems: 1, maxItems: 4, items: { type: integer } }
            example: { screeningId: 5123, seatIds: [4060121, 4060122] }
      responses:
        "201":
          description: PENDING 예매. 선점 TTL 300초
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldResult" }
              example:
                bookingId: 9876
                screeningId: 5123
                status: PENDING
                seatIds: [4060121, 4060122]
                seatLabels: ["J7", "J8"]
                seatCount: 2
                amount: 30000
                expiresAt: "2026-11-16T14:08:05+09:00"
                createdAt: "2026-11-16T14:03:05+09:00"
        "400":
          description: |
            VALIDATION_FAILED(좌석 0개·5개 이상·중복·배치에 없음·비활성, Idempotency-Key 없음) ·
            SCREENING_STARTED(예매 마감 — 상영 시작 5분 전부터. details[{ field: "screeningId", value, reason: "BOOKING_CLOSED" }])
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            SEAT_UNAVAILABLE — details[{ field: "seatIds", value: 좌석 ID, reason: HELD·RESERVED }] ·
            ACTIVE_HOLD_EXISTS — details[{ field: "bookingId", value }, { field: "expiresAt", value }] ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                code: SEAT_UNAVAILABLE
                message: "이미 선점되었거나 확정된 좌석이 있습니다."
                traceId: "4bf92f3577b34da6a3ce929d0e0e4736"
                details: [ { field: seatIds, value: 4060121, reason: HELD } ]
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /bookings/{bookingId}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: 예매 단건 (본인만). 새로고침·결제 결과 재확인
      description: |
        PENDING이고 결제 요청이 있으면 응답 전에 Payment를 조회해 BKG-10 4단계와 같은 로직으로 반영한다.
        TOSSPAY 결제가 PROCESSING이면 Payment `verify`(포트원 단건 조회)도 부른다 — 완료 확인(`/pay`)이 503이었어도
        화면의 재조회로 결과가 나온다(웹훅·7분 정리를 기다리지 않는다). 그래도 아직이면(결제창 미완료·포트원 응답 없음) PENDING 그대로 200.
        seatIds는 점유 중(PENDING·CONFIRMED)일 때만, 끝난 예매는 [].
        체크아웃 saga 예매(`checkout_saga` 행이 있는 예매)는 위 Payment 조회·verify·반영을 **하지 않는다** — 결과는 saga 결과 메시지만 반영한다.
        응답 `checkout {checkoutId, state}`(가장 최근 체크아웃, 없으면 null)로 진행 상태를 알리고, 상세·환불 안내는 `GET /bookings/{id}/checkout`.
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }

  /bookings/{bookingId}/hold:
    delete:
      tags: [bookings]
      operationId: releaseHold
      summary: BKG-03 선점 해제 → CANCELED
      x-feature-id: BKG-03
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      responses:
        "200":
          description: CANCELED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            BOOKING_STATE_CONFLICT — details[{ field: "status", value, reason: BOOKING_NOT_PENDING·PAYMENT_IN_PROGRESS }] ·
            CHECKOUT_IN_PROGRESS — 체크아웃 saga가 **진행 중**(쿠폰 거절 뒤·재결제 대기 중은 해제 허용 — 좌석을 포기하는 길)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/payments:
    post:
      tags: [bookings]
      operationId: preparePayment
      summary: BKG-10 결제 준비 (TOSSPAY) — paymentId 발급 + 포트원 결제창에 넘길 값
      x-feature-id: BKG-10
      description: |
        포트원 결제창을 열기 전에 부른다(ADR-112). 검증(본인·PENDING·선점 유효·결제 1회·예매 마감 전)을 통과하면
        paymentId(UUID)를 발급해 예매에 붙이고(예매당 1회, ADR-24) Payment에 PROCESSING 행을 만든 뒤,
        화면이 `requestPayment`에 그대로 넣을 값(storeId·channelKey·paymentId·orderName·totalAmount·currency·payMethod)을 돌려준다.
        결제창이 끝나면 화면은 `POST /bookings/{id}/pay {method: TOSSPAY, paymentId}`로 결과 확인을 요청한다 —
        결제창의 성공·실패·취소 응답은 신호일 뿐이고 결과는 서버가 포트원 단건 조회로 정한다.
        **예매 단위로 멱등**: 이미 붙은 결제가 아직 결제창 대기(PROCESSING)면 키와 상관없이 같은 paymentId·결제창 값을 다시 준다
        (새로고침·결제창을 실수로 닫은 뒤·503 뒤 재시도. 포트원은 같은 paymentId로 결제창을 다시 여는 것을 받는다 — 11/14 테스트 채널 확인).
        돈은 이 API에서 움직이지 않는다. 결제창을 열지 않고 떠나면 Payment는 7분 뒤 포트원 조회로 닫고, 예매는 만료+2분 뒤 만료 스캔이 반영한다.
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentPrepareRequest" }
            example: { method: TOSSPAY }
      responses:
        "200":
          description: 준비됨 — 같은 Idempotency-Key 재요청은 같은 응답
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentPrepareResult" }
              example:
                bookingId: 9876
                paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13"
                amount: 30000
                orderName: "SeatSAC 영화 예매 2석"
                expiresAt: "2026-11-16T14:08:00+09:00"
                checkout: { provider: PORTONE, storeId: "store-00000000-0000-0000-0000-000000000000", channelKey: "channel-key-00000000-0000-0000-0000-000000000000", payMethod: EASY_PAY, currency: KRW }
        "400":
          description: |
            VALIDATION_FAILED(method가 TOSSPAY가 아님, Idempotency-Key 없음) ·
            SCREENING_STARTED(예매 마감 — 상영 시작 5분 전부터, details[{ field: "screeningId", value, reason: "BOOKING_CLOSED" }])
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            PAYMENT_ALREADY_REQUESTED(붙은 결제가 이미 끝났거나(승인·거절) 결제창이 없는 모의 결제 — 결과는 GET /bookings/{id}) ·
            BOOKING_STATE_CONFLICT(PENDING 아님 · 선점 만료 details[{ field: "status", value, reason: "HOLD_EXPIRED" }]) ·
            PAYMENT_PATH_CONFLICT(이 예매는 체크아웃 saga 경로 — `checkout_saga` 행이 있음) ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: SERVICE_UNAVAILABLE — Payment 응답 없음·서킷 열림·포트원 비활성(`APP_PORTONE_ENABLED=false`), 또는 Catalog 응답 없음(예매 마감 확인 전). 예매는 바뀌지 않는다
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/pay:
    post:
      tags: [bookings]
      operationId: payBooking
      summary: BKG-10 결제 (예매당 1회) → BKG-06 확정 또는 PAYMENT_FAILED
      x-feature-id: BKG-10
      description: |
        `method`로 갈린다(ADR-112).
        - `TOSSPAY`: 준비(`POST /bookings/{id}/payments`)로 받은 paymentId를 보내면 Payment가 포트원 단건 조회로
          status·금액을 검증해 APPROVED·FAILED를 정한다. 결제창이 아직 끝나지 않았으면(READY·PENDING) 503 PAYMENT_RESULT_UNKNOWN → 재조회.
          paymentId가 예매에 붙은 것과 다르거나 준비 없이(붙은 결제 없음) 오면 409 PAYMENT_ALREADY_REQUESTED(reason PAYMENT_ID_MISMATCH).
          booking → payment 응답 대기는 이 호출만 10초(`APP_SERVICES_PAYMENT_PG_READ_TIMEOUT`, Payment 안 포트원 호출 최대 약 8초)이고 재호출하지 않는다.
        - `CARD`: 모의 결제(ADR-13) — 테스트·분석 전용. `X-Payment-Mock-Key`가 맞을 때만. 끝 4자리 0000 → CARD_DECLINED,
          1111 → INSUFFICIENT_BALANCE, 9999 → 5초 지연 후 승인(503 PAYMENT_RESULT_UNKNOWN → GET /bookings/{id} 재조회), 그 밖은 승인.
          카드 번호는 저장·로그하지 않는다(Payment는 card_last4만).
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/MockPaymentKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayRequest" }
            examples:
              tosspay:
                value: { method: TOSSPAY, paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13" }
              mockCard:
                value: { method: CARD, card: { number: "4242424242424242", expiry: "12/28", holder: KIM } }
      responses:
        "200":
          description: 승인(CONFIRMED) 또는 거절(PAYMENT_FAILED). 둘 다 200, status로 구분
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayResult" }
              examples:
                approved:
                  value:
                    bookingId: 9876
                    status: CONFIRMED
                    confirmedAt: "2026-11-16T14:04:10+09:00"
                    seatLabels: [J7, J8]
                    payment: { paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13", method: TOSSPAY, status: APPROVED, cardLast4: null, approvedAt: "2026-11-16T14:04:10+09:00" }
                declined:
                  value:
                    bookingId: 9876
                    status: PAYMENT_FAILED
                    payment: { paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13", method: TOSSPAY, status: FAILED, failureCode: USER_CANCELED }
        "400":
          description: |
            VALIDATION_FAILED(결제 수단·카드 형식, Idempotency-Key 없음, CARD인데 card 없음, TOSSPAY인데 paymentId 없음,
            CARD 호출자 제한 — details[{ field: "method", value: "CARD", reason: "MOCK_NOT_ALLOWED" }]) ·
            SCREENING_STARTED(예매 마감 — 상영 시작 5분 전부터. 결제를 부르지 않는다, 선점은 TTL로 풀린다. TOSSPAY 완료 확인은 마감 뒤에도 받는다 — 이미 결제됐으면 ADR-100 환불 경로.
            details[{ field: "screeningId", value, reason: "BOOKING_CLOSED" }])
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            PAYMENT_ALREADY_REQUESTED(결과는 GET /bookings/{id}. TOSSPAY는 보낸 paymentId가 예매에 붙은 것과 다를 때도) ·
            BOOKING_STATE_CONFLICT(PENDING 아님, 또는 승인 후 만료 → details[{ field: "status", value: "EXPIRED", reason: "HOLD_EXPIRED" }, { field: "refunded", value: true }]) ·
            PAYMENT_PATH_CONFLICT(이 예매는 체크아웃 saga 경로) ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: |
            PAYMENT_RESULT_UNKNOWN — details[{ field: "paymentId", value }]. 예매는 PENDING 유지, 화면은 GET /bookings/{id}를 2초 간격 최대 5회
            (TOSSPAY: 포트원 상태가 아직 READY·PENDING, 또는 포트원·Payment 응답 없음) ·
            SERVICE_UNAVAILABLE — Payment 서킷 열림, 또는 Catalog 응답 없음(예매 마감 확인 전 — 결제를 부르지 않는다)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/checkout:
    post:
      tags: [checkout]
      operationId: startCheckout
      summary: 체크아웃 시작 (비동기 결제 saga) → 202
      x-feature-id: BKG-10
      description: |
        좌석을 잡은 예매(PENDING)의 결제를 saga로 시작한다(ADR-116, API 명세서 v1.5 21장). 요청 스레드는 payment·coupon을 부르지 않고
        `checkout_saga` 행과 첫 명령(아웃박스)을 한 트랜잭션에 쓰고 202를 돌려준다. 화면은 `GET /bookings/{id}/checkout`을 `pollAfterMs`마다 조회한다.
        - 쿠폰(`couponRef`)이 있으면 coupon 예약 → 할인 뒤 최종 금액으로 결제 준비. 쿠폰이 거절되면 `COUPON_REJECTED`(끝) — 예매·좌석·선점 시간은 그대로이고
          남은 시간 안에 다른 쿠폰이나 쿠폰 없이 **새 Idempotency-Key로 다시** 부른다(D14).
        - `TOSSPAY`: 결제 준비 → `READY_TO_PAY`(응답 `payment.portone`으로 결제창) → 결제창이 닫히면 `POST …/checkout/confirm`.
        - `CARD`(모의, `X-Payment-Mock-Key` 필수): 준비·결제창 없이 `CHARGING` → 확정/실패. k6 비교 측정용.
        - 선점 5분이 지나면 예매는 바로 EXPIRED(유예 없음), saga는 `EXPIRED` + `refundNotice`. 결제 여부 확인·환불은 payment가 맡는다(D15·D16).
        - 결제창 취소·PG 거절이 포트원 FAILED로 확인되면(플래그 `APP_CHECKOUT_PAYMENT_RETRY_ENABLED`, 시도 ≤ 3) `PAYMENT_RETRYABLE` — 좌석을 둔 채 다시 부른다(ADR-24 11/24 보완).
        플래그 `APP_CHECKOUT_SAGA_ENABLED=false`면 404. paymentId는 결제 명령을 처음 보낼 때 예매에 붙는다(쿠폰 단계에서는 아직 없음).
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
        - $ref: "#/components/parameters/MockPaymentKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
            examples:
              tosspayWithCoupon:
                value: { method: TOSSPAY, couponRef: "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d" }
              tosspay:
                value: { method: TOSSPAY }
              mockCard:
                value: { method: CARD, card: { number: "4242424242424242", expiry: "12/28", holder: KIM } }
      responses:
        "202":
          description: 접수 — 같은 Idempotency-Key 재요청은 같은 응답(ADR-19)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutAccepted" }
              example: { checkoutId: "5d0c7f1a-2b3e-4c5d-8e9f-0a1b2c3d4e5f", bookingId: 1042, state: STARTED, pollAfterMs: 1000 }
        "400":
          description: |
            VALIDATION_FAILED(method·card 형식, Idempotency-Key 없음, CARD인데 card 없음, CARD 호출자 제한 — details[{ field: "method", value: "CARD", reason: "MOCK_NOT_ALLOWED" }]) ·
            SCREENING_STARTED(예매 마감 — details[{ field: "screeningId", value, reason: "BOOKING_CLOSED" }])
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404":
          description: NOT_FOUND — 예매 없음, 또는 플래그 `APP_CHECKOUT_SAGA_ENABLED=false`(경로 없음)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: |
            CHECKOUT_IN_PROGRESS(이 예매에 진행 중인 체크아웃 — `checkout_saga.active_booking_id` 유일 키) ·
            PAYMENT_PATH_CONFLICT(동기 경로 결제가 붙어 있음 — `current_payment_id`가 있고 마지막 saga가 PAYMENT_RETRYABLE이 아님) ·
            BOOKING_STATE_CONFLICT(PENDING 아님 · 선점 만료 details[{ field: "status", value, reason: "HOLD_EXPIRED" }] · 재시도 3회 초과 reason "RETRY_LIMIT") ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: SERVICE_UNAVAILABLE — Catalog 응답 없음(예매 마감 확인 전). payment·coupon은 부르지 않으므로 그쪽 장애로는 실패하지 않는다
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

    get:
      tags: [checkout]
      operationId: getCheckout
      summary: 체크아웃 상태 (polling) — 가장 최근 체크아웃
      x-feature-id: BKG-10
      description: |
        `pollAfterMs`(진행 중 1000, 끝난 상태 null)마다 조회한다. payment·coupon을 부르지 않는다(booking 데이터만).
        `READY_TO_PAY`면 `payment.portone`으로 결제창을 열고, 끝난 상태면 `state`·`failure`·`refundNotice`로 결과 화면을 그린다 —
        `EXPIRED`는 기존 완료(티켓) 화면 레이아웃에 환불 안내 문구와 버튼(예매 내역·다시 예매·홈). 「환불 완료」는 없다(booking은 모른다).
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkout" }
              examples:
                readyToPay:
                  value:
                    checkoutId: "5d0c7f1a-2b3e-4c5d-8e9f-0a1b2c3d4e5f"
                    bookingId: 1042
                    state: READY_TO_PAY
                    step: PAYMENT_PREPARED
                    method: TOSSPAY
                    attempt: 1
                    retryable: false
                    amount: { original: 30000, discount: 15000, final: 15000 }
                    coupon: { couponRef: "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d", discount: { kind: RATE, value: 50 }, state: RESERVED }
                    payment:
                      paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13"
                      portone: { storeId: "store-00000000-0000-0000-0000-000000000000", channelKey: "channel-key-00000000-0000-0000-0000-000000000000", paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13", orderName: "SeatSAC 영화 예매 2석", totalAmount: 15000, currency: KRW, payMethod: EASY_PAY }
                    failure: null
                    refundNotice: null
                    expiresAt: "2026-11-24T14:05:00+09:00"
                    updatedAt: "2026-11-24T14:00:12+09:00"
                    pollAfterMs: 1000
                expiredRefundInProgress:
                  value:
                    checkoutId: "5d0c7f1a-2b3e-4c5d-8e9f-0a1b2c3d4e5f"
                    bookingId: 1042
                    state: EXPIRED
                    step: VERIFYING
                    method: TOSSPAY
                    attempt: 1
                    retryable: false
                    amount: { original: 30000, discount: 0, final: 30000 }
                    coupon: null
                    payment: { paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13", portone: null }
                    failure: { code: HOLD_EXPIRED, reason: PAYMENT_RESULT_UNKNOWN }
                    refundNotice: REFUND_IN_PROGRESS
                    expiresAt: "2026-11-24T14:05:00+09:00"
                    updatedAt: "2026-11-24T14:07:30+09:00"
                    pollAfterMs: null
                couponRejected:
                  value:
                    checkoutId: "6e1d8a2b-3c4f-4d5e-9fa0-1b2c3d4e5f6a"
                    bookingId: 1042
                    state: COUPON_REJECTED
                    step: COUPON_RESERVING
                    method: TOSSPAY
                    attempt: 1
                    retryable: true
                    amount: { original: 30000, discount: 0, final: 30000 }
                    coupon: { couponRef: "9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d", discount: null, state: REJECTED }
                    payment: null
                    failure: { code: COUPON_NOT_USABLE, reason: EXPIRED }
                    refundNotice: null
                    expiresAt: "2026-11-24T14:05:00+09:00"
                    updatedAt: "2026-11-24T14:00:03+09:00"
                    pollAfterMs: null
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404":
          description: NOT_FOUND — 예매 없음, 이 예매에 체크아웃 없음, 또는 플래그 off
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/checkout/confirm:
    post:
      tags: [checkout]
      operationId: confirmCheckout
      summary: 결제창이 닫힌 뒤 결제 확인 요청 (TOSSPAY) → 202
      x-feature-id: BKG-10
      description: |
        결제창이 성공·취소 어느 쪽으로 닫혀도 부른다 — 결과는 payment가 포트원 단건 조회로 정한다. booking은 `READY_TO_PAY → VERIFYING`과
        `payment.verification-requested` 아웃박스 행을 한 트랜잭션에 쓰고 202. 결과를 모르면 보상하지 않고 재확인(NOT_YET 5초, 무응답 2배씩, 선점 만료까지).
        모바일은 결제창이 돌아온 주소(`?paymentId=…`)에서 이 API를 부른다. 확인 요청 없이 떠나도 포트원 웹훅·payment 스윕이 결제를 닫고 결과를 알려 확정된다.
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutConfirmRequest" }
            example: { paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13" }
      responses:
        "202":
          description: 접수
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutAccepted" }
              example: { checkoutId: "5d0c7f1a-2b3e-4c5d-8e9f-0a1b2c3d4e5f", bookingId: 1042, state: VERIFYING, pollAfterMs: 1000 }
        "400":
          description: |
            VALIDATION_FAILED — paymentId 없음, 또는 체크아웃의 paymentId와 다름(details[{ field: "paymentId", value, reason: "PAYMENT_ID_MISMATCH" }])
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404":
          description: NOT_FOUND — 예매·체크아웃 없음, 또는 플래그 off
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: |
            CHECKOUT_NOT_READY — state가 READY_TO_PAY가 아님(details[{ field: "state", value }]). 이미 VERIFYING 이후면 polling으로 결과를 본다 ·
            IDEMPOTENCY_KEY_CONFLICT · IDEMPOTENCY_IN_PROGRESS
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  /bookings/{bookingId}/cancel:
    post:
      tags: [bookings]
      operationId: cancelBooking
      summary: BKG-07 예매 취소 + 환불(PAY-03). CONFIRMED·상영 시작 전만
      x-feature-id: BKG-07
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      responses:
        "200":
          description: CANCELED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CancelResult" }
        "400":
          description: SCREENING_STARTED
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotOwner" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: BOOKING_STATE_CONFLICT — CONFIRMED 아님
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT   # Cognito Access Token (ID 토큰 아님)

  parameters:
    ScreeningId: { name: screeningId, in: path, required: true, schema: { type: integer, format: int64 } }
    BookingId: { name: bookingId, in: path, required: true, schema: { type: integer, format: int64 } }
    IdempotencyKeyRequired:
      { name: Idempotency-Key, in: header, required: true, description: "요청마다 새 UUID, 재시도만 같은 값", schema: { type: string, format: uuid } }
    IdempotencyKeyOptional:
      { name: Idempotency-Key, in: header, required: false, description: "상태 전이 자체가 멱등이라 선택", schema: { type: string, format: uuid } }
    MockPaymentKey:
      name: X-Payment-Mock-Key
      in: header
      required: false
      description: "모의 결제(method CARD) 허용 키 — k6·블루/그린 분석 Job 전용(booking Secret `APP_PAYMENT_MOCK_KEY`와 같을 때만). 사람(화면)은 모의 결제를 쓰지 않는다. 값은 로그·PR·문서에 쓰지 않는다"
      schema: { type: string, minLength: 16 }

  responses:
    Unauthorized:
      description: UNAUTHORIZED (Gateway) — 토큰 없음·만료·서명 불일치
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotOwner:
      description: FORBIDDEN — 본인 예매가 아님
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    NotFound:
      description: NOT_FOUND
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE — 하위 서비스(Catalog·Payment) 응답 없음·서킷 열림. 아무것도 바뀌지 않음
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    ErrorResponse:
      $ref: "../schemas/error.v1.json"

    SeatStatus: { type: string, enum: [AVAILABLE, HELD, RESERVED] }
    BookingStatus: { type: string, enum: [PENDING, CONFIRMED, PAYMENT_FAILED, EXPIRED, CANCELED] }
    PaymentStatus: { type: string, enum: [PROCESSING, APPROVED, FAILED, CANCELED] }
    PaymentMethod: { type: string, enum: [CARD, TOSSPAY], description: "CARD = 모의 결제(테스트·분석 전용) · TOSSPAY = 포트원 토스페이(ADR-112)" }
    FailureCode:
      type: [string, "null"]
      x-extensible-enum: [CARD_DECLINED, INSUFFICIENT_BALANCE, PG_DECLINED, USER_CANCELED, AMOUNT_MISMATCH, null]
      description: "CARD_DECLINED·INSUFFICIENT_BALANCE = 모의(ADR-13) · PG_DECLINED = 포트원 FAILED · USER_CANCELED = 결제창에서 사용자 취소 · AMOUNT_MISMATCH = 포트원 결제 금액이 예매 금액과 달라 서버가 취소(위변조 의심)"


    SeatSnapshot:
      type: object
      required: [screeningId, layoutVersion, seq, generatedAt, seats]
      properties:
        screeningId: { type: integer, format: int64 }
        layoutVersion: { type: integer, minimum: 1 }
        seq: { type: integer, format: int64, minimum: 0 }
        generatedAt: { type: string, format: date-time }
        seats:
          type: array
          items:
            type: object
            required: [seatId, status]
            properties:
              seatId: { type: integer, format: int64 }
              status: { $ref: "#/components/schemas/SeatStatus" }

    HoldResult:
      type: object
      required: [bookingId, screeningId, status, seatIds, seatLabels, seatCount, amount, expiresAt, createdAt]
      properties:
        bookingId: { type: integer, format: int64 }
        screeningId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/BookingStatus" }
        seatIds: { type: array, items: { type: integer, format: int64 } }
        seatLabels: { type: array, items: { type: string } }
        seatCount: { type: integer, minimum: 1, maximum: 4 }
        amount: { type: integer, description: "seatCount × 15000 (원)" }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    BookingPayment:
      type: object
      required: [paymentId, status]
      properties:
        paymentId: { type: string, format: uuid, description: "Booking 발급 UUID (10장 #4)" }
        method: { type: string, x-extensible-enum: [CARD, TOSSPAY], description: "응답용 열린 집합 — 수단이 늘 수 있어 모르는 값은 「기타」로 보여 준다(요청 PayRequest.method는 닫힌 PaymentMethod)" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        cardLast4: { type: [string, "null"], description: "CARD(모의)만. TOSSPAY는 null" }
        failureCode: { $ref: "#/components/schemas/FailureCode" }
        approvedAt: { type: [string, "null"], format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }

    Booking:
      type: object
      required: [bookingId, screeningId, status, seatIds, seatLabels, seatCount, amount, expiresAt, createdAt, confirmedAt, canceledAt, payment]
      properties:
        bookingId: { type: integer, format: int64 }
        screeningId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/BookingStatus" }
        seatIds: { type: array, items: { type: integer, format: int64 }, description: "PENDING·CONFIRMED일 때만, 끝난 예매는 []" }
        seatLabels: { type: array, items: { type: string } }
        seatCount: { type: integer }
        amount: { type: integer }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: [string, "null"], format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }
        payment:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BookingPayment"
        checkout:
          description: "체크아웃 saga 경로 예매면 가장 최근 체크아웃(없으면 null). 상세는 GET /bookings/{id}/checkout"
          oneOf:
            - type: "null"
            - type: object
              required: [checkoutId, state]
              properties:
                checkoutId: { type: string, format: uuid }
                state: { $ref: "#/components/schemas/CheckoutState" }

    CheckoutState:
      type: string
      x-extensible-enum: [STARTED, COUPON_RESERVING, PAYMENT_PREPARING, READY_TO_PAY, CHARGING, VERIFYING, CONFIRMED, COMPENSATING, FAILED, EXPIRED, COUPON_REJECTED, PAYMENT_RETRYABLE]
      description: |
        진행 중: STARTED → COUPON_RESERVING(쿠폰 있을 때) → PAYMENT_PREPARING → READY_TO_PAY(TOSSPAY) → VERIFYING, CARD는 CHARGING.
        끝: CONFIRMED · FAILED(보상 뒤) · EXPIRED(선점 5분) · COUPON_REJECTED(쿠폰만 거절 — 예매·좌석 유지, 다시 시작 가능) ·
        PAYMENT_RETRYABLE(포트원 FAILED 확인 — 예매·좌석 유지, 다시 결제 가능. 플래그가 켜졌을 때만). COMPENSATING은 보상 트랜잭션 안의 순간 상태.
        열린 집합 — 모르는 값은 「진행 중」으로 보여 주고 pollAfterMs를 따른다.

    CheckoutRequest:
      type: object
      required: [method]
      properties:
        method: { $ref: "#/components/schemas/PaymentMethod" }
        couponRef:
          type: string
          maxLength: 64
          description: "GET /coupons/me가 준 쿠폰 식별자를 그대로. booking은 해석·검증하지 않는다(coupon이 판정). 형식은 coupon 계약이 정한다"
        card:
          type: object
          description: "CARD(모의) 필수. TOSSPAY에서는 보내지 않는다"
          required: [number, expiry, holder]
          properties:
            number: { type: string, pattern: "^[0-9]{12,19}$", description: "모의 카드. 저장·로그 금지" }
            expiry: { type: string, pattern: "^(0[1-9]|1[0-2])/[0-9]{2}$" }
            holder: { type: string, minLength: 1, maxLength: 50 }

    CheckoutConfirmRequest:
      type: object
      required: [paymentId]
      properties:
        paymentId: { type: string, format: uuid, description: "GET …/checkout의 payment.paymentId(= 포트원 결제창 paymentId)" }

    CheckoutAccepted:
      type: object
      required: [checkoutId, bookingId, state, pollAfterMs]
      properties:
        checkoutId: { type: string, format: uuid }
        bookingId: { type: integer, format: int64 }
        state: { $ref: "#/components/schemas/CheckoutState" }
        pollAfterMs: { type: integer, description: "다음 GET …/checkout까지 기다릴 ms" }

    Checkout:
      type: object
      required: [checkoutId, bookingId, state, step, method, attempt, retryable, amount, coupon, payment, failure, refundNotice, expiresAt, updatedAt, pollAfterMs]
      properties:
        checkoutId: { type: string, format: uuid }
        bookingId: { type: integer, format: int64 }
        state: { $ref: "#/components/schemas/CheckoutState" }
        step: { type: string, description: "마지막으로 끝낸 단계(표시·디버깅용, 열린 집합)" }
        method: { type: string, x-extensible-enum: [CARD, TOSSPAY] }
        attempt: { type: integer, minimum: 1, description: "이 예매의 몇 번째 체크아웃인지(쿠폰 거절·재결제 뒤 다시 시작하면 +1). 상한 3" }
        retryable: { type: boolean, description: "끝난 상태에서 같은 예매로 다시 POST …/checkout을 부를 수 있는지(COUPON_REJECTED·PAYMENT_RETRYABLE, attempt < 3, 선점 유효)" }
        amount:
          type: object
          required: [original, discount, final]
          properties:
            original: { type: integer, description: "seatCount × 15000" }
            discount: { type: integer, minimum: 0 }
            final: { type: integer, minimum: 1, description: "포트원 결제창 totalAmount. 15,000의 배수가 아닐 수 있다" }
        coupon:
          oneOf:
            - type: "null"
            - type: object
              required: [couponRef, discount, state]
              properties:
                couponRef: { type: string }
                discount:
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [kind, value]
                      properties:
                        kind: { type: string, x-extensible-enum: [RATE, AMOUNT], description: "RATE = %, AMOUNT = 원" }
                        value: { type: integer, minimum: 0 }
                state: { type: string, x-extensible-enum: [RESERVING, RESERVED, USED, RELEASED, REJECTED], description: "saga 상태에서 유도(booking은 쿠폰 상태를 저장하지 않는다)" }
        payment:
          oneOf:
            - type: "null"
            - type: object
              required: [paymentId, portone]
              properties:
                paymentId: { type: string, format: uuid }
                portone:
                  description: "READY_TO_PAY일 때만. 포트원 requestPayment에 그대로 넘기는 공개 값"
                  oneOf:
                    - type: "null"
                    - type: object
                      required: [storeId, channelKey, paymentId, orderName, totalAmount, currency, payMethod]
                      properties:
                        storeId: { type: string }
                        channelKey: { type: string }
                        paymentId: { type: string, format: uuid }
                        orderName: { type: string, maxLength: 100 }
                        totalAmount: { type: integer, minimum: 1 }
                        currency: { type: string, enum: [KRW] }
                        payMethod: { type: string, enum: [EASY_PAY] }
        failure:
          oneOf:
            - type: "null"
            - type: object
              required: [code, reason]
              properties:
                code:
                  type: string
                  x-extensible-enum: [COUPON_NOT_USABLE, PAYMENT_DECLINED, STEP_TIMEOUT, HOLD_EXPIRED, PAYMENT_PATH_CONFLICT]
                  description: "STEP_TIMEOUT은 돈이 움직이기 전 단계(COUPON_RESERVING·PAYMENT_PREPARING, 10초)만. 결제 결과 불명은 HOLD_EXPIRED + reason PAYMENT_RESULT_UNKNOWN"
                reason: { type: [string, "null"], description: "coupon 거절 reason · payment failureCode · 단계 이름 · PAYMENT_RESULT_UNKNOWN. 값 집합은 보낸 쪽 소유" }
        refundNotice:
          type: [string, "null"]
          x-extensible-enum: [WILL_REFUND_IF_PAID, REFUND_IN_PROGRESS, null]
          description: |
            EXPIRED일 때 화면 안내. null = 결제가 없었거나 안 된 것이 확인됨(「시간이 지나 예매가 취소됐어요」) ·
            WILL_REFUND_IF_PAID = 만료 때 결제 여부를 몰랐다(「결제가 확인되면 환불을 진행하겠습니다」) ·
            REFUND_IN_PROGRESS = 만료 뒤 승인이 확인됐다(「환불을 진행 중입니다」). 「환불 완료」는 없다
        expiresAt: { type: string, format: date-time, description: "선점 만료(최초 선점 기준, 재시도해도 늘지 않는다)" }
        updatedAt: { type: string, format: date-time }
        pollAfterMs: { type: [integer, "null"], description: "진행 중 1000, 끝난 상태 null" }

    PayRequest:
      type: object
      required: [method]
      description: "`method`에 따라 필수 필드가 다르다 — TOSSPAY: paymentId · CARD: card. 빠지면 400 VALIDATION_FAILED"
      properties:
        method: { $ref: "#/components/schemas/PaymentMethod" }
        paymentId: { type: string, format: uuid, description: "TOSSPAY 필수 — POST /bookings/{id}/payments가 발급한 값" }
        card:
          type: object
          description: "CARD(모의) 필수. TOSSPAY에서는 보내지 않는다"
          required: [number, expiry, holder]
          properties:
            number: { type: string, pattern: "^[0-9]{12,19}$", description: "모의 카드. 저장·로그 금지" }
            expiry: { type: string, pattern: "^(0[1-9]|1[0-2])/[0-9]{2}$", examples: ["12/28"] }
            holder: { type: string, minLength: 1, maxLength: 50 }

    PaymentPrepareRequest:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [TOSSPAY], description: "준비가 필요한 수단만. CARD(모의)는 준비 없이 /pay 한 번" }

    PaymentPrepareResult:
      type: object
      required: [bookingId, paymentId, amount, orderName, expiresAt, checkout]
      properties:
        bookingId: { type: integer, format: int64 }
        paymentId: { type: string, format: uuid, description: "Booking 발급. 포트원 paymentId(가맹점 채번, 매번 고유)로 그대로 쓴다" }
        amount: { type: integer, description: "requestPayment.totalAmount — 서버가 완료 확인 때 포트원 응답 amount.total과 대조한다" }
        orderName: { type: string, maxLength: 100 }
        expiresAt: { type: string, format: date-time, description: "선점 만료. 이 안에 결제창을 끝내지 않으면 승인돼도 환불(ADR-100)" }
        checkout:
          type: object
          description: "포트원 브라우저 SDK requestPayment에 그대로 넘기는 공개 값(비밀 아님)"
          required: [provider, storeId, channelKey, payMethod, currency]
          properties:
            provider: { type: string, enum: [PORTONE] }
            storeId: { type: string }
            channelKey: { type: string, description: "토스페이 채널 키" }
            payMethod: { type: string, enum: [EASY_PAY] }
            currency: { type: string, enum: [KRW] }

    PayResult:
      type: object
      required: [bookingId, status, payment]
      properties:
        bookingId: { type: integer, format: int64 }
        status: { type: string, enum: [CONFIRMED, PAYMENT_FAILED] }
        confirmedAt: { type: string, format: date-time, description: "CONFIRMED일 때만" }
        seatLabels:
          type: array
          description: 결제 완료 화면이 좌석을 다시 조회하지 않도록 함께 돌려준다 (API 명세서 BKG-10 200 예시)
          items: { type: string }
          example: [J7, J8]
        payment: { $ref: "#/components/schemas/BookingPayment" }

    CancelResult:
      type: object
      required: [bookingId, status, canceledAt]
      properties:
        bookingId: { type: integer, format: int64 }
        status: { type: string, enum: [CANCELED] }
        canceledAt: { type: string, format: date-time }
        payment:
          description: "BKG-07(결제 취소)만. BKG-03 해제에는 없음"
          type: object
          required: [paymentId, status]
          properties:
            paymentId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/PaymentStatus" }
