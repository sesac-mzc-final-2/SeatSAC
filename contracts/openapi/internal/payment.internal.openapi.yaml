openapi: 3.1.0
info:
  title: seatsac payment internal API
  version: "1.1"
  description: |
    API 명세서 v1.1 6장 (PAY-01·03 · 남궁일). 외부 비노출, 호출자는 booking만(NetworkPolicy).
    paymentId는 Booking이 발급하는 UUID(10장 #4). 사용자 ID는 받지 않는다(추적은 bookingId·traceId).
    결제 수단(ADR-112): `TOSSPAY` = 포트원 V2 토스페이(pg_provider PORTONE) · `CARD` = 모의 결제(pg_provider MOCK, 테스트·분석 전용 — 호출자 제한은 booking이 한다).
    CARD 처리 순서: PROCESSING 행 INSERT·커밋 → 모의 판정(트랜잭션 밖) → UPDATE … WHERE status='PROCESSING'.
    모의 카드(ADR-13): 끝 4자리 0000 CARD_DECLINED · 1111 INSUFFICIENT_BALANCE · 9999 5초 지연 후 승인 · 그 밖 승인.
    TOSSPAY 처리 순서: POST(PROCESSING 행 + checkout 값) → 화면이 포트원 결제창 → POST …/verify(포트원 GET /payments/{paymentId}로 status·금액 검증 → APPROVED·FAILED).
    포트원 호출은 연결 1초·응답 3초, 서킷 `portone`. 결제창을 열지 않고 떠난 PROCESSING은 `APP_PORTONE_PENDING_TIMEOUT`(7분) 뒤 포트원 조회로 닫는다.
    30초 `PROCESSING_TIMEOUT` 정리(ADR-60)는 MOCK 행에만 적용한다.
    오류 code는 공통 코드, 세부는 details[].reason (INVALID_PAYMENT_ID·INVALID_AMOUNT·INVALID_CARD·INVALID_METHOD·PAYMENT_NOT_FOUND).
servers:
  - url: http://payment:8080
security: []   # 내부 API: 사용자 인증 없음. 호출자는 NetworkPolicy로 제한 (OPS-15)
paths:
  /internal/payments:
    post:
      operationId: createPayment
      summary: PAY-01 결제 생성 — CARD는 모의 승인까지, TOSSPAY는 PROCESSING 행 + 결제창 값 (호출자 booking만, paymentId는 booking 발급)
      x-feature-id: PAY-01
      x-caller: [booking]
      description: |
        CARD: 모의 판정까지 끝내 APPROVED·FAILED(지연 카드는 PROCESSING)를 돌려준다.
        TOSSPAY: PROCESSING 행만 만들고 `checkout`(storeId·channelKey·payMethod·currency)을 함께 돌려준다. 돈은 움직이지 않는다.
        `APP_PORTONE_ENABLED=false`면 TOSSPAY는 503 SERVICE_UNAVAILABLE(reason PORTONE_DISABLED).
        같은 paymentId 재요청 → 현재 상태 그대로 200(PROCESSING이면 PROCESSING).
        같은 paymentId에 bookingId·amount가 다르면 409 PAYMENT_CONFLICT(reason PAYMENT_ID_CONFLICT),
        같은 bookingId에 다른 paymentId면 409 PAYMENT_CONFLICT(reason PAYMENT_ALREADY_EXISTS).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentRequest" }
            examples:
              tosspay:
                value:
                  paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13"
                  bookingId: 9876
                  amount: 30000
                  method: TOSSPAY
                  orderName: "SeatSAC 영화 예매 2석"
              mockCard:
                value:
                  paymentId: "3f2b8c1e-7a4d-4e9b-9c61-2d5f0a8e7b13"
                  bookingId: 9876
                  amount: 30000
                  method: CARD
                  card: { number: "4242424242424242", expiry: "12/28", holder: KIM }
      responses:
        "200":
          description: APPROVED · FAILED · PROCESSING 모두 200, status로 구분. TOSSPAY는 PROCESSING + checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400":
          description: VALIDATION_FAILED — reason INVALID_PAYMENT_ID·INVALID_AMOUNT(15,000의 배수, 15,000~60,000)·INVALID_CARD(CARD인데 card 없음·형식)·INVALID_METHOD
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: PAYMENT_CONFLICT — reason PAYMENT_ID_CONFLICT·PAYMENT_ALREADY_EXISTS
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: SERVICE_UNAVAILABLE — reason PORTONE_DISABLED(TOSSPAY인데 `APP_PORTONE_ENABLED=false`). 행을 만들지 않는다
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /internal/payments/{paymentId}:
    get:
      operationId: getPayment
      summary: 결제 상태 조회 (BKG-10 결과 미확인·GET /bookings/{id}·만료 처리)
      x-caller: [booking]
      parameters: [ { $ref: "#/components/parameters/PaymentId" } ]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400":
          description: VALIDATION_FAILED — reason INVALID_PAYMENT_ID(paymentId가 UUID 형식이 아님)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: NOT_FOUND (reason PAYMENT_NOT_FOUND)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /internal/payments/{paymentId}/verify:
    post:
      operationId: verifyPayment
      summary: PAY-04 포트원 결제 확인 — 단건 조회로 status·금액을 검증해 APPROVED·FAILED를 정한다 (TOSSPAY만)
      x-feature-id: PAY-04
      x-caller: [booking]
      description: |
        포트원 `GET /payments/{paymentId}`를 부른다(Authorization: PortOne {V2 API Secret}).
        - PAID이고 `amount.total` = 저장 금액·통화 KRW → APPROVED(pg_transaction_id 저장)
        - PAID인데 금액이 다름 → 포트원 취소 요청 뒤 FAILED(failureCode AMOUNT_MISMATCH) — 브라우저 금액 위변조
        - FAILED → FAILED(failureCode PG_DECLINED, 사용자 취소면 USER_CANCELED)
        - READY·PENDING(결제창 미완료) → PROCESSING 그대로 200
        - CANCELLED·PARTIAL_CANCELLED → CANCELED
        이미 끝난 행(APPROVED·FAILED·CANCELED)은 포트원을 부르지 않고 그대로 200(멱등). 웹훅 `Transaction.Paid`도 같은 로직을 탄다.
        포트원 응답을 못 받으면 503(booking은 PAYMENT_RESULT_UNKNOWN으로 화면 재조회).
      parameters: [ { $ref: "#/components/parameters/PaymentId" } ]
      responses:
        "200":
          description: 현재 상태 (PROCESSING이면 아직 결제창 미완료)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400":
          description: VALIDATION_FAILED — reason INVALID_PAYMENT_ID
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: NOT_FOUND (reason PAYMENT_NOT_FOUND)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: PAYMENT_CONFLICT — reason NOT_VERIFIABLE(MOCK 행 — CARD는 생성 때 판정이 끝난다)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: SERVICE_UNAVAILABLE — 포트원 응답 없음·서킷 열림(reason PORTONE_UNAVAILABLE). 행은 바뀌지 않는다
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  /internal/payments/{paymentId}/cancel:
    post:
      operationId: cancelPayment
      summary: PAY-03 취소 (멱등) — PORTONE은 포트원 취소 API까지
      x-feature-id: PAY-03
      x-caller: [booking]
      description: |
        APPROVED → CANCELED. 이미 CANCELED면 그대로 200(처음 사유 유지).
        PORTONE 행은 포트원 `POST /payments/{paymentId}/cancel`이 성공(또는 이미 취소)했을 때만 CANCELED로 바꾼다 —
        포트원 응답을 못 받으면 503(booking·만료 처리가 다시 시도).
        FAILED → 409 PAYMENT_NOT_APPROVED(reason PAYMENT_FAILED), PROCESSING → 409 PAYMENT_NOT_APPROVED(reason PAYMENT_PROCESSING).
      parameters: [ { $ref: "#/components/parameters/PaymentId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: "#/components/schemas/CancelReason" }
            example: { reason: BOOKING_CANCELED }
      responses:
        "200":
          description: CANCELED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400":
          description: VALIDATION_FAILED — reason INVALID_PAYMENT_ID(paymentId가 UUID 형식이 아님)·INVALID_CANCEL_REASON(reason 없음 또는 CancelReason 밖의 값)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "404":
          description: NOT_FOUND (reason PAYMENT_NOT_FOUND)
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "409":
          description: PAYMENT_NOT_APPROVED — reason PAYMENT_FAILED·PAYMENT_PROCESSING
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
        "503":
          description: SERVICE_UNAVAILABLE — PORTONE 행인데 포트원 취소 응답 없음(reason PORTONE_UNAVAILABLE). 행은 APPROVED 그대로
          content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

components:
  parameters:
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: booking이 발급한 UUID(PaymentRequest.paymentId와 같은 값). 형식이 틀리면 400
      schema: { type: string, format: uuid }
  schemas:
    ErrorResponse:
      $ref: "../../schemas/error.v1.json"

    CancelReason: { type: string, enum: [HOLD_EXPIRED, BOOKING_CANCELED, STALE_PAYMENT] }

    PaymentMethod: { type: string, x-extensible-enum: [CARD, TOSSPAY], description: "CARD = 모의(MOCK) · TOSSPAY = 포트원 토스페이(PORTONE). 수단이 늘 수 있어 열린 집합" }
    PgProvider: { type: string, enum: [MOCK, PORTONE] }

    PaymentRequest:
      type: object
      required: [paymentId, bookingId, amount, method]
      description: "CARD는 card 필수, TOSSPAY는 orderName 필수(card 없음)"
      properties:
        paymentId: { type: string, format: uuid }
        bookingId: { type: integer, format: int64 }
        amount: { type: integer, minimum: 15000, maximum: 60000, multipleOf: 15000 }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        orderName: { type: string, maxLength: 100, description: "TOSSPAY — 포트원 결제창에 보이는 주문명" }
        card:
          type: object
          description: "CARD(모의)만"
          required: [number, expiry, holder]
          properties:
            number: { type: string, pattern: "^[0-9]{12,19}$", description: "저장하지 않음. card_last4만" }
            expiry: { type: string, pattern: "^(0[1-9]|1[0-2])/[0-9]{2}$" }
            holder: { type: string, minLength: 1, maxLength: 50 }

    Payment:
      type: object
      required: [paymentId, bookingId, amount, method, status, cardLast4, failureCode, cancelReason, approvedAt, canceledAt, createdAt]
      properties:
        paymentId: { type: string, format: uuid }
        bookingId: { type: integer, format: int64 }
        amount: { type: integer }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        pgProvider: { $ref: "#/components/schemas/PgProvider" }
        status: { type: string, enum: [PROCESSING, APPROVED, FAILED, CANCELED] }
        cardLast4: { type: [string, "null"], description: "CARD만. TOSSPAY는 null" }
        pgTransactionId: { type: [string, "null"], description: "PORTONE 승인 뒤 포트원 transactionId. MOCK은 null" }
        checkout:
          description: "TOSSPAY PROCESSING 응답에만. 화면이 requestPayment에 그대로 넘기는 공개 값"
          oneOf:
            - type: "null"
            - type: object
              required: [provider, storeId, channelKey, payMethod, currency]
              properties:
                provider: { type: string, enum: [PORTONE] }
                storeId: { type: string }
                channelKey: { type: string }
                payMethod: { type: string, enum: [EASY_PAY] }
                currency: { type: string, enum: [KRW] }
        failureCode:
          type: [string, "null"]
          x-extensible-enum: [CARD_DECLINED, INSUFFICIENT_BALANCE, PROCESSING_TIMEOUT, PG_DECLINED, USER_CANCELED, AMOUNT_MISMATCH, null]
          description: |
            CARD_DECLINED·INSUFFICIENT_BALANCE는 모의 판정 결과(5장).
            PG_DECLINED·USER_CANCELED·AMOUNT_MISMATCH는 PORTONE — 포트원 FAILED·사용자 취소·금액 불일치(서버가 취소).
            PROCESSING_TIMEOUT은 판정 중 파드가 죽어 PROCESSING으로 남은 행을 payment가
            기동 시와 그 뒤 주기 정리(1분)로 FAILED로 닫은 경우다(명세 3·7장) — 승인된 적이
            없으므로 booking은 결제 실패로 보고 좌석을 풀면 된다. PORTONE 행은 7분 뒤 포트원 조회에서
            PAID가 아닐 때만 같은 코드로 닫는다(PAID면 APPROVED로 바꾸고 booking이 ADR-100대로 환불).
            이 값은 내부 코드다. booking은 외부 응답(PayResult·Booking)의 failureCode로
            그대로 흘리지 않고 null로 바꿔 「결제 실패」로만 보여 준다.
        cancelReason:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/CancelReason"
        approvedAt: { type: [string, "null"], format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
