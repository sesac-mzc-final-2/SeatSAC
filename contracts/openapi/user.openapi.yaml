openapi: 3.0.3
info:
  title: seatsac user API
  version: 0.3.0-draft
  description: |
    WBS 2.2.4 User API 명세 (초안 v0.3, 2026-10-21). catalog-user.openapi.yaml(v0.3)에서 User 부분을 분리한 파일로, Catalog 부분은 catalog.openapi.yaml에 있다.
    v0.3 변경: 남궁일 변경 요청(10/20) 반영 — 인증 Cognito(ADR-37, 10/19 확정) 반영으로 USR-01~03 삭제, 사용자 ID = Cognito `sub`(UUID 문자열),
    오류 `details` 항상 배열·`{field, value, reason}`, `traceId` 32자리, Catalog ID BIGINT(int64), DB 시각 UTC 저장.
    기준 문서: 노션 「SeatSAC 기능명세서」 4·5·6장, 「ERD·서비스별 스키마」(2.2.2, 6차), 「도메인 분리·서비스 경계 정의」(2.1.2).

    공통 규칙
    - 외부 요청은 모두 Gateway를 거친다. 인증이 필요한 API는 `Authorization: Bearer {accessToken}`.
      토큰은 Cognito Access Token이며 Gateway가 JWKS로 검증한다(GW-02, ADR-37). 가입·로그인·토큰 재발급은 Cognito Hosted UI가 처리하므로 이 명세에 API가 없다(기능명세서 6장 USR-01~03).
      Gateway는 검증 후 `X-User-Id`(= `sub`), `X-User-Role`(`cognito:groups`에서 USER·ADMIN), `X-Trace-Id`를 붙여 하위 서비스로 넘긴다(GW-02, GW-03).
      Payment는 외부에 노출하지 않는다(/payments 라우트 없음).
    - `X-Trace-Id`는 소문자 16진수 32자리. 외부에서 보낸 값은 덮어쓰고 응답 헤더로도 돌려준다.
    - `/internal/**` 경로는 서비스 간 동기 호출 전용이다. Gateway에 라우트를 만들지 않아 외부에서 호출할 수 없다.
    - 서비스 간 호출 타임아웃은 연결 1초·응답 3초(10/16 팀 기준). Catalog → Booking 잔여석만 300ms.
    - 취소 상태 철자는 CANCELED.
    - ID: Catalog ID(영화·극장·상영관·회차·좌석)는 BIGINT(`int64`). 사용자 ID는 Cognito `sub` 문자열(36자 UUID).
    - JSON 필드는 camelCase, 시각은 ISO-8601 `+09:00`으로 응답한다(DB 저장은 UTC, 변환은 응답 직렬화에서). 날짜는 `YYYY-MM-DD`이며
      요청의 `date`는 KST 영업일(`business_date`)이다.
    - 목록 페이징은 `page`(0부터), `size`(기본 20, 최대 50). 페이징 응답은 `{content, page, size, totalElements, totalPages}`,
      페이징 없는 목록(극장·회차·요약)은 `{items}`로 구분한다(Booking과 통일, 10/21).
    - 오류 응답은 모두 `ErrorResponse` 형식(Gateway 401·503 포함).
  x-wbs: "2.2.4"
servers:
  - url: /api
    description: 외부 API. CloudFront와 같은 도메인의 /api/* 이며 Gateway가 /api를 제거해 전달한다(기능명세서 2장, v4). /internal/** 은 이 서버가 아니라 K8s Service DNS로 호출한다
  - url: http://user.cinema-staging.svc.cluster.local:8080
    description: User 서비스 (내부 API 전용, K8s Service DNS. 네임스페이스는 인프라 확정값에 맞출 것)
tags:
  - name: User
    description: 내 프로필·마이페이지·선호 정보 (USR-04, 05, GET /users/me)
  - name: Internal
    description: 서비스 간 동기 호출 전용. Gateway에 노출하지 않음

paths:
  /users/me:
    get:
      tags: [User]
      operationId: getMe
      summary: 내 프로필 조회 (첫 호출 시 프로필 생성)
      description: |
        ERD 6차(3.2)의 "첫 `GET /users/me` 때 프로필 생성"와 기능명세서 6장에 맞춘 API(10/21 결정). 사용자 ID는 Cognito `sub`라 User가 만드는 값이 아니다.
        첫 호출 때 `X-User-Id`로 user 행이 없으면 만들고, email·name은 Cognito `GetUser`로 채운다(v1.0 10장 #2).
        이후에는 저장된 값을 돌려준다. 역할은 토큰의 `cognito:groups`에서 오며 DB에 저장하지 않는다.
        첫 호출에서 Cognito 호출이 실패하면 503(code=IDENTITY_UNAVAILABLE).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /users/me/bookings:
    get:
      tags: [User]
      operationId: listMyBookings
      summary: 마이페이지 예매 내역 (USR-04)
      description: |
        처리 순서
        1. Booking `GET /internal/bookings?userId=`로 예매 목록을 받는다(userId = Cognito `sub` 문자열, PENDING 제외).
           Booking 응답의 목록 키는 `content`(page·size·totalElements·totalPages)이고,
           각 항목에 상태와 좌석 번호(seatLabels, booking.seat_labels)가 들어 있다.
        2. Catalog `POST /internal/screenings/summaries`로 회차·영화·극장 정보를 한 번에 받는다.
        3. 둘을 합쳐 돌려준다. Catalog가 실패하면 screening을 null로 두고 예매·좌석 번호만 보여준다.
        Booking이 실패하면 503(code=BOOKING_UNAVAILABLE). 내역 없음은 빈 배열.
        타임아웃은 두 호출 모두 연결 1초·응답 3초.
        페이징 응답의 목록 키는 Booking과 같은 `content`다(D8 결정). Booking 응답의 페이징 필드를 그대로 쓴다.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          description: 없으면 PENDING을 뺀 전부. 화면 표시 예매 완료·결제 실패·시간 초과·취소됨
          schema:
            type: array
            items: { type: string, enum: [CONFIRMED, PAYMENT_FAILED, EXPIRED, CANCELED] }
          style: form
          explode: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [content]
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/MyBooking' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /users/me/preferences:
    get:
      tags: [User]
      operationId: getMyPreferences
      summary: 선호 정보 조회 (USR-05)
      description: 설정 화면에 기존 값을 채우기 위한 조회. 저장된 값이 없으면 빈 값으로 200.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [User]
      operationId: putMyPreferences
      summary: 선호 정보 저장 (USR-05)
      description: |
        전체 교체(PUT). 선호 극장은 순위대로 최대 3곳, 존재하지 않는 theaterId는 400.
        극장 존재 확인은 Catalog `GET /theaters` 결과를 User가 10분 캐시해서 쓴다.
        user 행이 아직 없으면(`GET /users/me` 전) 함께 만든다.
        AI-08 추천 입력으로 쓰인다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: 저장된 값
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /internal/users/{userId}/preferences:
    get:
      tags: [Internal]
      operationId: internalGetUserPreferences
      summary: '[AI → User] 추천용 선호 정보'
      description: AI-08 추천 입력. 선호 정보가 없으면 빈 값으로 200(AI는 인기 회차 추천으로 전환). userId는 Cognito `sub`. 타임아웃 연결 1초·응답 3초.
      parameters:
        - name: userId
          in: path
          required: true
          description: Cognito `sub` (36자)
          schema: { type: string, minLength: 36, maxLength: 36, example: 3f2b8c1e-5a47-4d0e-9b6f-0c1d2e3f4a5b }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preferences' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito Access Token. Gateway가 JWKS로 검증한다(ADR-37).

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    BadRequest:
      description: 입력 검증 실패 (code=VALIDATION_FAILED, details에 필드별 사유)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: 토큰 없음·만료 (Gateway가 응답, code=UNAUTHORIZED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 권한 없음 (code=FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: 대상 없음 (code=NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: 상태 충돌 (code=CONFLICT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unavailable:
      description: 의존 서비스 응답 없음 (Gateway 503 포함)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [code, message, traceId, details]
      properties:
        code: { type: string, example: NOT_FOUND }
        message: { type: string, example: 영화를 찾을 수 없습니다. }
        traceId:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: 'GW-03 추적 ID (X-Trace-Id, 소문자 16진수 32자리)'
          example: 7f3c2a9e1b4d4c8aa0e5d6f7b8c9d0e1
        details:
          type: array
          description: 항상 배열(없으면 빈 배열). Booking·Payment와 같은 원소 형식
          items:
            type: object
            required: [field, reason]
            properties:
              field: { type: string, example: size }
              value: { description: 거부된 입력 값 (없으면 null), nullable: true, example: 100 }
              reason: { type: string, example: 50 이하여야 합니다 }

    PageMeta:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }
        totalPages: { type: integer }

    ViewGrade:
      type: string
      description: 'movie.view_grade 원본 값. 전체·12·15·청불'
      enum: [ALL, '12', '15', '19']

    User:
      type: object
      required: [userId, email, name, role, createdAt]
      properties:
        userId: { type: string, minLength: 36, maxLength: 36, description: Cognito `sub`, example: 3f2b8c1e-5a47-4d0e-9b6f-0c1d2e3f4a5b }
        email: { type: string, example: user@example.com }
        name: { type: string, example: 한채연 }
        role:
          type: string
          enum: [USER, ADMIN]
          description: DB에 저장하지 않고 토큰의 cognito:groups에서 계산해 응답에만 넣는다
        createdAt: { type: string, format: date-time }

    MyBooking:
      type: object
      required: [bookingId, status, amount, seatLabels, createdAt]
      properties:
        bookingId: { type: integer, format: int64, example: 1001 }
        status: { type: string, enum: [CONFIRMED, PAYMENT_FAILED, EXPIRED, CANCELED] }
        amount: { type: integer, description: '좌석 수 × 15,000원', example: 30000 }
        screening:
          nullable: true
          description: Catalog 호출 실패 시 null
          allOf:
            - $ref: '#/components/schemas/ScreeningSummary'
        seatLabels:
          type: array
          description: Booking의 booking.seat_labels. 취소·만료·결제 실패 예매도 좌석 번호가 남는다
          items: { type: string }
          example: [J7, J8]
        createdAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time, nullable: true }
        canceledAt: { type: string, format: date-time, nullable: true }

    ScreeningSummary:
      type: object
      required: [screeningId, movieId, movieTitle, theaterName, auditoriumName, startsAt, endsAt]
      properties:
        screeningId: { type: integer, format: int64 }
        movieId: { type: integer, format: int64 }
        movieTitle: { type: string }
        viewGrade: { $ref: '#/components/schemas/ViewGrade' }
        theaterName: { type: string }
        auditoriumName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    Preferences:
      type: object
      required: [preferredTheaterIds, preferredTimeSlot, preferredGenres]
      properties:
        preferredTheaterIds:
          type: array
          maxItems: 3
          uniqueItems: true
          description: 순위순(첫 번째가 1순위)
          items: { type: integer, format: int64 }
          example: [4, 10]
        preferredTimeSlot:
          type: string
          nullable: true
          enum: [MORNING, AFTERNOON, EVENING, NIGHT]
          description: 'MORNING ~12시, AFTERNOON 12~17시, EVENING 17~21시, NIGHT 21시~ (시작 시각 기준)'
        preferredGenres:
          type: array
          items: { type: string }
          description: User는 저장하고 내부 API로 전달만 한다. 추천에 쓸지는 AI API(3.4.6)에서 정한다. 영화 장르 값은 TMDB 장르 이름(ERD 결정 2)
