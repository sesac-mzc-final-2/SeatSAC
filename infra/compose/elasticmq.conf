include classpath("application.conf")
node-address { protocol = http, host = localhost, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0" }
queues {
  cinema-staging-notification-events {
    deadLettersQueue { name = "cinema-staging-notification-events-dlq", maxReceiveCount = 3 }
  }
  cinema-staging-notification-events-dlq {}

  # 6.1.3 서비스 간 메시징(ADR-117) — staging(envs/staging/messaging.tf)과 같은 이름·같은 DLQ 규칙(3회)
  #   SNS는 로컬에 없다 → 이벤트는 구독 큐(…-events)로 직접 보낸다(런타임 계약 3장 「로컬」)
  cinema-staging-user-booking-events {
    deadLettersQueue { name = "cinema-staging-user-booking-events-dlq", maxReceiveCount = 3 }
  }
  cinema-staging-user-booking-events-dlq {}
  cinema-staging-ai-catalog-events {
    deadLettersQueue { name = "cinema-staging-ai-catalog-events-dlq", maxReceiveCount = 3 }
  }
  cinema-staging-ai-catalog-events-dlq {}
  cinema-staging-coupon-commands {
    deadLettersQueue { name = "cinema-staging-coupon-commands-dlq", maxReceiveCount = 3 }
  }
  cinema-staging-coupon-commands-dlq {}
  cinema-staging-payment-commands {
    deadLettersQueue { name = "cinema-staging-payment-commands-dlq", maxReceiveCount = 3 }
  }
  cinema-staging-payment-commands-dlq {}
  cinema-staging-booking-replies {
    deadLettersQueue { name = "cinema-staging-booking-replies-dlq", maxReceiveCount = 3 }
  }
  cinema-staging-booking-replies-dlq {}
}
