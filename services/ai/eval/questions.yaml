# NL2SQL 평가 세트 (WBS 3.4.11 → 4.2.3 입력)
#
# 기준 데이터: eval/snapshot.json (2026-11-10 16:52 KST, staging 공개 API를 capture.py 로 고정)
#   오늘 = 2026-11-10(화). 극장 4곳(건대입구·영등포·월드타워·부산본점), 영화 22편, 회차 1,410개
#   ⚠️ 이 시점 staging은 모든 회차가 remaining_seats_source=TOTAL(실제 잔여석 아님)이라 잔여석 질문은 넣지 않았다.
#   ⚠️ 영화의 장르·감독·줄거리·개봉일·러닝타임이 모두 비어 있어 그 칸을 쓰는 질문도 넣지 않았다.
#
# 칸
#   id        질문 번호
#   family    같은 템플릿(값만 다름)·같은 뜻(다른 말투) 묶음. 반복 시나리오가 "다시 묻기"를 고를 때 쓴다
#   question  사용자 질문
#   gold      정답 SQL. :today·:now·:d1~:d3 은 run.py 가 위 기준 시각으로 넣는다
#   key       정답 비교에 쓰는 칸(정답 SQL 결과의 칸 이름). 답의 어느 칸이든 이 값 집합과 같으면 맞음
#   expect    OUT_OF_SCOPE 처럼 경로로 채점하는 질문
#   note      무엇을 보려는 질문인지

questions:
  # --- 오늘 ○시 이후 (프리셋 today_after_time · 슬롯 time) -------------------------
  - id: q01
    family: after_time
    question: 오늘 20시 이후에 시작하는 영화 알려줘
    gold: |
      SELECT m.title, s.starts_at, t.name AS theater FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :today AND s.starts_at >= :today || ' 20:00' AND s.starts_at > :now
    key: starts_at
  - id: q02
    family: after_time
    question: 오늘 21시 이후에 시작하는 영화 알려줘
    gold: |
      SELECT m.title, s.starts_at, t.name AS theater FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :today AND s.starts_at >= :today || ' 21:00' AND s.starts_at > :now
    key: starts_at
    note: q01과 템플릿 같음 — 캐시가 값만 바꿔 맞게 답해야 한다("20시"↔"21시" 오적중 확인)
  - id: q03
    family: after_time
    question: 오늘 밤 10시 넘어서 하는 영화 있어?
    gold: |
      SELECT m.title, s.starts_at FROM screening s JOIN movie m ON m.movie_id = s.movie_id
      WHERE s.business_date = :today AND s.starts_at >= :today || ' 22:00' AND s.starts_at > :now
    key: starts_at
    note: 같은 뜻 다른 말투 + "밤 10시" → 22:00
  - id: q04
    family: before_time
    question: 오늘 19시 전에 시작하는 영화 알려줘
    gold: |
      SELECT m.title, s.starts_at FROM screening s JOIN movie m ON m.movie_id = s.movie_id
      WHERE s.business_date = :today AND s.starts_at < :today || ' 19:00' AND s.starts_at > :now
    key: starts_at
    note: 뜻 반대("전에") — after_time 캐시를 쓰면 오적중

  # --- 극장 편성표 (프리셋 theater_schedule · 슬롯 date·theater) -------------------
  - id: q05
    family: theater_schedule
    question: 내일 영등포 상영표 보여줘
    gold: |
      SELECT m.title, s.starts_at, s.auditorium_name FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :d1 AND t.name = '영등포' AND s.starts_at > :now
    key: starts_at
  - id: q06
    family: theater_schedule
    question: 내일 건대입구 상영표 보여줘
    gold: |
      SELECT m.title, s.starts_at, s.auditorium_name FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :d1 AND t.name = '건대입구' AND s.starts_at > :now
    key: starts_at
    note: q05와 템플릿 같음, 극장만 다름
  - id: q07
    family: date_theater
    question: 11월 14일 월드타워에서 하는 영화 시간표
    gold: |
      SELECT m.title, s.starts_at FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = '2026-11-14' AND t.name = '월드타워' AND s.starts_at > :now
    key: starts_at
  - id: q08
    family: date_theater
    question: 토요일 부산본점 상영 시간표
    gold: |
      SELECT m.title, s.starts_at FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = '2026-11-14' AND t.name = '부산본점' AND s.starts_at > :now
    key: starts_at
    note: 요일 → 날짜(11/14 토)

  # --- 영화 하나 (movie_theaters·movie_next_screening·movie_runtime) -------------
  - id: q09
    family: movie_where
    question: 오디세이 어디서 해?
    gold: |
      SELECT DISTINCT t.name AS theater FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE m.title = '오디세이' AND s.starts_at > :now
    key: theater
  - id: q10
    family: movie_where
    question: 인턴 상영하는 극장 알려줘
    gold: |
      SELECT DISTINCT t.name AS theater FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE m.title = '인턴' AND s.starts_at > :now
    key: theater
  - id: q11
    family: movie_next
    question: 디거 다음 상영 언제야?
    gold: |
      SELECT min(s.starts_at) AS starts_at FROM screening s JOIN movie m ON m.movie_id = s.movie_id
      WHERE m.title = '디거' AND s.starts_at > :now
    key: starts_at
  - id: q12
    family: movie_runtime
    question: 오디세이 상영 시간 얼마나 돼?
    gold: |
      SELECT coalesce(runtime_minutes, slot_minutes) AS minutes FROM movie WHERE title = '오디세이'
    key: minutes

  # --- 오늘 조건 (screen_type_today·late_night_today·theater_counts_today) --------
  - id: q13
    family: recliner_today
    question: 오늘 리클라이너관 회차 알려줘
    gold: |
      SELECT m.title, s.starts_at FROM screening s JOIN movie m ON m.movie_id = s.movie_id
      WHERE s.business_date = :today AND s.screen_type = 'RECLINER' AND s.starts_at > :now
    key: starts_at
  - id: q14
    family: normal_today
    question: 오늘 일반관 회차 알려줘
    gold: |
      SELECT m.title, s.starts_at FROM screening s JOIN movie m ON m.movie_id = s.movie_id
      WHERE s.business_date = :today AND s.screen_type = 'NORMAL' AND s.starts_at > :now
    key: starts_at
    note: q13과 임베딩이 0.95 이상 — 리클라이너 SQL을 쓰면 오적중
  - id: q15
    family: late_night
    question: 오늘 심야 상영 뭐 있어?
    gold: |
      SELECT m.title, s.starts_at FROM screening s JOIN movie m ON m.movie_id = s.movie_id
      WHERE s.business_date = :today AND (s.start_hour >= 22 OR s.start_hour < 6) AND s.starts_at > :now
    key: starts_at
  - id: q16
    family: theater_counts
    question: 극장별로 오늘 남은 회차 수 알려줘
    gold: |
      SELECT t.name AS theater, count(*) AS cnt FROM screening s JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :today AND s.starts_at > :now GROUP BY t.name
    key: cnt

  # --- 날짜·등급 (movies_on_date·movies_by_view_grade) ---------------------------
  - id: q17
    family: movies_on_date
    question: 내일 상영하는 영화 목록
    gold: |
      SELECT DISTINCT m.title FROM screening s JOIN movie m ON m.movie_id = s.movie_id
      WHERE s.business_date = :d1 AND s.starts_at > :now
    key: title
  - id: q18
    family: grade
    question: 청소년 관람불가 영화 뭐 있어?
    gold: SELECT title FROM movie WHERE view_grade = '19'
    key: title
  - id: q19
    family: grade_all
    question: 전체 관람가 영화 알려줘
    gold: SELECT title FROM movie WHERE view_grade = 'ALL'
    key: title

  # --- 프리셋에 없는 질문 (NL2SQL) ------------------------------------------------
  - id: q20
    family: theater_recliner
    question: 오늘 건대입구 리클라이너 회차 있어?
    gold: |
      SELECT m.title, s.starts_at FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :today AND t.name = '건대입구' AND s.screen_type = 'RECLINER'
        AND s.starts_at > :now
    key: starts_at
  - id: q21
    family: theater_after
    question: 내일 오후 2시 이후 월드타워에서 하는 영화
    gold: |
      SELECT m.title, s.starts_at FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :d1 AND t.name = '월드타워' AND s.starts_at >= :d1 || ' 14:00'
        AND s.starts_at > :now
    key: starts_at
  - id: q22
    family: last_today
    question: 오늘 가장 늦게 시작하는 회차는?
    gold: |
      SELECT max(s.starts_at) AS starts_at FROM screening s
      WHERE s.business_date = :today AND s.starts_at > :now
    key: starts_at
  - id: q23
    family: first_tomorrow
    question: 내일 가장 일찍 시작하는 영화는?
    gold: |
      SELECT min(s.starts_at) AS starts_at FROM screening s
      WHERE s.business_date = :d1 AND s.starts_at > :now
    key: starts_at
  - id: q24
    family: count_today
    question: 오늘 몇 편 상영해?
    gold: |
      SELECT count(DISTINCT s.movie_id) AS cnt FROM screening s
      WHERE s.business_date = :today AND s.starts_at > :now
    key: cnt
  - id: q25
    family: region
    question: 서울에 있는 극장 어디야?
    gold: SELECT name FROM theater WHERE region = '서울'
    key: name
  - id: q26
    family: movie_saturday
    question: 토요일에 오디세이 하는 극장
    gold: |
      SELECT DISTINCT t.name AS theater FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = '2026-11-14' AND m.title = '오디세이' AND s.starts_at > :now
    key: theater

  # --- 범위 밖 ------------------------------------------------------------------
  - id: q27
    family: oos_price
    question: 팝콘 가격 얼마야?
    expect: OUT_OF_SCOPE
  - id: q28
    family: oos_weather
    question: 내일 날씨 어때?
    expect: OUT_OF_SCOPE

