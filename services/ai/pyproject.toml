[project]
name = "seatsac-ai"
version = "0.1.0"
description = "SeatSAC AI 챗봇 서비스 (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    # 스냅샷 적재(3.4.9)가 서비스 실행 중에 공개 API를 부른다. 이미지는 --no-dev로 설치하므로 dev가 아닌 여기에 둔다.
    "httpx>=0.27",
    # 의미 캐시(3.4.5) 임베딩. 모델은 이미지 빌드 때 /app/models 에 받아 둔다(실행 중 다운로드 없음).
    "fastembed>=0.4",
    "sqlglot>=25",
    "pyyaml>=6",
    "anthropic>=0.40",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.26",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seatsac_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 평가 스크립트(3.4.11)는 이미지에 들어가지 않고, 보고서 문장·설명 표가 길다
"eval/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
