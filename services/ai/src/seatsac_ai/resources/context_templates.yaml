# 문맥 이어받기 내부 SQL 틀 3개 (WBS 3.4.22)
#
# 답 아래 「영화 고르기」 버튼을 누르면 앞 답의 날짜·극장에 그 영화를 더해 이 틀로 바로 실행한다
# (seatsac_ai/context.py · llm/orchestrator.py). Claude를 부르지 않는다.
#
# - presets.yaml 과 따로 둔다. 여기 틀은 GET /ai/presets(화면 버튼)·Claude 프롬프트·도구 목록에
#   나가지 않는다 — presets.yaml 에 넣으면 셋 다 바뀌어 정확도를 다시 재야 한다.
# - phrasings 는 한 줄이다: 빈칸(params)이 모두 있는 문장. 세션에 남기는 완성 문장
#   ("11월 18일 부산본점 부활남 회차" — 후속 질문이 조건을 알게)과 예열 항목의 틀 글자로 쓴다.
# - 캐시: 기동 때 틀마다 항목 하나를 `ctx {presetId}` 키로 넣는다(cache/warm.py internal_items).
#   질문 말투의 키가 아니고 의미 색인에도 넣지 않는다 — **직접 친 질문은 이 틀로 답하지 않는다**
#   (이어받기 경로만 이 키를 조회한다). 직접 친 "내일 부산본점 부활남 회차"는 예전처럼 Claude로 간다.
# - title 은 쓰지 않는다(Preset 모양을 맞추는 값). 답 문장 앞부분은 값으로 만든다(context.subject).
# - 표 열(사용자 결정, 11/19): 상영관·상영관 종류·종료 시각·잔여석은 넣지 않는다.
#   날짜는 화면이 시작 시각에 함께 보여 주므로 business_date 열도 두지 않는다.
# - 회차 ID(응답 screeningIds)가 붙는 모양으로 쓴다(sql/validator.py with_screening_id):
#   바깥 SELECT 하나, screening 표 한 번, s.starts_at 그대로.
# - 모든 SQL은 tests/test_context_templates.py 에서 검증기를 통과하고 실제 스냅샷에서 실행돼야 한다.

templates:
  - presetId: ctx_movie_date_theater
    title: "{theater} {movie} 회차"
    params: [date, theater, movie]
    phrasings:
      - "{date} {theater} {movie} 회차"
    sql: |
      SELECT s.starts_at
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :date AND t.name = :theater AND m.title = :movie
        AND s.starts_at > :now
      ORDER BY s.starts_at

  - presetId: ctx_movie_date
    title: "{movie} 회차"
    params: [date, movie]
    phrasings:
      - "{date} {movie} 회차"
    sql: |
      SELECT t.name AS theater_name, s.starts_at
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :date AND m.title = :movie AND s.starts_at > :now
      ORDER BY s.starts_at, t.name

  - presetId: ctx_movie_theater
    title: "{theater} {movie} 회차"
    params: [theater, movie]
    phrasings:
      - "{theater} {movie} 회차"
    sql: |
      SELECT s.starts_at
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE t.name = :theater AND m.title = :movie AND s.starts_at > :now
      ORDER BY s.starts_at
