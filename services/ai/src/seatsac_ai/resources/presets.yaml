# 추천 질문 프리셋 12개 (WBS 3.4.4 · AI-04 · 기능명세서 v4 17-4)
#
# - presetId·title·example 은 GET /ai/presets 로 화면 버튼에 나간다.
#   example 의 {movie} 는 응답할 때 스냅샷에서 지금 상영 회차가 가장 많은 영화 제목으로 채운다
#   (스냅샷 준비 전에는 계약 예시처럼 "영화 제목"). 실제 없는 제목이 버튼에 나가지 않게(#92 리뷰).
#   버튼을 누르면 example 문장이 그대로 POST /ai/chat 의 message 로 간다.
# - description 은 Claude가 읽는다. 질문이 이 프리셋에 맞으면 run_preset 도구를 고른다.
# - params 는 질문에서 뽑는 슬롯 종류(time·date·theater·movie·n)와 등급(grade). SQL의 :이름 과 같다.
#     time    'HH:MM'          (예 '20:00')
#     date    'YYYY-MM-DD'     (예 '2026-11-18')
#     theater 극장 이름        (스냅샷 theater.name 과 정확히 같은 값)
#     movie   영화 제목        (스냅샷 movie.title 과 정확히 같은 값)
#     n       개수 정수        (SQL에서 min(:n, 500) 으로 막힌다)
#     grade   관람 등급        ('ALL'·'12'·'15'·'19'. 질문에서 뽑는 슬롯이 아니라 Claude가 고른다 → 캐시하지 않는다)
# - :today('YYYY-MM-DD')·:now('YYYY-MM-DD HH:MM')는 서버가 항상 넣는다(KST). params 에 적지 않는다.
# - screening 을 조회하는 SQL은 모두 starts_at > :now 를 붙인다(data-model 6-1).
# - 모든 SQL은 test_presets.py 에서 검증기(16장)를 통과하고 실제 스냅샷에서 실행돼야 한다.

presets:
  - presetId: today_after_time
    title: 오늘 ○시 이후 회차
    example: 오늘 20시 이후에 시작하는 영화 알려줘
    description: 오늘 특정 시각 이후에 시작하는 모든 회차 목록
    params: [time]
    sql: |
      SELECT m.title AS movie_title, t.name AS theater_name, s.auditorium_name,
             s.starts_at, s.remaining_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :today AND s.starts_at >= :today || ' ' || :time
        AND s.starts_at > :now
      ORDER BY s.starts_at, t.name

  - presetId: theater_schedule
    title: 극장 편성표
    example: 내일 건대입구 편성표 보여줘
    description: 특정 날짜·특정 극장의 전체 상영 시간표
    params: [date, theater]
    sql: |
      SELECT m.title AS movie_title, s.auditorium_name, s.screen_type, s.starts_at, s.ends_at,
             s.remaining_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :date AND t.name = :theater AND s.starts_at > :now
      ORDER BY s.starts_at, s.auditorium_name

  - presetId: movie_theaters
    title: 영화별 상영 극장·시간
    example: "{movie} 어디서 몇 시에 해?"
    description: 특정 영화를 오늘부터 상영하는 극장과 시각
    params: [movie]
    sql: |
      SELECT t.name AS theater_name, s.business_date, s.starts_at, s.auditorium_name,
             s.remaining_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE m.title = :movie AND s.starts_at > :now
      ORDER BY s.starts_at, t.name

  - presetId: most_remaining_today
    title: 잔여석 많은 오늘 회차
    example: 오늘 자리 많이 남은 회차 5개
    description: 오늘 남은 회차 중 잔여석이 많은 순서로 n개. 잔여석이 정확한 값(BOOKING)인 회차만
    params: [n]
    sql: |
      SELECT m.title AS movie_title, t.name AS theater_name, s.starts_at, s.remaining_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :today AND s.starts_at > :now
        AND s.remaining_seats_source = 'BOOKING'
      ORDER BY s.remaining_seats DESC, s.starts_at
      LIMIT :n

  - presetId: almost_sold_out_today
    title: 매진 임박 회차
    example: 오늘 곧 매진되는 회차 있어?
    description: 오늘 남은 회차 중 잔여석이 전체의 10% 이하(0석 제외)인 회차
    params: []
    sql: |
      SELECT m.title AS movie_title, t.name AS theater_name, s.starts_at,
             s.remaining_seats, s.total_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :today AND s.starts_at > :now
        AND s.remaining_seats_source = 'BOOKING'
        AND s.remaining_seats > 0 AND s.remaining_seats * 10 <= s.total_seats
      ORDER BY s.remaining_seats, s.starts_at

  - presetId: movies_on_date
    title: 날짜별 상영 영화
    example: 토요일에 상영하는 영화 뭐 있어?
    description: 특정 날짜에 상영하는 영화 목록과 회차 수
    params: [date]
    sql: |
      SELECT m.title AS movie_title, m.view_grade, count(*) AS screening_count
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      WHERE s.business_date = :date AND s.starts_at > :now
      GROUP BY m.movie_id, m.title, m.view_grade
      ORDER BY screening_count DESC, m.title

  - presetId: screen_type_today
    title: 상영관 종류별 회차
    example: 오늘 리클라이너관 회차 몇 개야?
    description: 오늘 남은 회차를 상영관 종류(일반관·리클라이너관)별로 센 것
    params: []
    sql: |
      SELECT s.screen_type, count(*) AS screening_count, sum(s.remaining_seats) AS remaining_seats
      FROM screening s
      WHERE s.business_date = :today AND s.starts_at > :now
      GROUP BY s.screen_type
      ORDER BY s.screen_type

  - presetId: movie_next_screening
    title: 영화 다음 회차
    example: "{movie} 다음 회차 언제야?"
    description: 특정 영화의 가장 빠른 다음 회차 5개
    params: [movie]
    sql: |
      SELECT s.starts_at, t.name AS theater_name, s.auditorium_name, s.remaining_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE m.title = :movie AND s.starts_at > :now
      ORDER BY s.starts_at
      LIMIT 5

  - presetId: late_night_today
    title: 심야 회차
    example: 오늘 심야 영화 뭐 있어?
    description: 오늘 영업일의 22시 이후 시작 회차(자정 넘은 회차 포함)
    params: []
    sql: |
      SELECT m.title AS movie_title, t.name AS theater_name, s.starts_at, s.remaining_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :today AND (s.start_hour >= 22 OR s.start_hour < 6)
        AND s.starts_at > :now
      ORDER BY s.starts_at, t.name

  - presetId: movie_runtime
    title: 영화 상영 시간
    example: "{movie} 몇 분짜리야?"
    description: 특정 영화의 상영 시간(분). 실제 러닝타임이 없는 영화는 회차 간격으로 대신한다
    params: [movie]
    sql: |
      SELECT title AS movie_title, coalesce(runtime_minutes, slot_minutes) AS running_minutes
      FROM movie
      WHERE title = :movie

  - presetId: movies_by_view_grade
    title: 관람 등급별 영화
    example: 전체 관람가 영화 알려줘
    description: 지금 상영 중인 영화 중 관람 등급 하나에 해당하는 영화(전체 관람가·12세·15세·청소년 관람불가)
    params: [grade]
    sql: |
      SELECT view_grade, title AS movie_title
      FROM movie
      WHERE view_grade = :grade
      ORDER BY title

  - presetId: theater_counts_today
    title: 극장별 오늘 회차 수
    example: 오늘 극장별로 남은 회차 몇 개야?
    description: 오늘 남은 회차 수를 극장별로 센 것
    params: []
    sql: |
      SELECT t.name AS theater_name, count(*) AS screening_count
      FROM screening s
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = :today AND s.starts_at > :now
      GROUP BY t.theater_id, t.name
      ORDER BY screening_count DESC, t.name
