# Claude에게 주는 스냅샷 설명서 (WBS 3.4.1 · AI-10 · 기능명세서 v4 17-1)
#
# - 표·칸 이름의 원본은 snapshot/schema.py 다. 여기 이름이 다르면 test_schema_yaml.py 가 실패한다.
# - 이 내용은 요청마다 똑같이 Claude system 앞부분에 들어간다(프롬프트 캐싱 대상).
#   그래서 "오늘 날짜" 같은 매번 바뀌는 값은 여기 넣지 않는다. 오늘 날짜는 llm/prompt.py 가
#   이 설명서 뒤에 따로 붙인다(3.4.3).
# - 예시(examples)의 날짜는 "오늘 = 2026-11-17(화), 지금 = 19:40" 이라고 가정한 값이다.

dialect: sqlite

rules:
  - SQLite SELECT 한 문장만 쓴다. 쓰기·PRAGMA·ATTACH·여러 문장은 거부된다.
  - 조회할 수 있는 표는 movie, theater, screening 세 개뿐이다.
  - 시각은 모두 한국 시간(KST) 문자열 'YYYY-MM-DD HH:MM'이다. 시간대 변환을 하지 않는다.
  - 날짜를 SQL 함수(date('now') 등)로 계산하지 않는다. 질문 아래에 주어지는 "오늘"·"지금" 값을 문자열로 그대로 쓴다.
  - 오늘·내일·토요일 같은 날짜 질문은 screening.business_date(영업일)로 거른다. starts_at의 날짜로 거르지 않는다.
  - ○시 이후 질문은 starts_at >= '<날짜> HH:MM' 으로 비교한다. 자정 넘은 심야 회차도 올바르게 포함된다.
  - screening 을 조회하는 SQL에는 항상 starts_at > '<지금>' 을 붙인다. 스냅샷이 최대 1분 늦어 이미 시작한 회차가 남아 있을 수 있다(data-model 6-1).
  - 영화·극장 이름은 질문과 다를 수 있으니 정확히 같을 때는 =, 일부만 맞을 때는 LIKE '%이름%' 을 쓴다.
  - 결과 칸에는 사람이 읽을 이름을 붙인다(AS movie_title 등). id만 돌려주지 않는다.
  - 행 수는 최대 500이다. 많을 수 있는 목록은 ORDER BY 를 붙인다.

tables:
  movie:
    description: 지금 상영 중인 영화 한 편 = 한 줄.
    columns:
      movie_id: 영화 ID (screening.movie_id 가 가리킴)
      title: 영화 제목(한국어)
      title_en: 영어 제목. 없을 수 있음
      view_grade: 관람 등급. 값 뜻은 enums.view_grade
      slot_minutes: 회차 간격(분). 시작~종료 간격의 최빈값이라 광고·정리 시간이 포함된다. 상영 시간 질문에는 쓰지 않는다
      runtime_minutes: 실제 러닝타임(분). 없을 수 있다. 상영 시간 질문은 coalesce(runtime_minutes, slot_minutes) 로 답한다
      release_date: 개봉일 'YYYY-MM-DD'. 없을 수 있음
      director: 감독. 없을 수 있음
      genres: 장르를 쉼표로 이은 문자열(예 'SF,모험'). 장르 조건은 genres LIKE '%액션%'
      synopsis: 줄거리. 없을 수 있음

  theater:
    description: 극장 한 곳 = 한 줄. 좌석 예매가 되는 극장만 있다.
    columns:
      theater_id: 극장 ID (screening.theater_id 가 가리킴)
      name: 극장 이름(예 '건대입구')
      region: 지역(예 '서울'). 없을 수 있음
      has_layout: 좌석 배치도 여부. 이 표에서는 항상 1이라 조건에 쓰지 않는다

  screening:
    description: 상영 회차 한 번 = 한 줄. 오늘부터 6일 뒤까지, 아직 시작하지 않은 회차만 있다.
    columns:
      screening_id: 회차 ID
      movie_id: 상영 영화 → movie.movie_id
      theater_id: 상영 극장 → theater.theater_id
      auditorium_id: 상영관 ID
      auditorium_name: 상영관 이름(예 '1관')
      screen_type: 상영관 종류. 값 뜻은 enums.screen_type
      business_date: 영업일 'YYYY-MM-DD'. 날짜 질문은 이 칸으로 거른다. 자정 넘어 시작하는 심야 회차는 전날 영업일에 속한다
      starts_at: 시작 시각 'YYYY-MM-DD HH:MM'(KST)
      ends_at: 끝나는 시각 'YYYY-MM-DD HH:MM'(KST)
      start_hour: 시작 시각의 '시'(0~23). 심야 질문(22시 이후)은 start_hour >= 22 OR start_hour < 6
      film_format: 상영 포맷(예 '2D'). 없을 수 있음
      total_seats: 전체 좌석 수
      remaining_seats: 남은 좌석 수
      remaining_seats_source: remaining_seats 가 어디서 왔는지. 값 뜻은 enums.remaining_seats_source
      fetched_at: 이 행을 가져온 시각(KST). 답에는 쓰지 않는다

joins:
  - screening.movie_id = movie.movie_id
  - screening.theater_id = theater.theater_id

enums:
  view_grade:
    ALL: 전체 관람가
    "12": 12세 이상 관람가
    "15": 15세 이상 관람가
    "19": 청소년 관람불가
  screen_type:
    NORMAL: 일반관
    RECLINER: 리클라이너관
  remaining_seats_source:
    BOOKING: 예매 서비스의 실시간 값(정확)
    TOTAL: 예매 서비스가 늦게 답해 전체 좌석 수로 대신 채운 값(실제 잔여석 아님). 잔여석·매진 질문에서는 빼거나 '확인 불가'로 다룬다

examples:
  - question: 오늘 20시 이후에 시작하는 영화 알려줘
    sql: |
      SELECT m.title AS movie_title, t.name AS theater_name, s.starts_at, s.remaining_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = '2026-11-17' AND s.starts_at >= '2026-11-17 20:00'
        AND s.starts_at > '2026-11-17 19:40'
      ORDER BY s.starts_at, t.name

  - question: 내일 건대입구 리클라이너관 회차 보여줘
    sql: |
      SELECT m.title AS movie_title, s.auditorium_name, s.starts_at, s.remaining_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = '2026-11-18' AND t.name = '건대입구' AND s.screen_type = 'RECLINER'
        AND s.starts_at > '2026-11-17 19:40'
      ORDER BY s.starts_at

  - question: 지금 자리 제일 많이 남은 회차 3개
    sql: |
      SELECT m.title AS movie_title, t.name AS theater_name, s.starts_at, s.remaining_seats
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date = '2026-11-17' AND s.starts_at > '2026-11-17 19:40'
        AND s.remaining_seats_source = 'BOOKING'
      ORDER BY s.remaining_seats DESC, s.starts_at
      LIMIT 3

  - question: 이번 주말에 액션 영화 어디서 해?
    sql: |
      SELECT m.title AS movie_title, t.name AS theater_name, s.business_date, count(*) AS screening_count
      FROM screening s
      JOIN movie m ON m.movie_id = s.movie_id
      JOIN theater t ON t.theater_id = s.theater_id
      WHERE s.business_date IN ('2026-11-21', '2026-11-22') AND m.genres LIKE '%액션%'
        AND s.starts_at > '2026-11-17 19:40'
      GROUP BY m.title, t.name, s.business_date
      ORDER BY s.business_date, m.title, t.name

  - question: 15세 이상 관람가 영화는 몇 분짜리야?
    sql: |
      SELECT title AS movie_title, coalesce(runtime_minutes, slot_minutes) AS running_minutes
      FROM movie
      WHERE view_grade = '15'
      ORDER BY title
