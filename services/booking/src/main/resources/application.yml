spring:
  application:
    name: booking
  profiles:
    default: local
server:
  port: 8080            # 컨테이너·Service 포트. 로컬은 local 프로필에서 8082
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s   # preStop 5s + graceful 20s (ADR-35)
management:
  endpoints.web.exposure.include: health,prometheus,info
  endpoint.health.probes.enabled: true
  # readiness에 db를 넣는다 (서비스 실행 계약 1장) — DB에 못 붙는 파드는 NotReady가 되어
  # Service 엔드포인트에서 빠진다. liveness에는 외부 의존을 넣지 않는다(기본 livenessState만)
  endpoint.health.group.readiness.include: readinessState,db
  endpoint.health.show-details: never
  metrics.tags.application: booking
  # 3.1.6 블루/그린 분석·3.1.7 대시보드가 http_server_requests_seconds_bucket을 찾는다.
  # 히스토그램이 없으면 p95를 계산할 수 없다 (서비스 실행 계약 1장·5장)
  metrics.distribution.percentiles-histogram.http.server.requests: true
logging:
  config: classpath:logback-spring.xml

# 계약 CI 2단계가 /v3/api-docs 생성본과 contracts/openapi/booking.openapi.yaml 을 비교한다 (계약 확정 #1)
springdoc:
  api-docs.version: openapi_3_1
  api-docs.path: /v3/api-docs

# DB: 서비스별 스키마·계정. 비밀번호는 K8s Secret → 환경변수 (ADR-10)
spring.datasource:
  # UTC 저장: 세션 시간대까지 UTC로 맞춘다 (ERD 1장, 10/21 결정)
  url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/booking_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=utf8}
  username: ${SPRING_DATASOURCE_USERNAME:booking_app}
  password: ${SPRING_DATASOURCE_PASSWORD:local}
  hikari.maximum-pool-size: 5
spring.jpa:
  open-in-view: false
  hibernate.ddl-auto: validate
  properties.hibernate.jdbc.time_zone: UTC
spring.flyway:
  enabled: ${APP_FLYWAY_ON_STARTUP:true}   # 클러스터에서는 PreSync Job이 돌리므로 false
  user: ${SPRING_FLYWAY_USER:booking_migrator}
  password: ${SPRING_FLYWAY_PASSWORD:local}

# 스케줄러: 선점 만료 스캔 2종 + 아웃박스 릴레이·정리 (지침 2장)
spring.task.scheduling.pool.size: 3

# 서비스 간 호출 주소·선점 설정 (service-runtime-contract 3장의 이름 그대로)
app:
  services:
    catalog-url: ${APP_SERVICES_CATALOG_URL:http://catalog:8080}
    payment-url: ${APP_SERVICES_PAYMENT_URL:http://payment:8080}
  seat-hold:
    ttl-seconds: ${APP_SEAT_HOLD_TTL_SECONDS:300}
    strategy: ${APP_SEAT_HOLD_STRATEGY:redis}   # ADR-45 인터페이스. db-lock은 나중
  sqs:
    notification-queue-url: ${APP_SQS_NOTIFICATION_QUEUE_URL:http://localhost:9324/queue/cinema-staging-notification-events}
  outbox:
    # 큐(3.1.8)가 생기기 전에 켜면 확정마다 10회 재시도 끝에 FAILED가 되어 손으로 되살려야 한다.
    # 꺼 두면 PENDING으로 쌓여 있다가 켜는 순간 흘러간다 (booking_outbox_pending으로 보인다)
    relay-enabled: ${APP_OUTBOX_RELAY_ENABLED:false}
    relay-interval: ${APP_OUTBOX_RELAY_INTERVAL:1s}

# SQS: 자격 증명은 Pod Identity(액세스 키 없음). 로컬은 ElasticMQ
spring.cloud.aws:
  region.static: ${AWS_REGION:ap-northeast-2}
  sqs.enabled: true

spring.data.redis:
  host: ${SPRING_DATA_REDIS_HOST:localhost}
  port: ${SPRING_DATA_REDIS_PORT:6379}
  ssl.enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}   # ElastiCache는 true

# Catalog 내부 호출 서킷 — 실패율 50%·10초 (ADR-23·32)
resilience4j:
  circuitbreaker:
    instances:
      payment:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # 4xx는 가용성 문제가 아니다. 응답을 못 받은 경우(503으로 바뀜)와 결과 미확인은 집계한다 —
        # 그래야 payment가 죽었을 때 서킷이 열려 선점을 빨리 포기할 수 있다
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
      catalog:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        # 4xx만 무시한다. BusinessException 전체를 무시하면 InternalRestClientFactory가
        # 타임아웃·5xx를 바꿔 주는 503까지 빠져 Catalog 장애에도 서킷이 열리지 않는다
        ignore-exceptions:
          - com.seatsac.booking.common.ScreeningNotFoundException
          - org.springframework.web.client.HttpClientErrorException
