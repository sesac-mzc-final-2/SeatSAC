# Testcontainers 프로필. DB·Valkey 접속 값은 common-test의 @ServiceConnection이 넣어 준다.
spring:
  flyway:
    enabled: true
    user: test
    password: test
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  # SQS 자동 설정을 끈다 — 테스트는 핸들러·릴레이를 직접 부르고 발송은 가짜로 바꾼다(리스너 빈도 없다)
  cloud.aws:
    sqs.enabled: false
    region.static: ap-northeast-2
    credentials:
      access-key: test
      secret-key: test
app:
  coupon:
    sweep-interval: 1h   # 테스트는 스윕을 직접 부른다
logging.level.org.hibernate.SQL: INFO
