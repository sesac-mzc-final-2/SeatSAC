spring:
  application:
    name: gateway
  profiles:
    default: local
  lifecycle:
    timeout-per-shutdown-phase: 20s           # OPS-03 graceful shutdown 20초
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 1000             # 하위 서비스 연결 1초 (기능명세서 10장)
            response-timeout: 15s             # 결제(BKG-10) 최악 경로 ≈ 12초(Booking→Payment 1+3, 재시도 1+3, 조회 1+3)를 수용. SSE 라우트는 끔
          default-filters:
            - StripPrefix=1                   # /api 제거 (ADR-9). X-User-* 제거·X-Trace-Id 부여는 TraceWebFilter
          # GW-01 라우팅. 위에서부터 먼저 맞는 라우트로 간다 — 좌석 현황·SSE(Booking)가 /screenings/**(Catalog)보다 먼저.
          # /payments·/auth·/internal/**·/actuator/** 라우트는 두지 않는다 (Payment 외부 비노출, 로그인은 Cognito Hosted UI)
          routes:
            - id: booking-seat-stream
              uri: ${app.services.booking-url}
              predicates:
                - Path=/api/screenings/{screeningId}/seats/stream
              metadata:
                response-timeout: -1          # BKG-05 SSE는 끊지 않는다 (heartbeat 15초)
            - id: booking-seats
              uri: ${app.services.booking-url}
              predicates:
                - Path=/api/screenings/{screeningId}/seats
            - id: booking
              uri: ${app.services.booking-url}
              predicates:
                - Path=/api/seats/**,/api/bookings/**
            - id: catalog
              uri: ${app.services.catalog-url}
              predicates:
                - Path=/api/movies/**,/api/screenings/**,/api/theaters/**,/api/auditoriums/**
            - id: catalog-admin
              uri: ${app.services.catalog-url}
              predicates:
                - Path=/api/admin/movies/**,/api/admin/screenings/**,/api/admin/auditoriums/**
            - id: user
              uri: ${app.services.user-url}
              predicates:
                - Path=/api/users/**
app:
  services:                                   # 환경변수 APP_SERVICES_BOOKING_URL 등으로 바꾼다
    catalog-url: http://catalog:8080
    booking-url: http://booking:8080
    user-url: http://user:8080
  cognito:                                    # ADR-37. 값은 Terraform 출력 → gitops env. 기본값을 두지 않아 env가 빠지면 기동이 실패한다
    issuer-uri: ${APP_COGNITO_ISSUER_URI}     # https://cognito-idp.ap-northeast-2.amazonaws.com/{풀 ID}. 자리표시 기본값이면 모든 인증 요청이 401로만 보여 배포 실수를 숨긴다
    client-id: ${APP_COGNITO_CLIENT_ID}
server:
  port: 8080
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true          # readiness 그룹은 readinessState만 (서비스 실행 계약 1장, DB 없음)
  # 인계 #9 (서비스 실행 계약 1장·5장): 3.1.6 gateway 블루/그린 분석·3.1.7 대시보드가
  # http_server_requests_seconds_bucket{application="gateway"} 에 의존한다. 없으면 분석이 지표를 못 찾아 항상 abort
  metrics.tags.application: gateway
  metrics.distribution.percentiles-histogram.http.server.requests: true
