spring:
  application:
    name: gateway
  profiles:
    default: local
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=X-User-Id      # 외부 유입 헤더 제거 (GW-02)
            - RemoveRequestHeader=X-User-Role
            - StripPrefix=1                      # /api 제거 (ADR-9)
          routes:
            # 순서가 중요하다 — API 명세서 2장
            - id: booking-seats
              uri: ${APP_SERVICES_BOOKING_URL:http://booking:8080}
              predicates:
                - Path=/api/screenings/*/seats,/api/screenings/*/seats/stream
            - id: booking
              uri: ${APP_SERVICES_BOOKING_URL:http://booking:8080}
              predicates:
                - Path=/api/seats/**,/api/bookings/**
            - id: catalog
              uri: ${APP_SERVICES_CATALOG_URL:http://catalog:8080}
              predicates:
                - Path=/api/movies/**,/api/screenings/**,/api/theaters/**,/api/auditoriums/**,/api/admin/**
            - id: user
              uri: ${APP_SERVICES_USER_URL:http://user:8080}
              predicates:
                - Path=/api/users/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_COGNITO_ISSUER_URI:https://cognito-idp.ap-northeast-2.amazonaws.com/ap-northeast-2_XXXX}
app:
  cognito:
    client-id: ${APP_COGNITO_CLIENT_ID:changeme}
server:
  port: 8080
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,prometheus
  endpoint.health.probes.enabled: true
