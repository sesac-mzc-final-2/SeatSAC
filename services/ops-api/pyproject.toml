[project]
name = "seatsac-ops-api"
version = "0.1.0"
description = "SeatSAC 관리자 API /ops (FastAPI, 6.1.7 · ADR-119)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "prometheus-client>=0.21",
    # Kubernetes API·Prometheus·ai·coupon 내부 API 호출(모두 클러스터 안)
    "httpx>=0.27",
    # Cognito Access Token 검증(JWKS·RS256)
    "pyjwt[crypto]>=2.9",
    # 리포트(Athena·S3, Pod Identity 자격 증명)
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seatsac_ops"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성 주입 관례(Depends·Query 기본값)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
