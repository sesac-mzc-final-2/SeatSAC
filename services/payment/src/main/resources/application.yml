spring:
  application:
    name: payment
  profiles:
    default: local
server:
  port: 8080            # 컨테이너·Service 포트. 로컬은 local 프로필에서 8084
  shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 20s   # preStop 5s + graceful 20s (ADR-35)
management:
  endpoints.web.exposure.include: health,prometheus,info
  endpoint.health.probes.enabled: true
  # readiness에 db를 넣는다 (서비스 실행 계약 1장) — DB에 못 붙는 파드는 NotReady가 되어
  # Service 엔드포인트에서 빠진다. liveness에는 외부 의존을 넣지 않는다(기본 livenessState만)
  endpoint.health.group.readiness.include: readinessState,db
  endpoint.health.show-details: never
  metrics.tags.application: payment
  # 3.1.6 블루/그린 분석·3.1.7 대시보드가 http_server_requests_seconds_bucket을 찾는다.
  # 히스토그램이 없으면 p95를 계산할 수 없다 (서비스 실행 계약 1장·5장)
  metrics.distribution.percentiles-histogram.http.server.requests: true
logging:
  config: classpath:logback-spring.xml

# DB: 서비스별 스키마·계정. 비밀번호는 K8s Secret → 환경변수 (ADR-10)
spring.datasource:
  url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/payment_db?connectionTimeZone=UTC&characterEncoding=utf8}
  username: ${SPRING_DATASOURCE_USERNAME:payment_app}
  password: ${SPRING_DATASOURCE_PASSWORD:local}
  hikari.maximum-pool-size: 5
spring.jpa:
  open-in-view: false
  hibernate.ddl-auto: validate
  properties.hibernate.jdbc.time_zone: UTC
spring.flyway:
  enabled: ${APP_FLYWAY_ON_STARTUP:true}   # 클러스터에서는 PreSync Job이 돌리므로 false
  user: ${SPRING_FLYWAY_USER:payment_migrator}
  password: ${SPRING_FLYWAY_PASSWORD:local}

# 앱 고유 설정 — 이름은 docs/service-runtime-contract.md 3장 그대로
app:
  payment:
    mock-delay: ${APP_PAYMENT_MOCK_DELAY:5s}             # 지연 카드가 승인될 때까지
    mock-delay-card: ${APP_PAYMENT_MOCK_DELAY_CARD:9999} # 끝 4자리가 이 값이면 지연 승인
    close-stale-on-startup: true                         # 기동 시 PROCESSING 30초 초과 행 정리
  # 포트원 V2 (ADR-112) — 이름은 docs/service-runtime-contract.md 3장 그대로. 비밀 값은 Secret payment-secrets에서
  portone:
    enabled: ${APP_PORTONE_ENABLED:false}                 # false면 TOSSPAY 503 PORTONE_DISABLED, 스윕도 안 돈다
    api-base-url: ${APP_PORTONE_API_BASE_URL:https://api.portone.io}   # 로컬·테스트는 Stub 주소
    api-secret: ${APP_PORTONE_API_SECRET:}                # V2 API Secret — 로그·응답 금지
    webhook-secret: ${APP_PORTONE_WEBHOOK_SECRET:}        # 웹훅 시크릿(whsec_…) — 비어 있으면 모든 웹훅 401
    store-id: ${APP_PORTONE_STORE_ID:}                    # 공개 값(결제창에 노출)
    channel-key-tosspay: ${APP_PORTONE_CHANNEL_KEY_TOSSPAY:}
    pending-timeout: ${APP_PORTONE_PENDING_TIMEOUT:7m}    # 결제창 미완료 PROCESSING 정리 = 선점 300초 + 유예

# 포트원 호출 서킷 — 응답을 못 받은 경우(PortOneUnavailableException)만 실패로 센다. 거절(4xx)·대조 필요는 가용성 문제가 아니다
resilience4j:
  circuitbreaker:
    instances:
      portone:
        failure-rate-threshold: 50
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.seatsac.payment.portone.PortOneUnavailableException
