# Testcontainers 프로필. DB 접속 값은 common-test의 @ServiceConnection이 넣어 준다.
spring:
  flyway:
    # 로컬·테스트는 계정 하나로 기동 시 Flyway. MySQLContainer 기본 계정 = test/test
    enabled: true
    user: test
    password: test
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
app:
  payment:
    # 지연 카드 시연은 5초지만 테스트는 기다리지 않는다
    mock-delay: 50ms
    mock-delay-card: 9999
    # 기동 정리는 테스트가 직접 불러 확인한다 (컨텍스트 기동 때 돌면 세어 볼 수 없다)
    close-stale-on-startup: false
  # 포트원은 테스트마다 가짜 서버(StubHttpServer) 주소를 @DynamicPropertySource로 넣는다
  portone:
    enabled: true
    api-base-url: http://127.0.0.1:1   # 덮어쓰지 않은 테스트가 실수로 밖에 나가지 않게 닿지 않는 주소
    api-secret: test-api-secret
    webhook-secret: whsec_dGVzdC13ZWJob29rLXNlY3JldC0xMjM0NTY3ODkw   # gitleaks:allow — 테스트용 가짜 값
    store-id: store-test
    channel-key-tosspay: channel-key-tosspay-test
    pending-timeout: 7m
logging.level.org.hibernate.SQL: INFO
