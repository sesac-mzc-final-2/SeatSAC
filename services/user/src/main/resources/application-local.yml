server:
  port: 8083
app:
  services:
    booking-url: http://localhost:8082
    catalog-url: http://localhost:8081
  messaging:
    consumer-enabled: true       # 로컬은 ElasticMQ가 있으니 켠다 (infra/compose elasticmq.conf에 같은 큐 이름)
    booking-events-url: http://localhost:9324/queue/cinema-staging-user-booking-events

# ElasticMQ (infra/compose). 자격 증명 값은 쓰이지 않지만 SDK가 요구한다
spring.cloud.aws:
  region.static: ap-northeast-2
  credentials:
    access-key: local
    secret-key: local
  sqs:
    enabled: true
    endpoint: http://localhost:9324
